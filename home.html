<!doctype html>
<html lang="zh-CN">
<head>
<script>
(function(){
  function goLogin(){
    try{document.documentElement.style.display="none"}catch(e){}
    var p=location.pathname+location.search;
    location.replace("/?redirect="+encodeURIComponent(p)+"&reason=auth");
  }
  try{
    if(sessionStorage.getItem("zpAuth")!=="1"){goLogin();return;}
  }catch(e){}
  try{
    window.addEventListener("pageshow",function(ev){
      if(ev.persisted){try{if(sessionStorage.getItem("zpAuth")!=="1")location.replace("/?reason=auth");}catch(e){}}
    });
  }catch(e){}
})();
</script>


<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<title>智配One</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

<script>try{var t=localStorage.getItem("zp_appearance_theme")||"system";var r=(t==="light"||t==="dark")?t:(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.setAttribute("data-zp-theme",r);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",r==="light"?"#F4F6F8":"#05070A");try{var zn=window.ZhipeiNative;if(zn&&zn.applyTheme)zn.applyTheme(r==="light"?"#F4F6F8":"#05070A",r!=="light")}catch(e2){}}catch(e){}</script>
<link rel="stylesheet" href="/css/app.css?v=fc3c9fab"><link rel="stylesheet" href="/css/ui-unified.css?v=5bb9a9e5">
<link rel="stylesheet" href="/css/home.css?v=cb4b9256">
</head>
<body>
<main class="home-app zp-shell">
  <header class="topbar">
    <div class="home-brand">
      <strong>智配One</strong>
      <span>运单处理 · 历史查询 · 路线经验</span>
    </div>
  </header>

  <div class="zp-scroll">
<section class="task-card" aria-labelledby="todayTitle">
    <div class="task-title">
      <div class="task-name">
        <span id="todayTitle">今日配送</span>
        <span class="status-dot" id="statusDot" aria-label="当前线路" hidden></span>
      </div>
      <div id="todayDate" class="today-date task-date">今日</div>
    </div>
    <div class="task-main">
      <div class="task-info">
        <div class="today-summary"><strong id="todayCount">加载中…</strong><span id="todayWeight"></span><span id="substituteBadge" class="sub-badge" hidden>代班</span></div>
      </div>
      <div class="delivery-man" aria-hidden="true"><img src="/assets/delivery-route.webp?v=32331a42" alt=""></div>
    </div>
    <div class="today-store-list" id="todayStoreList" aria-label="今日门店"></div>
    <div class="today-metrics" id="todayMetrics" aria-label="今日统计"></div>
  </section>

  <nav class="bottom-nav" aria-label="主要功能">
    <a class="bottom-nav-item bottom-nav-home is-active" href="/home" aria-current="page">
      <span class="bottom-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.8 12 3.5l8.5 6.3V19a1.5 1.5 0 0 1-1.5 1.5h-3.2v-6H9.2v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg></span>
      <span>首页</span>
    </a>
    <a class="bottom-nav-item" href="/pages/history?from=home">
      <span class="bottom-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 5v4h4"/><path d="M12 7.5v5l3.2 1.9"/></svg></span>
      <span>历史</span>
    </a>
    <button class="bottom-nav-item bottom-nav-plus" id="uploadAction" type="button" aria-label="上传">
      <span class="bottom-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span>
    </button>
    <a class="bottom-nav-item" href="/pages/dispatch?from=home">
      <span class="bottom-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4z"/><path d="M8 10h8M8 14h5"/></svg></span>
      <span>线路</span>
    </a>
    <a class="bottom-nav-item" href="/pages/account?from=home">
      <span class="bottom-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-3.2 3.1-5 7-5s6.2 1.8 7 5"/></svg></span>
      <span>我的</span>
    </a>
  </nav>


  <section class="trend-card" id="trendCard" aria-labelledby="trendTitle" hidden>
    <div class="trend-head">
      <div class="trend-title-row">
        <h2 id="trendTitle" class="trend-title">月度统计</h2>
        <div class="trend-controls">
          <div class="trend-metric" id="trendMetric" role="group" aria-label="趋势指标切换">
            <button id="metricWeight" type="button" class="trend-metric-btn is-active" aria-pressed="true">重量</button>
            <button id="metricCount" type="button" class="trend-metric-btn" aria-pressed="false">单量</button>
          </div>
          <button id="trendYearBtn" class="trend-year" type="button">年度</button>
        </div>
      </div>
      <div class="trend-month-row" id="trendMonthRow">
        <button id="trendPrev" class="trend-nav" type="button" aria-label="上一个月">‹</button>
        <span id="trendMonth" class="trend-month">2026年10月</span>
        <button id="trendNext" class="trend-nav" type="button" aria-label="下一个月">›</button>
      </div>
    </div>
    <div class="trend-chart-wrap" id="trendChartWrap">
      <svg id="trendChart" class="trend-chart" viewBox="0 0 360 120" preserveAspectRatio="none" role="img" aria-label="配送趋势">
        <path id="trendGrid" class="trend-grid" d=""></path>
        <path id="trendArea" class="trend-area" d=""></path>
        <path id="trendLine" class="trend-line" d=""></path>
        <g id="trendPoints"></g>
      </svg>
    </div>
    <div id="trendAxis" class="trend-axis" aria-hidden="true"></div>
    <div class="trend-bottom-row">
      <div class="trend-summary" aria-label="配送汇总">
        <div class="trend-stat"><b id="trendWaybills">0</b><i>单</i><em id="trendWaybillsDelta" class="trend-delta"></em></div>
        <div class="trend-stat"><b id="trendWeight">0.00</b><i>t</i><em id="trendWeightDelta" class="trend-delta"></em></div>
      </div>
      <div id="trendHint" class="trend-hint" aria-live="polite"></div>
    </div>
  </section>


  <div id="uploadArea" class="upload-overlay" hidden aria-hidden="true">
    <div class="upload-sheet" role="dialog" aria-modal="true" aria-labelledby="uploadTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="upload-source-menu active" id="uploadSourceMenu">
        <div class="source-menu-title" id="uploadTitle">上传运单</div>
        <div class="source-menu-options">
          <button class="source-option" data-source="camera" type="button"><span class="source-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h4l1.5-2h5L16 7h4v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><strong>拍摄</strong><small>拍照识别</small></button>
          <button class="source-option" data-source="photo" type="button"><span class="source-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m4 17 5-5 3.5 3.5 2.5-2.5 5 5"/></svg></span><strong>相册</strong><small>图片识别</small></button>
          <button class="source-option" data-source="document" type="button"><span class="source-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v10H3z"/></svg></span><strong>文件</strong><small>PDF 运单</small></button>
        </div>
        <button id="sourceCancel" class="upload-cancel-btn" type="button">取消</button>
      </div>
      <div class="upload-processing-error" id="uploadProcessingError" hidden aria-live="assertive">
        <div class="processing-error-title">处理失败</div>
        <div class="processing-error-message" id="processingErrorMessage">PROCESS_STREAM_INTERRUPTED</div>
        <button id="processingRetry" class="processing-retry-btn" type="button">请重试</button>
      </div>      <div class="upload-processing" id="uploadProcessing" hidden aria-live="polite">
        <div class="processing-title">客官不要急，正在努力中… <span id="processingPercent" aria-hidden="true">0%</span></div>
        <div class="processing-progress" role="progressbar" aria-label="运单处理进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span class="processing-progress-line"><i id="processingProgressDot"></i></span>
        </div>
        <div class="processing-meta">
          <span id="processingStage" class="processing-stage">正在准备…</span>
          <span id="processingElapsed" class="processing-elapsed" aria-hidden="true">已用时 0s</span>
        </div>
        <button id="processingCancel" class="processing-cancel-btn" type="button" hidden>取消处理</button>
      </div>
    </div>
  </div>
  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
  <input id="photoInput" type="file" accept="image/*" multiple hidden>
  <input id="documentInput" type="file" accept="application/pdf,.pdf" hidden>
</div>
</main>

<script>
(()=>{const d=document.getElementById("todayDate");if(d){const f=new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"});d.textContent=f.format(new Date()).replaceAll("/","-")}})();
document.getElementById("logout")?.addEventListener("click",async()=>{const ok=window.zpConfirm?await window.zpConfirm("退出登录","确定要退出当前账号吗？","退出"):true;if(!ok)return;try{await fetch("/api/logout",{method:"POST",credentials:"same-origin",cache:"no-store"})}finally{location.replace("/")}})
</script>
