<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>智配One</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="shell">
<header class="topbar"><strong>智配One</strong><div class="menu-wrap"><button id="menuButton" class="menu-button" type="button" aria-label="打开菜单" aria-expanded="false">☰</button><div id="menuPanel" class="menu-panel" hidden><a href="/pages/route_apply.html">线路申请</a><a href="/pages/data.html">数据资料</a><button id="logout" type="button">退出登录</button></div></div></header>

<nav class="grid"><a href="/pages/order_detail.html">当日运单</a><a href="/pages/history.html">历史查询</a></nav>
