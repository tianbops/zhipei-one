<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<title>智配One</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/home.css">
</head>
<body>
<main class="home-app">
  <header class="home-topbar">
    <div class="home-brand">
      <strong>智配One</strong>
      <span>智能配送·一路领先</span>
    </div>
    <div class="menu-wrap">
      <button id="menuButton" class="home-menu-button" type="button" aria-label="打开菜单" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div id="menuPanel" class="home-menu-panel" hidden>
                <a href="/pages/dispatch.html" id="currentRouteMenu"><span class="menu-item-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M8 10h8M8 14h5"/></svg></span><span>当前线路</span><strong id="currentRouteMenuValue" class="menu-route-value">—</strong></a>
        <a href="/pages/route_apply.html" id="bindingRouteMenu"><span class="menu-item-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M8 10h8M8 14h5"/></svg></span><span>绑定线路</span></a>
        <a href="/pages/data.html"><span class="menu-item-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></span><span>数据中心</span></a>
        <a href="/pages/account.html"><span class="menu-item-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-3.2 3.1-5 7-5s6.2 1.8 7 5"/></svg></span><span>账号设置</span></a>
        <div class="menu-divider" aria-hidden="true"></div>
        <button id="logout" type="button"><span class="menu-item-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 5H5v14h5M13 8l4 4-4 4M8 12h9"/></svg></span><span>退出登录</span></button>
      </div>
    </div>
  </header>

  <section class="task-card" aria-labelledby="todayTitle">
    <div class="task-title">
      <div class="task-name">
        <span id="todayTitle">今日配送</span>
        <span class="status-dot" id="statusDot" aria-label="当前线路">—</span>
      </div>
      <div id="todayDate" class="today-date task-date">今日</div>
    </div>
    <div class="task-main">
      <div class="task-info">
        <div class="today-summary"><strong id="todayCount">加载中…</strong><span id="todayWeight"></span></div>
      </div>
      <div class="delivery-man" aria-hidden="true"><img src="/assets/delivery-route.png" alt=""></div>
    </div>
  </section>

  <nav class="function-list" aria-label="主要功能">
    <button class="function-btn" id="uploadAction" type="button">
      <span class="function-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></span>
      <span>上传运单</span>
    </button>
    <a class="function-btn" href="/pages/today.html">
      <span class="function-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-11.1A7 7 0 0 0 5 9.9C5 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.3"/><path d="M4 18.5h3M17 18.5h3"/></svg></span>
      <span>今日运单</span>
    </a>
    <a class="function-btn" href="/pages/history.html">
      <span class="function-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 5v4h4"/><path d="M12 7.5v5l3.2 1.9"/></svg></span>
      <span>历史查询</span>
    </a>
  </nav>

  <div id="uploadArea" class="upload-overlay" hidden aria-hidden="true">
    <div class="upload-sheet" role="dialog" aria-modal="true" aria-labelledby="uploadTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="upload-source-menu active" id="uploadSourceMenu">
        <div class="source-menu-title" id="uploadTitle">上传运单</div>
        <div class="source-menu-options">
          <button class="source-option" data-source="camera" type="button"><span class="source-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h4l1.5-2h5L16 7h4v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><strong>拍摄</strong></button>
          <button class="source-option" data-source="photo" type="button"><span class="source-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m4 17 5-5 3.5 3.5 2.5-2.5 5 5"/></svg></span><strong>相册</strong></button>
          <button class="source-option" data-source="document" type="button"><span class="source-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v10H3z"/></svg></span><strong>文件</strong></button>
        </div>
        <button id="sourceCancel" class="upload-cancel-btn" type="button">取消</button>
      </div>
      <div class="upload-processing-error" id="uploadProcessingError" hidden aria-live="assertive">
        <div class="processing-error-title">处理失败</div>
        <div class="processing-error-message" id="processingErrorMessage">PROCESS_STREAM_INTERRUPTED</div>
        <button id="processingRetry" class="processing-retry-btn" type="button">请重试</button>
      </div>      <div class="upload-processing" id="uploadProcessing" hidden aria-live="polite">
        <div class="processing-title">客官不要急，正在努力中… <span id="processingPercent">0%</span></div>
        <div class="processing-progress" role="progressbar" aria-label="运单处理进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span class="processing-progress-line"><i id="processingProgressDot"></i></span>
        </div>
      </div>
    </div>
  </div>
  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
  <input id="photoInput" type="file" accept="image/*" hidden>
  <input id="documentInput" type="file" accept="image/*,.pdf" hidden>
</main>
<script src="/js/home.js"></script>
<script>
(()=>{const d=document.getElementById("todayDate");if(d){const f=new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"});d.textContent=f.format(new Date()).replaceAll("/","-")}})();
document.getElementById("logout")?.addEventListener("click",async()=>{try{await fetch("/api/logout",{method:"POST",credentials:"same-origin",cache:"no-store"})}finally{location.replace("/")}})
</script>
</body>
</html>
