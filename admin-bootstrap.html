<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>智配One · 初始化管理员</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="auth-shell">
<section class="auth-card">
<img src="/assets/logo.png" class="logo" alt="智配One">
<h1>初始化管理员</h1>
<p>仅首次建立系统管理员</p>
<form id="form">
<label>管理员账号<input id="username" autocomplete="username" required maxlength="32"></label>
<label>管理员密码<input id="password" type="password" autocomplete="new-password" minlength="6" required></label>
<label>初始化密钥<input id="setupKey" type="password" autocomplete="off" required></label>
<div id="message" class="message"></div>
<button id="button" class="primary-btn" type="submit">建立管理员</button>
</form>
<p><a href="/">返回登录</a></p>
</section>
</main>
<script>
const form=document.getElementById('form');
const message=document.getElementById('message');
const button=document.getElementById('button');
form.addEventListener('submit',async e=>{
 e.preventDefault();
 message.textContent='';
 button.disabled=true;
 button.textContent='建立中…';
 try{
  const r=await fetch('/api/admin/bootstrap',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({
   username:document.getElementById('username').value.trim(),
   password:document.getElementById('password').value,
   setupKey:document.getElementById('setupKey').value
  })});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'初始化失败');
  message.textContent='管理员创建成功，正在进入登录页…';
  setTimeout(()=>location.replace('/'),700);
 }catch(err){
  message.textContent=err.message||'初始化失败';
  button.disabled=false;
  button.textContent='建立管理员';
 }
});
</script>
</body>
</html>
