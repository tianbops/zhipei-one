<!doctype html>
<html lang="zh-CN">
<head>
<script src="/js/error-guard.js?v=da1b8353"></script><script>try{var t=localStorage.getItem("zp_appearance_theme")||"system";var r=(t==="light"||t==="dark")?t:(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.setAttribute("data-zp-theme",r);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",r==="light"?"#FFFFFF":"#161616");}catch(e){}</script><script src="/js/theme-sync.js?v=e56e8350"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>智配One · 初始化管理员</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)"><meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=25f1ad28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="智配One">
<link rel="stylesheet" href="/css/app.css?v=3e4da6dd"><link rel="stylesheet" href="/css/ui-base.css?v=2da4428f"><link rel="stylesheet" href="/css/ui-overlay.css?v=4a2d2981"><link rel="stylesheet" href="/css/ui-theme.css?v=ac2809b5"><link rel="stylesheet" href="/css/ui-shell.css?v=8537d8fb"><link rel="stylesheet" href="/css/entry-brand.css?v=cdf9fe5e">

</head>
<body>
<main class="login-shell">
<section class="login-card">
<div class="login-brand">
<div class="login-brand-row"><span class="login-brand-logo"><img class="login-brand-mark" src="/assets/icons/icon-192.png?v=4d3f7fd9" width="88" height="88" alt="智配One 标志"></span><span class="login-brand-name">智配One</span></div>
</div>

<h1 class="register-title">初始化管理员</h1>

<form id="form" class="login-form">
<label class="login-field">
<span>管理员账号</span>
<input id="username" autocomplete="username" placeholder="请输入管理员账号" required maxlength="32">
</label>

<label class="login-field">
<span>管理员密码</span>
<input id="password" type="password" autocomplete="new-password" placeholder="请输入管理员密码" minlength="8" required>
</label>

<label class="login-field">
<span>初始化密钥</span>
<input id="setupKey" type="password" autocomplete="off" placeholder="请输入初始化密钥" required>
</label>

<div id="message" class="login-message" role="alert"></div>
<button id="button" class="login-submit" type="submit">建立管理员</button>
</form>

<div class="login-links">
<a href="/">返回登录</a>
</div>
</section>
</main>
<script>
const form=document.getElementById('form');
const message=document.getElementById('message');
const button=document.getElementById('button');

form.addEventListener('submit',async e=>{
 e.preventDefault();
 message.textContent='';
 button.disabled=true;
 button.textContent='建立中…';
 try{
  const r=await fetch('/api/admin/bootstrap',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({
   username:document.getElementById('username').value.trim(),
   password:document.getElementById('password').value,
   setupKey:document.getElementById('setupKey').value
  })});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'初始化失败');
  message.textContent='管理员创建成功，正在进入登录页…';
  setTimeout(()=>location.replace('/'),700);
 }catch(err){
  message.textContent=err.message||'初始化失败';
  button.disabled=false;
  button.textContent='建立管理员';
 }
});
</script>
<script src="/js/ui/feedback.js?v=8a4741f4"></script><script src="/js/pwa.js?v=68dbac73"></script>
<script defer src="/js/boot-ready.js?v=4e3f49ea"></script>
</body>
</html>
