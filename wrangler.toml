name = "tianyou-zhipei"
compatibility_date = "2026-09-26"
pages_build_output_dir = "."

[[r2_buckets]]
binding = "WAYBILL_FILES"
bucket_name = "zhipei-one-files"

# D1 数据库绑定（Upstash Redis 替代层）——已于 2026-10-27 启用（数据已搬迁并验证）。
# 回退开关：注释掉下方 [[d1_databases]] 块并重新部署，即自动回退 Upstash（无 env.DB 时 _redis.js 走 REST）。
[[d1_databases]]
binding = "DB"
database_name = "zhipei-one"
database_id = "1f54575a-c467-4b8e-be0a-e5437ed79464"
