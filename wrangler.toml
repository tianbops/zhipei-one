name = "tianyou-zhipei"
compatibility_date = "2026-09-26"
pages_build_output_dir = "."

[[r2_buckets]]
binding = "WAYBILL_FILES"
bucket_name = "zhipei-one-files"

# D1 数据库绑定（Upstash Redis 替代层）
# 【切换开关】当前保持注释：无 env.DB 时 functions/api/_redis.js 自动回退 Upstash，生产行为不变。
# 切换步骤（详见 Upstash-to-D1迁移方案.md 第八章）：
#   1) npx wrangler d1 create zhipei-one
#   2) 取消下方注释并把返回的 uuid 填到 database_id
#   3) npx wrangler d1 execute zhipei-one --file=migrations/0001_init_kv.sql --remote
#   4) 维护窗口内：export → verify → load → deploy → 开写
# [[d1_databases]]
# binding = "DB"
# database_name = "zhipei-one"
# database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
