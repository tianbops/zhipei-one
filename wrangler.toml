name = "tianyou-zhipei"
compatibility_date = "2026-09-26"
pages_build_output_dir = "."

[[r2_buckets]]
binding = "WAYBILL_FILES"
bucket_name = "zhipei-one-files"

# D1 数据库绑定（Upstash Redis 替代层）
# 【切换开关】当前保持注释：无 env.DB 时 functions/api/_redis.js 自动回退 Upstash，生产行为不变。
# 数据库已创建：zhipei-one（database_id 见下）。启用切换前必须先完成：
#   1) 建表：npx wrangler d1 execute zhipei-one --file=migrations/0001_init_kv.sql --remote
#   2) 数据搬迁（维护窗口）：export → verify → load → deploy → 开写
# 详见 Upstash-to-D1迁移方案.md 第八章。
