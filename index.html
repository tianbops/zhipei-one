<!doctype html><html lang="zh-CN"><head><script>try{var t=localStorage.getItem("zp_appearance_theme")||"system";var r=(t==="light"||t==="dark")?t:(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");if(r==="light")document.documentElement.setAttribute("data-zp-theme","light")}catch(e){}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>智配One · 登录</title>

<meta name="apple-mobile-web-app-title" content="智配One"><link rel="stylesheet" href="/css/app.css?v=9a61438e"><link rel="stylesheet" href="/css/ui-unified.css?v=f42de825"><style>.password-field{position:relative}.password-field input{padding-right:52px}.password-toggle{position:absolute;right:6px;bottom:0;width:40px;height:48px;padding:0;border:0;background:transparent;color:#8f9aa6;display:flex;align-items:center;justify-content:center;cursor:pointer}.password-toggle:hover{color:#d5dce2}.password-toggle svg{width:20px;height:20px;pointer-events:none}</style></head><body><main class="login-shell"><section class="login-card" aria-label="登录"><div class="login-brand"><div class="login-brand-row"><span class="login-brand-badge"><img src="/assets/logo.png?v=893e3500" class="login-logo" alt="智配One"></span><span class="login-brand-name">智配One</span></div><div class="login-eyebrow">SMART DELIVERY OPS</div><h1 class="login-headline">每一件货物，都有自己的线路。</h1><p class="login-sub">登录后，继续今天的配送与回单。</p></div><form id="loginForm" class="login-form"><label class="login-field"><span>账号</span><input id="username" autocomplete="username" placeholder="请输入账号" required></label><label class="login-field password-field"><span>密码</span><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required><button type="button" class="password-toggle" data-password-toggle="password" aria-label="显示密码" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 12s3.2-5 9.8-5 9.8 5 9.8 5-3.2 5-9.8 5-9.8-5-9.8-5Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></label><div id="loginMessage" class="login-message" role="alert"></div><button id="loginButton" class="login-submit" type="submit">登录</button></form><div class="login-links"><span class="register-hint">没有账号？</span><a href="/register.html">注册</a></div></section></main><script>
/* PWA 配套：会话仍有效时直达目标页。
   否则从桌面图标每次打开都停在登录页，需要再点一次登录。
   退出登录后 /api/me 返回 401，不会跳转，换账号不受影响。

   重要边界：用户按「返回」退回到本页时不自动直达。否则管理员端退出时会先落到
   登录页，再被这里按角色送去别处（管理员被甩到司机首页、或司机被甩回管理端），
   表现为「按返回却穿越到了另一个区」。回退进来就停在登录页，由用户自行决定。

   2026-10-05 事故加固（登录页↔管理端来回跳动）：
   1) 请求带 ?autoMe= 时间戳。登录页的 /api/me 是全站唯一不带参数的稳定 URL，
     任何按 URL 缓存的中间层（CDN/代理/边缘）都可能命中旧会话时代的响应，
     把普通用户按旧角色（管理员）送去 /admin。管理端早就用了 ?adminCheck= 防
     这一手，登录页当时漏掉了。
   2) 自动直达保险丝：10 秒内自动跳转满 3 次就停手，留在登录页由用户手动操作。
     就算上游仍返回不一致的角色，也只多跳一次，绝不无限互跳。 */
(function(){try{
 // 进入登录页即清空工作区归属：退出登录都会先回到本页，
 // 避免上一会话的角色残留把随后登录的司机误判成管理员。
 try{sessionStorage.removeItem("zpRole")}catch(e){}
 var navEntry=(performance.getEntriesByType&&performance.getEntriesByType("navigation")[0])||null;
 if(navEntry&&navEntry.type==="back_forward")return;
 var now=Date.now(),hop=null;
 try{hop=JSON.parse(sessionStorage.getItem("zpAutoHop")||"null")}catch(e){}
 if(hop&&now-(hop.t||0)<10000&&(hop.n|0)>=3){try{sessionStorage.removeItem("zpAutoHop")}catch(e){}return}
 fetch("/api/me?autoMe="+now,{credentials:"same-origin",cache:"no-store"})
  .then(function(r){return r.ok?r.json():null})
  .then(function(d){
   var u=d&&d.user;if(!u)return;
   var _isAdmin=u.role==="admin"||u.role==="system_admin";
   // 管理员端与司机端同处一个 PWA 窗口：直接 replace 进入，admin 即栈底；
   // 系统返回由 ui-unified.js 守卫接管（第一次左滑提示「再按一次退出」，第二次退出到桌面）。
   try{sessionStorage.setItem("zpAutoHop",JSON.stringify({t:now,n:((hop&&now-(hop.t||0)<10000)?(hop.n|0):0)+1}))}catch(e){}
   try{sessionStorage.setItem("zpRole",_isAdmin?"admin":"user")}catch(e){}
   location.replace(_isAdmin?"/admin.html?v="+now:"/home.html?v="+now);
  }).catch(function(){});
}catch(e){}})();
</script><script src="/js/login.js?v=b5bf111b"></script><script src="/js/pwa.js?v=864ce384"></script>
