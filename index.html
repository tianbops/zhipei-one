<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>智配One · 登录</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="login-shell"><section class="login-card"><div class="login-brand"><img src="/assets/logo.png" class="login-logo" alt="智配One"></div><form id="loginForm" class="login-form"><label class="login-field"><span>账号</span><input id="username" autocomplete="username" placeholder="请输入账号" required></label><label class="login-field"><span>密码</span><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label><div id="loginMessage" class="login-message" role="alert"></div><button id="loginButton" class="login-submit" type="submit">登录</button></form><div class="login-links"><span class="register-hint">没有账号？</span><a href="/register.html">注册</a></div></section></main><script src="/js/login.js"></script></body></html>
