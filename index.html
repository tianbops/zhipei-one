<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>智配One · 登录</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#05070A">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="智配One"><link rel="stylesheet" href="/css/app.css?v=e634d2ad"><link rel="stylesheet" href="/css/ui-unified.css?v=7002fcef"><style>.password-field{position:relative}.password-field input{padding-right:52px}.password-toggle{position:absolute;right:6px;bottom:0;width:40px;height:48px;padding:0;border:0;background:transparent;color:#8f9aa6;display:flex;align-items:center;justify-content:center;cursor:pointer}.password-toggle:hover{color:#d5dce2}.password-toggle svg{width:20px;height:20px;pointer-events:none}</style></head><body><main class="login-shell"><section class="login-card" aria-label="登录"><div class="login-brand"><img src="/assets/logo.png" class="login-logo" alt="智配One"></div><form id="loginForm" class="login-form"><label class="login-field"><span>账号</span><input id="username" autocomplete="username" placeholder="请输入账号" required></label><label class="login-field password-field"><span>密码</span><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required><button type="button" class="password-toggle" data-password-toggle="password" aria-label="显示密码" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 12s3.2-5 9.8-5 9.8 5 9.8 5-3.2 5-9.8 5-9.8-5-9.8-5Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></label><div id="loginMessage" class="login-message" role="alert"></div><button id="loginButton" class="login-submit" type="submit">登录</button></form><div class="login-links"><span class="register-hint">没有账号？</span><a href="/register.html">注册</a></div></section></main><script>
/* PWA 配套：会话仍有效时直达目标页。
   否则从桌面图标每次打开都停在登录页，需要再点一次登录。
   退出登录后 /api/me 返回 401，不会跳转，换账号不受影响。 */
(function(){try{
 fetch("/api/me",{credentials:"same-origin",cache:"no-store"})
  .then(function(r){return r.ok?r.json():null})
  .then(function(d){
   var u=d&&d.user;if(!u)return;
   location.replace(u.role==="admin"||u.role==="system_admin"?"/admin.html?v="+Date.now():"/home.html?v="+Date.now());
  }).catch(function(){});
}catch(e){}})();
</script><script src="/js/login.js?v=2d66a243"></script><script src="/js/pwa.js?v=864ce384"></script>
</body></html>
