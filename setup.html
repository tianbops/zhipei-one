<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>智配One · 系统初始化</title><link rel="stylesheet" href="css/app.css"></head><body><main class="auth-shell"><section class="auth-card"><img src="assets/logo.png" class="logo" alt="智配One"><h1>系统初始化</h1><p>仅用于重新建立干净的智配One系统</p><button id="resetButton" type="button">清空全部系统数据</button><hr><form id="bootstrapForm"><h2>重新建立系统管理员</h2><label>管理员账号<input id="username" autocomplete="username" required></label><label>管理员名称<input id="name" value="系统管理员"></label><label>管理员密码<input id="password" type="password" autocomplete="new-password" minlength="6" required></label><button type="submit">建立管理员</button></form><div id="message" class="message" aria-live="polite"></div><p><a href="/">返回登录</a></p></section></main><script>
const msg=document.getElementById("message"),reset=document.getElementById("resetButton"),form=document.getElementById("bootstrapForm");
async function readResponse(r){
  const text=await r.text();
  let data=null;
  try{data=JSON.parse(text)}catch{}
  return {data,text};
}
reset.addEventListener("click",async()=>{if(!confirm("确认清空智配One全部数据？此操作不可恢复。"))return;reset.disabled=true;try{const r=await fetch("/api/admin/reset",{method:"POST"});const result=await readResponse(r);if(!r.ok)throw new Error(result.data?.error||(`服务器响应异常（HTTP ${r.status}）`)+(result.data ? "" : ""));msg.textContent="清空完成，现在可以建立新的系统管理员。";}catch(e){msg.textContent=e.message||"清空失败";}finally{reset.disabled=false;}});
form.addEventListener("submit",async e=>{e.preventDefault();const username=document.getElementById("username").value.trim(),name=document.getElementById("name").value.trim(),password=document.getElementById("password").value;try{const r=await fetch("/api/bootstrap",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({username,name,password})});const result=await readResponse(r);if(!result.data){const preview=result.text.replace(/\\s+/g," ").slice(0,160);throw new Error(`服务器返回非JSON（HTTP ${r.status}）${preview?`：${preview}`:""}`);}const d=result.data;if(!r.ok)throw new Error(d.detail ? `${d.error}：${d.detail}` : (d.error||"建立失败"));msg.textContent="管理员建立成功，请返回登录。";form.reset();document.getElementById("name").value="系统管理员";}catch(e){msg.textContent=e.message||"建立失败";}});
</script></body></html>
