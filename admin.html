<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>智配One · 管理后台</title>
<link rel="stylesheet" href="css/app.css">
<style>
.admin-shell{min-height:100dvh;padding:20px 14px 32px;background:#05070a}
.admin-panel{width:min(100%,620px);margin:0 auto}
.admin-head{display:flex;align-items:center;gap:12px;padding:10px 4px 20px}
.admin-head .logo{width:36px;height:36px;object-fit:contain;flex:none}
.admin-head h1{margin:0;font-size:22px;line-height:1.2}
.admin-head p{margin:4px 0 0;color:#9da8b3;font-size:13px}
.admin-card{background:#18212b;border:1px solid #27323d;border-radius:16px;padding:18px;margin-bottom:14px}
.admin-card h2{margin:0 0 14px;font-size:17px}
.admin-card h2 span{color:#8f9aa6;font-size:12px;font-weight:400;margin-left:6px}
.admin-form{display:flex;gap:10px;align-items:end}
.admin-form label{flex:1;margin:0}
.admin-form input{height:46px;margin-top:6px}
.admin-form button{width:104px;height:46px;padding:0;font-size:15px;flex:none}
.admin-list{display:grid;gap:8px}
.admin-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:10px 12px;background:#10171e;border:1px solid #26313b;border-radius:11px}
.admin-main{min-width:0}
.admin-name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-meta{margin-top:4px;color:#8f9aa6;font-size:12px}
.admin-badge{flex:none;padding:4px 8px;border-radius:8px;background:#26313c;color:#b8c2cc;font-size:12px}.admin-row button.admin-badge{border:0;cursor:pointer;min-width:48px}.admin-row button.admin-badge:hover{filter:brightness(.96)}
.admin-empty{padding:18px 4px;color:#8f9aa6;font-size:13px}
.invite-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.invite-grid label{margin:0}.invite-grid input{height:44px;margin-top:6px}.invite-actions{display:flex;gap:8px;margin-top:10px}.invite-actions button{height:44px;flex:1}.invite-code{font-family:ui-monospace,monospace;letter-spacing:.5px}.invite-copy{margin-top:5px;color:#b8c2cc;font-size:12px}
.admin-footer{text-align:center;padding:4px 0 0}
.admin-footer button{width:100%;height:46px}
.admin-message{min-height:20px;margin:-2px 2px 12px;font-size:13px}
@media (max-width:480px){
.admin-shell{padding:12px 12px 24px}
.admin-head{padding:8px 3px 16px}
.admin-card{padding:16px;margin-bottom:12px}
.admin-form{gap:8px}
.admin-form button{width:92px}
}
</style>
</head>
<body>
<main class="admin-shell">
<div class="admin-panel">
<header class="admin-head">
<img src="assets/logo.png" class="logo" alt="智配One">
<div><h1>管理后台</h1><p id="who">正在验证管理员身份…</p></div>
</header>

<div id="message" class="message admin-message"></div>

<section class="admin-card">
<h2>线路管理 <span>创建配送线路</span></h2>
<form id="routeForm" class="admin-form">
<label>线路名称<input id="routeName" placeholder="例如 17号线" required></label>
<button type="submit">创建线路</button>
</form>
<div id="routes" class="admin-list" style="margin-top:12px">加载中…</div>
</section>

<section class="admin-card">
<h2>邀请码管理 <span>控制业务账号注册</span></h2>
<form id="inviteForm">
<div class="invite-grid">
<label>使用次数<input id="inviteMaxUses" type="number" min="1" max="9999" value="1" required></label>
<label>有效期<input id="inviteExpiresAt" type="datetime-local"></label>
</div>
<div class="invite-actions"><button type="submit">生成邀请码</button></div>
</form>
<div id="invites" class="admin-list" style="margin-top:12px">加载中…</div>
</section>

<section class="admin-card">
<h2>线路申请审核 <span>用户 / 线路 / 岗位 / 审核结果</span></h2>
<div id="routeRequests" class="admin-list">加载中…</div>
</section>

<section class="admin-card">
<h2>用户管理 <span>账号与状态</span></h2>
<div id="users" class="admin-list">加载中…</div>
</section>

<div class="admin-footer">
<button id="logout" type="button">退出登录</button>
</div>
</div>
</main>
<script>
const $=id=>document.getElementById(id),msg=t=>{ $('message').textContent=t||'' };
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'请求失败');return d}
function routeRow(r){return '<div class="admin-row"><div class="admin-main"><div class="admin-name">'+r.name+'</div><div class="admin-meta">线路状态</div></div><span class="admin-badge">'+(r.status||'active')+'</span></div>'}
function userRow(u){return '<div class="admin-row"><div class="admin-main"><div class="admin-name">'+u.username+'</div><div class="admin-meta">'+(u.role||'user')+'</div></div><span class="admin-badge">'+(u.disabled?'已停用':'正常')+'</span></div>'}
function routeRequestRow(x){const duty=x.duty==='driver'?'司机':x.duty==='delivery'?'配送':'未知岗位';const created=x.createdAt?new Date(x.createdAt).toLocaleString():'—';const status=x.status==='pending'?'待审核':x.status==='approved'?'已批准':x.status==='rejected'?'已驳回':'未知';const reviewed=x.reviewedAt?' · 审核：'+new Date(x.reviewedAt).toLocaleString():'';const actions=x.status==='pending'?'<div style="display:flex;gap:6px;flex:none"><button type="button" class="admin-badge" data-request-id="'+x.id+'" data-request-action="reject">驳回</button><button type="button" class="admin-badge" data-request-id="'+x.id+'" data-request-action="approve">批准</button></div>':'<span class="admin-badge">'+status+'</span>';return '<div class="admin-row"><div class="admin-main"><div class="admin-name">'+(x.name||x.username||'未知用户')+' · '+duty+'</div><div class="admin-meta">账号：'+(x.username||'—')+' · 线路：'+(x.routeName||'未知线路')+' · 申请：'+created+reviewed+'</div></div>'+actions+'</div>'}
function renderRouteRequests(items){items.sort((a,b)=>{const rank={pending:0,approved:1,rejected:2};return (rank[a.status]??9)-(rank[b.status]??9)});$('routeRequests').innerHTML=items.length?items.map(routeRequestRow).join(''):'<div class="admin-empty">暂无线路申请记录</div>';document.querySelectorAll('[data-request-id]').forEach(b=>b.onclick=async()=>{const action=b.dataset.requestAction;const label=action==='approve'?'批准':'驳回';if(!confirm('确定'+label+'该线路申请吗？'))return;try{msg('正在'+label+'…');await api('/api/admin/route-requests',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({requestId:b.dataset.requestId,action})});msg('审核已'+(action==='approve'?'批准':'驳回'));await load()}catch(e){msg(e.message)}})}
function inviteRow(c){const used=(c.usedCount||0)+'/'+c.maxUses;const expired=c.expiresAt&&Date.parse(c.expiresAt)<=Date.now();const state=!c.enabled?'已停用':expired?'已过期':(c.maxUses>0&&c.usedCount>=c.maxUses)?'已用完':'可用';return '<div class="admin-row"><div class="admin-main"><div class="admin-name invite-code">'+c.code+'</div><div class="invite-copy">使用 '+used+' · '+(c.expiresAt?new Date(c.expiresAt).toLocaleString():'长期有效')+'</div></div><div style="display:flex;gap:6px;flex:none"><button type="button" class="admin-badge" data-copy-code="'+c.code+'">复制</button><button type="button" class="admin-badge" data-invite-id="'+c.id+'" data-invite-action="'+(c.enabled?'disable':'enable')+'">'+state+'</button></div></div>'}
async function copyInviteCode(code,button){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(code)}else{const ta=document.createElement('textarea');ta.value=code;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');ta.remove()}const old=button.textContent;button.textContent='已复制';setTimeout(()=>button.textContent=old,1200)}catch(e){msg('复制失败，请长按邀请码手动复制')}}
async function load(){
try{
const me=await api('/api/me');
if(me.user?.role!=='admin')throw new Error('当前账号不是系统管理员');
$('who').textContent='管理员：'+(me.user.username||'');
const [rs,us,ics,rr]=await Promise.all([api('/api/routes'),api('/api/admin/users'),api('/api/admin/invite-codes'),api('/api/admin/route-requests')]);
$('routes').innerHTML=rs.routes.length?rs.routes.map(routeRow).join(''):'<div class="admin-empty">暂无线路</div>';
$('users').innerHTML=us.users.length?us.users.map(userRow).join(''):'<div class="admin-empty">暂无用户</div>';
$('invites').innerHTML=ics.codes.length?ics.codes.map(inviteRow).join(''):'<div class="admin-empty">暂无邀请码</div>';renderRouteRequests(rr.requests||[]);document.querySelectorAll('[data-copy-code]').forEach(b=>b.onclick=()=>copyInviteCode(b.dataset.copyCode,b));document.querySelectorAll('[data-invite-id]').forEach(b=>b.onclick=async()=>{try{await api('/api/admin/invite-codes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:b.dataset.inviteAction,id:b.dataset.inviteId})});await load()}catch(e){msg(e.message)}});
}catch(e){msg(e.message);setTimeout(()=>location.replace('/'),800)}
}
$('routeForm').addEventListener('submit',async e=>{
e.preventDefault();
try{
await api('/api/routes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('routeName').value.trim()})});
$('routeName').value='';msg('线路创建成功');await load();
}catch(e){msg(e.message)}
});
$('inviteForm').addEventListener('submit',async e=>{e.preventDefault();try{const v=$('inviteExpiresAt').value;const r=await api('/api/admin/invite-codes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'create',maxUses:Number($('inviteMaxUses').value),expiresAt:v?new Date(v).toISOString():null})});msg('邀请码已生成：'+r.code.code);$('inviteExpiresAt').value='';await load()}catch(e){msg(e.message)}});
$('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{});location.replace('/')};
load();
</script>
</body>
</html>
