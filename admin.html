</style></head><body><main class="shell"><div class="panel"><header class="head"><img src="/assets/logo.png" alt="智配One"><div class="head-info"><h1>管理员</h1><div id="who" class="who">正在验证身份…</div></div><button id="menuBtn" class="menu-btn" aria-label="打开系统设置">☰</button></header><nav class="tabs"><button class="tab active" data-i="0">用户管理</button><button class="tab" data-i="1">线路管理</button><button class="tab" data-i="2">线路审核</button><button class="tab" data-i="3">邀请码</button></nav><div id="viewport" class="viewport"><div id="pages" class="pages"><section class="page"><div class="title">用户管理</div><div class="search"><span>⌕</span><input id="search" placeholder="搜索用户名"></div><div id="users" class="list"></div></section><section class="page"><div class="title"><span>线路管理</span><button id="addRoute" class="add">＋</button></div><div id="routes" class="list"></div></section><section class="page"><div class="title">线路审核</div><div id="requests" class="list"></div></section><section class="page"><div class="title"><span>邀请码</span><button id="addInvite" class="add">＋</button></div><div id="invites" class="list"></div></section></div></div></div></main><div id="dlg" class="dialog-bg" hidden><div class="dialog"><h2 id="dt"></h2><p id="dp"></p><div id="db"></div><div class="dialog-actions"><button id="dc" class="cancel">取消</button><button id="do" class="ok">确定</button></div></div></div><div id="menuBg" class="dialog-bg menu-bg" hidden><div class="dialog"><h2>系统设置</h2><div class="card" style="margin-top:10px"><div id="editUser" class="setting"><div>用户名<div id="userMeta" class="meta"></div></div><span class="chev">›</span></div><div id="editPass" class="setting">修改密码<span class="chev">›</span></div><div id="reset" class="setting">重置数据<span class="chev">›</span></div><div id="logout" class="setting">退出登录</div></div></div></div><div id="toast" class="toast"></div><script>
window.__adminBootStarted=Date.now();
const $=id=>document.getElementById(id),S={page:0,users:[],routes:[],requests:[],invites:[],me:null},esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function api(u,o={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const r=await fetch(u,{credentials:"same-origin",cache:"no-store",...o,signal:controller.signal}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||("请求失败（"+r.status+"）"));return d}catch(e){if(e?.name==="AbortError")throw Error("服务器响应超时");throw e}finally{clearTimeout(timer)}}let tm;function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(tm);tm=setTimeout(()=>$("toast").classList.remove("show"),1500)}function close(){dlg.hidden=true;db.innerHTML="";const mb=$("menuBg");if(mb)mb.hidden=true}function open(t,p,b="",ok="确定",danger=false,fn){dt.textContent=t;dp.textContent=p;db.innerHTML=b;do_.textContent=ok;do_.classList.toggle("danger",danger);dlg.hidden=false;dc.onclick=close;do_.onclick=async()=>{if(!fn)return close();do_.disabled=true;try{await fn()}catch(e){toast(e.message)}finally{do_.disabled=false}}}const dlg=$("dlg"),dt=$("dt"),dp=$("dp"),db=$("db"),dc=$("dc"),do_=$("do");function page(i){S.page=Math.max(0,Math.min(3,i));closeSwipes();$("pages").style.transform="translateX(-"+S.page*25+"%)";document.querySelectorAll(".tab").forEach((b,n)=>b.classList.toggle("active",n===S.page))}function closeSwipes(){document.querySelectorAll(".row.open,.route.open").forEach(x=>x.classList.remove("open"))}function sw(el){let x=0,y=0;el.addEventListener("touchstart",e=>{if(!dlg.hidden)return;x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});el.addEventListener("touchend",e=>{if(!dlg.hidden)return;const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.25){e.stopPropagation();closeSwipes();if(dx<0)el.classList.add("open")}},{passive:true})}
function renderUsers(){const q=$("search").value.trim().toLowerCase(),a=S.users.filter(u=>(u.username||"").toLowerCase().includes(q));$("users").innerHTML=a.length?a.map((u)=>'<div class="row"><div class="actions">'+(u.boundRouteId?'<button class="act normal" data-u="unbind">解绑</button>':'<button class="act normal" data-u="bind">绑定</button>')+'<button class="act danger" data-u="delete">删除</button></div><div class="content"><div class="main"><strong>'+esc(u.username)+'</strong><div class="meta">'+esc(u.boundRouteId?(u.routeName||"线路未知")+" · "+(u.routeDuty==="driver"?"司机":"配送"):"暂无绑定线路")+'</div></div></div></div>').join(""):'<div class="empty">暂无用户</div>';document.querySelectorAll("#users .row").forEach((e,i)=>{sw(e);e.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>userAct(a[i],b.dataset.u))})}

function renderRoutes(){$("routes").innerHTML=S.routes.length?S.routes.map(r=>'<div class="route"><button class="route-delete" data-r="delete" data-id="'+esc(r.id)+'">删除</button><div class="route-content"><div class="route-top"><span class="route-name">'+esc(r.name)+'</span><span class="route-count">门店·'+(r.storeCount||0)+'家</span></div><div class="route-line"></div><div class="person"><span>驾驶员：'+esc(S.users.find(u=>u.id===r.driverUserId)?.username||"暂无")+'</span><button class="small-action" data-r="driver" data-id="'+esc(r.id)+'">'+(r.driverUserId?'解除':'绑定')+'</button></div><div class="person"><span>配送员：'+esc(S.users.find(u=>u.id===r.deliveryUserId)?.username||"暂无")+'</span><button class="small-action" data-r="delivery" data-id="'+esc(r.id)+'">'+(r.deliveryUserId?'解除':'绑定')+'</button></div></div></div>').join(""):'<div class="empty">暂无线路</div>';document.querySelectorAll("#routes .route").forEach(e=>{sw(e);e.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>routeAct(b.dataset.id,b.dataset.r))})}function routeAct(id,a){const r=S.routes.find(x=>x.id===id);if(!r)return;if(a==="delete")return open("删除线路","确定删除「"+r.name+"」吗？","整条线路及其业务数据将被删除，绑定用户账号不会被删除。此操作无法撤销。","确定",true,async()=>{await api("/api/routes",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"delete",routeId:id})});close();toast("线路已删除");load()});const uid=a==="driver"?r.driverUserId:r.deliveryUserId;const duty=a==="driver"?"driver":"delivery";if(!uid){const available=S.users.filter(u=>!u.boundRouteId);if(!available.length)return toast("暂无未绑定用户");const options=available.map(u=>'<option value="'+esc(u.id)+'">'+esc(u.username)+'</option>').join("");return open("绑定"+(duty==="driver"?"驾驶员":"配送员"),"选择未绑定的用户",'<div class="field"><label>用户</label><select id="routeBindUser">'+options+'</select></div>',"绑定",false,async()=>{const userId=$("routeBindUser").value;if(!userId)return toast("请选择用户");await api("/api/admin/users",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"bind",userId,routeId:id,duty})});close();toast("绑定成功");load()})}open("解除线路绑定","确定解除该人员的\n"+r.name+" · "+(a==="driver"?"司机":"配送")+"绑定吗？","","确定",false,async()=>{await api("/api/admin/users",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"unbind",userId:uid})});close();toast("绑定已解除");load()})}
function renderRequests(){$("requests").innerHTML=S.requests.length?S.requests.map(x=>'<div class="row"><div class="content"><div class="main"><strong>'+esc(x.username)+'</strong><div class="meta">'+esc(x.routeName)+' · '+(x.duty==="driver"?"司机":"配送")+'</div></div><div><button class="small-action" data-q="reject" data-id="'+esc(x.id)+'">驳回</button><button class="small-action" data-q="approve" data-id="'+esc(x.id)+'">批准</button></div></div></div>').join(""):'<div class="empty">暂无待审核申请</div>';document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const x=S.requests.find(v=>v.id===b.dataset.id),a=b.dataset.q;open(a==="approve"?"批准线路申请":"驳回线路申请","确定"+(a==="approve"?"批准":"驳回")+x.username+"的\n"+x.routeName+" · "+(x.duty==="driver"?"司机":"配送")+"申请吗？","","确定",false,async()=>{await api("/api/admin/route-requests",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({requestId:x.id,action:a})});close();toast("申请已处理");load()})})}
function renderInvites(){$("invites").innerHTML=S.invites.length?S.invites.map(c=>'<div class="invite"><div class="invite-head"><span class="code">'+esc(c.code)+'</span><button class="copy" data-c="'+esc(c.code)+'"><span class="copy-i"></span></button></div><div class="meta">已用 '+(c.usedCount||0)+'次 · '+(c.maxUses>0?"剩余 "+Math.max(0,c.maxUses-(c.usedCount||0))+"次":"剩余不限")+" · "+(c.expiresAt?new Date(c.expiresAt).toLocaleDateString():"永久")+'</div></div>').join(""):'<div class="empty">暂无可用邀请码</div>';document.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.c);toast("已复制")}catch{toast("复制失败")}})}
function addRoute(){open("新增线路","建立一条新的线路",'<div class="field"><label>线路名称</label><input id="rn" maxlength="40" placeholder="请输入线路名称"></div>',"保存",false,async()=>{if(!rn.value.trim())return toast("请输入线路名称");await api("/api/routes",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:rn.value.trim()})});close();toast("线路创建成功");load()})}
function addInvite(){open("生成邀请码","设置使用次数和有效期",'<div class="field"><label>使用次数</label><select id="iu"><option value="1">1次</option><option value="5">5次</option><option value="10">10次</option><option value="0">不限</option></select></div><div class="field"><label>有效期</label><select id="id"><option value="30">30天</option><option value="7">7天</option><option value="90">90天</option><option value="0">永久</option></select></div><div class="field"><label>生成数量</label><input id="ic" type="number" min="1" max="100" value="1"></div>',"生成",false,async()=>{const n=Math.max(1,Math.min(100,Number(ic.value)||1)),d=Number(id.value),e=d?new Date(Date.now()+d*86400000).toISOString():null;for(let k=0;k<n;k++)await api("/api/invite-codes",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"create",maxUses:Number(iu.value),expiresAt:e})});close();toast("邀请码已生成");load()})}
function editUser(){$("menuBg").hidden=true;open("修改用户名","输入新的管理员用户名",'<div class="field"><label>新用户名</label><input id="nu" value="'+esc(S.me.username)+'"></div>',"保存",false,async()=>{await api("/api/admin/manage",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"rename",username:nu.value.trim()})});close();toast("用户名已修改，请重新登录");setTimeout(()=>location.replace("/"),700)})}
function editPass(){$("menuBg").hidden=true;open("修改密码","修改后需要重新登录",'<div class="field"><label>当前密码</label><input id="op" type="password"></div><div class="field"><label>新密码</label><input id="np" type="password"></div><div class="field"><label>确认新密码</label><input id="cp" type="password"></div>',"保存",false,async()=>{if(np.value.length<6||np.value!==cp.value)return toast("请检查新密码");await api("/api/admin/manage",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"password",currentPassword:op.value,password:np.value})});close();toast("密码已修改，请重新登录");setTimeout(()=>location.replace("/"),700)})}
function resetData(){$("menuBg").hidden=true;open("清理旧运单数据","只清理旧运单、旧今日索引和旧历史索引，不影响线路、线路基准和账号。此操作无法撤销。",'<div class="field reset-password-field"><label for="rp">管理员密码</label><div class="reset-password-control"><input id="rp" type="password" autocomplete="current-password" placeholder="请输入管理员密码" aria-describedby="resetPasswordHint"><button id="toggleResetPassword" type="button" aria-label="显示管理员密码" aria-pressed="false">显示</button></div><div id="resetPasswordHint" class="field-hint">验证身份后才会清理旧运单索引</div></div>',"确认清理",true,async()=>{if(!rp.value)return toast("请输入管理员密码");const d=await api("/api/admin/manage",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"reset",password:rp.value})});close();toast("旧运单数据已清理："+(d.deleted||0)+"项");load()});const toggle=$("toggleResetPassword"),input=$("rp");if(toggle&&input)toggle.onclick=()=>{const visible=input.type==="password";input.type=visible?"text":"password";toggle.textContent=visible?"隐藏":"显示";toggle.setAttribute("aria-label",visible?"隐藏管理员密码":"显示管理员密码");toggle.setAttribute("aria-pressed",String(visible));input.focus()}}
async function load(){
  $("who").textContent="正在验证身份…";
  let m;
  try{
    m=await api("/api/me?adminCheck="+Date.now());
  }catch(e){
    $("who").textContent="身份验证失败："+(e.message||"请重新登录");
    setTimeout(()=>location.replace("/"),1200);
    return;
  }
  if(m.user?.role!=="system_admin"&&m.user?.role!=="admin"){
    $("who").textContent="当前账号无管理员权限";
    setTimeout(()=>location.replace("/"),1200);
    return;
  }
  S.me=m.user;
  $("who").textContent="管理员："+m.user.username;
  $("userMeta").textContent=m.user.username;
  try{
    const r=await api("/api/routes?adminLoad="+Date.now());
    S.routes=r.routes||[];
    const [u,q,i]=await Promise.all([
      api("/api/admin/users?adminLoad="+Date.now()),
      api("/api/admin/route-requests?adminLoad="+Date.now()),
      api("/api/invite-codes?adminLoad="+Date.now())
    ]);
    S.users=u.users||[];S.requests=q.requests||[];S.invites=i.codes||[];
    renderUsers();renderRoutes();renderRequests();renderInvites();
  }catch(e){
    toast("管理员身份已验证，但部分数据读取失败："+(e.message||"请稍后重试"));
    renderUsers();renderRoutes();renderRequests();renderInvites();
  }
}$("search").oninput=renderUsers;document.addEventListener("click",e=>{if(!e.target.closest(".row,.route,.dialog"))closeSwipes()});document.querySelectorAll(".page").forEach(p=>p.addEventListener("scroll",closeSwipes,{passive:true}));$("addRoute").onclick=addRoute;$("menuBtn").onclick=()=>{$("menuBg").hidden=false};$("menuBg").addEventListener("click",e=>{if(e.target===$("menuBg"))$("menuBg").hidden=true});$("addInvite").onclick=addInvite;$("editUser").onclick=editUser;$("editPass").onclick=editPass;$("reset").onclick=resetData;$("logout").onclick=async()=>{$("menuBg").hidden=true;if(!(await zpConfirm("退出登录","确定要退出当前管理员账号吗？","退出")))return;await fetch("/api/logout",{method:"POST",credentials:"same-origin",cache:"no-store"});location.replace("/")};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>page(Number(b.dataset.i)));let sx,sy;$("viewport").addEventListener("touchstart",e=>{if(!dlg.hidden)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});$("viewport").addEventListener("touchend",e=>{if(!dlg.hidden)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.35){if(dx<0&&S.page<3)page(S.page+1);if(dx>0&&S.page>0)page(S.page-1)}} ,{passive:true});load();
</script><script id="ui-unified-admin" src="/js/ui-unified.js"></script></body></html>
