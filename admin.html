/* 管理员页面结构修复 3.0：恢复分页、滑动操作、模态层和系统菜单的完整布局。 */
html,body{width:100%;min-height:100%;overflow-x:hidden}
body{touch-action:pan-y}
.shell{width:100%}
.panel{overflow:hidden}
.viewport{width:100%;overflow:hidden}
.pages{display:flex;width:500%;transform:translateX(0);transition:transform .22s ease;will-change:transform}
.page{width:20%;min-width:20%;flex:0 0 20%;padding-bottom:24px;min-height:200px}
.list{width:100%}
.row{position:relative;min-height:56px}
.row .content{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;min-height:56px}
.row .main{min-width:0;flex:1}
.row .main strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .arrow{color:var(--soft);font-size:22px;line-height:1}
.row .actions{position:absolute;inset:0 0 0 auto;width:148px;display:flex;align-items:stretch;z-index:1}
.row .actions .act{width:74px;border:0;color:#fff;font-size:13px}
.row .actions .normal{background:#26313C}
.row .actions .danger{background:#4A2528}
.row.open .content{transform:translateX(-148px)}
.row .content{transition:transform .18s ease}
.route{position:relative}
.route-delete{position:absolute;right:12px;top:10px;z-index:3;border:1px solid #594048;border-radius:8px;background:#302326;color:#FFB4AB;min-height:32px;padding:0 10px}
.route.open .route-content{transform:translateX(-74px)}
.route-content{position:relative;transition:transform .18s ease}
.route-content .person .small-action{position:relative;z-index:4}
.route-line{height:1px;background:rgba(255,255,255,.055);margin:9px 0 0}
.empty{padding:28px 12px;text-align:center;color:var(--soft)}
.q-badge{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;vertical-align:middle;white-space:nowrap}
.q-badge.ok{background:rgba(74,222,128,.16);color:#4ADE80}
.q-badge.review{background:rgba(245,166,35,.18);color:#F5A623}
.evt{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--soft);font-size:11px;line-height:16px;word-break:break-all}
.sub-title{font-size:14px;font-weight:700;margin:16px 0 8px;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px}
.search>span{color:var(--soft);font-size:20px;line-height:1}
.search input{flex:1;min-width:0;border:1px solid #34414d;color:#fff;outline:none}
.search input::placeholder{color:#68737E}
input,select{color:#fff;outline:none}
select option{background:#11171D;color:#fff}
/* P2-12 收口：移除全屏遮罩上的 backdrop-filter。
   原因：backdrop-filter 强制 GPU 每帧重新合成遮罩后方的整屏内容，在移动端/低端机上是弹窗
   打开与页面跳转掉帧的最典型来源（与已做过的半透明卡片叠加后合成成本更高）。
   改为「稍重的纯色遮罩 + 原有投影」保持视觉层次，弹窗内容本身不受任何影响。 */
.dialog-bg{position:fixed;inset:0;z-index:var(--ui-z-modal,1000);display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(2,5,9,.88)}
.dialog-bg[hidden]{display:none!important}
.dialog{width:min(100%,380px);max-height:88dvh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
/* 弹窗内表单控件通栏：下拉框/输入框不再窄条贴左，与弹窗同宽，观感整齐 */
/* 统一尺寸/字号/边框/padding：font-size>=16px 防安卓聚焦自动放大视口（此前 13.3px 导致聚焦的框明显变大） */
.dialog .field input,.dialog .field select{width:100%;height:48px;padding:0 12px;font-size:16px;line-height:normal;text-align:center;text-align-last:center;border:1px solid #34414d;border-radius:11px;appearance:none;-webkit-appearance:none}
.dialog .field input:focus,.dialog .field select:focus{border-width:1px}
.dialog .field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.dialog .field input[type=number]{appearance:textfield;-webkit-appearance:textfield;-moz-appearance:textfield}
.dialog-actions button{color:#fff;border:1px solid #35404C;background:#11171D}
.dialog-actions .ok{background:#202B36;border-color:#3A4652}
.dialog-actions .ok.danger{background:#4A2528;border-color:#6A3940;color:#FFD5D1}
.menu-bg{z-index:var(--ui-z-modal-stack,1100)}
.menu-bg .dialog{width:min(100%,360px)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:var(--ui-z-toast,2000);display:block;min-height:42px;max-width:calc(100vw - 32px);padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:#26313C;color:#fff;font-size:14px;line-height:20px;text-align:center;box-shadow:0 10px 28px rgba(0,0,0,.36);transform:translate(-50%,10px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,transform .18s ease,visibility .18s ease}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.menu-btn{cursor:pointer}
.tab,.add,.small-action,.route-delete,.copy,.dialog button,.setting{cursor:pointer}
.setting:active,.tab:active,.add:active,.small-action:active,.route-delete:active,.menu-btn:active{background:#26313C}
@media(max-width:560px){
  .shell{padding-left:12px;padding-right:12px}
  .tabs{gap:2px;padding:3px}
  .tab{font-size:14px;padding:0 2px}
  .title{font-size:17px}
}


/* 管理员用户管理 3.8：左滑行不显示方向箭头，微调姓名与线路岗位信息的间距。 */
#users .row .arrow,
#users .row .content::after,
#users .row .main::after{
  display:none!important;
  content:none!important;
}
#users .row .content{
  padding-left:14px!important;
  padding-right:14px!important;
}
#users .row .main{
  gap:8px!important;
}
#users .row .main .meta{
  margin-left:8px!important;
}

</style><style>
/* 管理员密码输入框 3.4：强化输入区域、焦点状态与密码显隐操作。 */
.reset-password-field{margin-top:16px}

/* 管理员用户管理 3.1：搜索图标置于输入框右侧；用户信息左右对齐。 */
.search{position:relative;display:block}

/* 管理员用户/线路左滑 3.2：移除无意义箭头；线路删除按钮仅在左滑后露出。 */

#routes .route{position:relative;overflow:hidden}
#routes .route-delete{
  right:-74px!important;top:0!important;bottom:0!important;
  width:74px!important;height:100%!important;min-height:54px!important;
  margin:0!important;padding:0!important;border:0!important;border-radius:0!important;

  touch-action:manipulation;

/* 管理员系统菜单 3.4：保持右上锚定浮层外观，但遮罩层必须可接收点击 ——
   此前 pointer-events:none 让整层对点击穿透，"点空白收起"的监听永远
   收不到事件（2026-10-04 修复）。外观仍为全透明，不加暗色遮罩。 */
.menu-bg{
  position:fixed!important;inset:0!important;z-index:var(--ui-z-modal-stack,1100)!important;
  display:block!important;padding:0!important;
  background:transparent!important;backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
  cursor:default
}
.menu-bg[hidden]{display:none!important}
.menu-bg>.dialog{
  position:fixed;top:calc(env(safe-area-inset-top) + 62px);
  right:max(12px,calc((100vw - 680px)/2 + 14px));
  width:208px!important;max-height:min(72dvh,560px);
  overflow:auto;padding:6px!important;
  border:1px solid #2A3540!important;border-radius:12px!important;
  background:#18212B!important;
  box-shadow:0 10px 24px rgba(0,0,0,.3)!important;
  animation:admin-menu-in .14s ease-out;
  pointer-events:auto
}
/* 菜单项：与用户端三横菜单同款（css/home.css）——图标+文字行、无标题无箭头、
   退出登录前有分隔线、退出项红色 */
.menu-bg .setting{
  display:flex;align-items:center;gap:11px;width:100%;
  min-height:48px;padding:0 12px!important;
  border:0!important;border-radius:11px;
  color:#D5DCE2;font-size:14px;line-height:20px;font-weight:600;
  background:transparent;text-align:left;cursor:pointer
}
.menu-bg .setting:active{background:#26313C;transform:scale(.985)}
.menu-bg .menu-item-icon{width:22px;height:22px;min-width:22px;display:flex;align-items:center;justify-content:center;color:#B8C2CC}
.menu-bg .menu-item-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu-bg .setting>span:last-child,.menu-bg .menu-username{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-bg .menu-username{color:inherit}
.menu-bg .menu-divider{height:1px;margin:5px 7px;background:rgba(255,255,255,.07)}
.menu-bg #logout{color:#FF8278}
.menu-bg #logout .menu-item-icon{color:#FF8278}
@keyframes admin-menu-in{
  from{opacity:0;transform:translateY(-5px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@media(max-width:380px){
  .menu-bg>.dialog{right:12px;width:min(220px,calc(100vw - 24px))!important}
}

      if(dx<0)el.classList.add("open")
    }
  },{passive:true});
  el.addEventListener("touchcancel",()=>{active=false},{passive:true})
}

async function load(){
  $("who").textContent="正在验证身份…";
  let m;
  try{
    m=await api("/api/me?adminCheck="+Date.now());
  }catch(e){
    $("who").textContent="身份验证失败："+(e.message||"请重新登录");
    // 未登录：清跨区退出标记，避免遗留标记在后续业务页误触发 history.back。
    try{sessionStorage.removeItem("zpExitAdmin")}catch(e){}
    setTimeout(()=>location.replace("/"),1200);
    return;
  }
  if(m.user?.role!=="system_admin"&&m.user?.role!=="admin"){
    $("who").textContent="当前账号无管理员权限";
    // 2026-10-05 修复（登录页↔管理端来回跳动死循环）：能走到这里说明会话有效、
    // 当前登录的是业务账号 —— 正确去处是业务端首页 /home，而不是登录页。
    // 旧逻辑 replace("/") 会被登录页的角色自动直达再次送回 /admin；
    // 一旦 /api/me 对不同请求返回不一致角色（中间层按 URL 缓存旧响应等），
    // 两端就互相踢皮球无限循环。改为直达 /home：无论哪端读到陈旧角色，
    // 最坏也只多跳一次，循环在结构上不可能形成。
    // 关键：清掉 ui-unified 在「管理端非根进入」时置的跨区退出标记 zpExitAdmin，
    // 否则跳到 /home 后该标记会触发 history.back() 又弹回 /admin，重蹈循环覆辙
    // （在 PWA 历史栈 >1 的真实环境必现）。普通用户本就不需要跨区退出逻辑。
    try{sessionStorage.removeItem("zpExitAdmin")}catch(e){}
    // 明确本会话属于业务区，避免业务页门禁把司机误判成管理员又弹回 /admin
    try{sessionStorage.setItem("zpRole","user")}catch(e){}
    setTimeout(()=>location.replace("/home.html?v="+Date.now()),1200);
    return;
  }
  S.me=m.user;
  // 兜底：确认是管理员则固化本会话归属管理区（登录页已写，此处覆盖异常残留）
  try{sessionStorage.setItem("zpRole","admin")}catch(e){}
  $("who").innerHTML='<span class="role">管理员</span><span class="uname">'+esc(m.user.username)+'</span>';
  $("menuUsername").textContent=m.user.username;
  try{
    const r=await api("/api/routes?adminLoad="+Date.now());
    S.routes=r.routes||[];
    const [u,q,i]=await Promise.all([
      api("/api/admin/users?adminLoad="+Date.now()),
      api("/api/admin/route-requests?adminLoad="+Date.now()),
      api("/api/invite-codes?adminLoad="+Date.now())
    ]);
    S.users=u.users||[];S.requests=q.requests||[];S.invites=i.codes||[];
    renderUsers();renderRoutes();renderRequests();renderInvites();
  }catch(e){
    toast("管理员身份已验证，但部分数据读取失败："+(e.message||"请稍后重试"));
    renderUsers();renderRoutes();renderRequests();renderInvites();
  }
}$("search").oninput=renderUsers;document.addEventListener("click",e=>{if(!e.target.closest(".row,.route,.dialog"))closeSwipes()});document.querySelectorAll(".page").forEach(p=>p.addEventListener("scroll",closeSwipes,{passive:true}));$("addRoute").onclick=addRoute;$("menuBtn").onclick=()=>{const mb=$("menuBg");mb.hidden?openMenu():hideMenu()};$("menuBg").addEventListener("click",e=>{if(e.target===$("menuBg"))hideMenu()});document.addEventListener("keydown",e=>{if(e.key==="Escape")hideMenu()});/* popstate 已移交 ui-unified.js 中央控制器 zpHandleBack() */$("addInvite").onclick=addInvite;$("editUser").onclick=editUser;$("editPass").onclick=editPass;$("reset").onclick=resetData;$("diagQuery").onclick=renderDiagnostics;$("diagRefresh").onclick=renderDiagnostics;$("learnQuery")&&($("learnQuery").onclick=renderLearningIsolation);$("learnRefresh").onclick=renderLearningIsolation;$("learnIsolate").onclick=learnIsolate;$("logout").onclick=async()=>{hideMenu();if(!(await zpConfirm("退出登录","确定要退出当前管理员账号吗？","退出")))return;await fetch("/api/logout",{method:"POST",credentials:"same-origin",cache:"no-store"});location.replace("/")};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>page(Number(b.dataset.i)));load();
async function renderDiagnostics(){
  const routeId=($("diagRoute").value||"").trim();
  if(!routeId){$("diagnostics").innerHTML='<div class="empty">请输入线路ID(routeId)后查询</div>';return;}
  const date=($("diagDate").value||"").trim(),vehicle=($("diagVehicle").value||"").trim();
  let q="/api/waybills/diagnostic?routeId="+encodeURIComponent(routeId);
  if(date)q+="&date="+encodeURIComponent(date);
  if(vehicle)q+="&vehicle="+encodeURIComponent(vehicle);
  let d;try{d=await api(q)}catch(e){$("diagnostics").innerHTML='<div class="empty">查询失败：'+esc(e.message)+'</div>';return}
  const list=d.waybills||[];
  if(!list.length){$("diagnostics").innerHTML='<div class="empty">该线路暂无运单或无权查看</div>';return}
  const truncHint=(d.truncated&&Number(d.count)>list.length)?'<div class="empty" style="color:#e8b34b">共 '+esc(d.count)+' 张运单，当前仅显示最近 20 张</div>':"";
  $("diagnostics").innerHTML=truncHint+list.map(w=>{

    const evs=(w.events||[]).slice(-8).reverse().map(e=>esc(e.event)+(e.t?" · "+esc(String(e.t).slice(11,19)):"")).join("<br>");
    return '<div class="row"><div class="content"><div class="main"><strong>'+esc(w.date||"-")+' · '+esc(w.vehicle||"-")+'</strong>'
      +'<span class="q-badge '+ql+'">'+esc(ql.toUpperCase())+(w.quality&&w.quality.flags&&w.quality.flags.length?(" · "+esc(flags)):"")+'</span></div>'
      +'<div class="meta">stage='+esc(w.stage||"-")+' · '+esc(w.routeId)+' · requestId '+esc(w.requestId||"-")+'</div>'
      +(evs?'<div class="evt">'+evs+'</div>':'')+'</div></div>';
  }).join("");
}

/* 面板横滑 4.0：实时跟手 + 8px 方向锁定 + 距离/速度双判定 + 首尾阻尼。
   旧实现三处失效：①阈值 55px 太高 ②要求 |dx|>|dy|*1.35，拇指自然弧度必带
   竖向分量 → 被误判为滚动 ③热区原只挂在 #viewport，屏幕边缘与底部留白收不到
   事件（已改为整块 .shell 可滑 + 面板铺满可用高度，详见上方样式注释）。 */
(function(){
  const vp=$("viewport"),pg=$("pages");
  const W=()=>vp.clientWidth||document.documentElement.clientWidth||360;
  const busy=()=>!$("dlg").hidden||!$("menuBg").hidden;
  let sx=0,sy=0,axis="",live=false,from=0,t0=0,onRow=false;
  function down(e){
    if(busy()||e.touches.length>1){axis="skip";return}
    // 线路已左滑展开后，删除按钮本身必须完全脱离分页/行手势。
    // 否则点击删除时这里先执行 closeSwipes()，按钮会在 click 发生前被收回，
    // 用户看到的就是“点击删除 → 删除按钮向右滑回去 → 无法删除”。
    if(e.target&&e.target.closest&&e.target.closest(".route-delete,.invite")){axis="skip";return}
    if(document.querySelector(".row.open,.route.open")){closeSwipes();axis="skip";return}
    const t=e.touches[0];
    sx=t.clientX;sy=t.clientY;axis="";live=false;from=S.page;t0=e.timeStamp||Date.now();
    onRow=!!(e.target&&e.target.closest&&e.target.closest(".row,.route"));
  }
  function move(e){
    if(axis==="skip"||busy())return;
    const t=e.touches[0],mx=t.clientX-sx,ay=Math.abs(t.clientY-sy);
    if(!axis){
      if(Math.abs(mx)<8&&ay<8)return;                 // 死区：不动就什么都不判定
      if(onRow&&mx<0){axis="skip";return}             // 列表行向左 = 行内操作菜单，让位给 sw()
      axis=Math.abs(mx)>ay?"x":"y";                   // 一次锁定，全程不再摇摆
      if(axis!=="x")return;                           // 竖向 → 交还列表原生滚动
      live=true;
    }
    if(axis!=="x")return;
    let off=mx;
    if((from===0&&off>0)||(from===4&&off<0))off*=0.3; // 首尾面板阻尼，滑到底有回弹感
    pg.style.transition="none";
    pg.style.transform="translateX("+(-from*W()+off)+"px)";
    if(e.cancelable)e.preventDefault();
  }
  function end(e,commit){
    if(axis==="skip"||axis!=="x"||!live){axis="";live=false;return}
    const t=e.changedTouches&&e.changedTouches[0];
    const last=t?t.clientX-sx:0;
    const dt=Math.max(1,(e.timeStamp||Date.now())-t0),vel=Math.abs(last)/dt,w=W();
    let to=from;
    // 距离够远 或 甩得够快（快滑哪怕只有 18px 也翻页），两者满足其一即可
    if(commit&&(Math.abs(last)>Math.min(36,w*0.10)||(vel>0.28&&Math.abs(last)>14)))
      to=last<0?from+1:from-1;
    to=Math.max(0,Math.min(4,to));
    pg.style.transition="";live=false;axis="";
    page(to);                                          // 统一收尾：百分比重排 + Tab 高亮 + 收起左滑行
  }
  const host=document.querySelector(".shell")||vp;   // 热区提升到整块面板：含 tabs 与四周留白
  [host].forEach(el=>{if(!el)return;
    el.addEventListener("touchstart",down,{passive:true});
    el.addEventListener("touchmove",move,{passive:false});
    el.addEventListener("touchend",e=>end(e,true),{passive:true});
    el.addEventListener("touchcancel",e=>end(e,false),{passive:true});
  });
})();

/* 管理员端返回层级：表单弹窗 → 系统设置抽屉 → 左滑展开行 → 到顶「两次返回退出」。
   管理员是独立工作区，中央控制器的跨区防火墙已禁止其回落到业务首页/业务页。 */
(window.zpBackHooks=window.zpBackHooks||[]).push(
  {rank:10,probe:()=>$("dlg"),dirty:()=>dlgBase!==null&&dlgSnapshot()!==dlgBase,close:()=>{close();return true}},
  {rank:20,probe:()=>$("menuBg"),close:()=>{hideMenu();return true}},
  {rank:40,probe:()=>document.querySelector(".row.open,.route.open"),close:()=>{closeSwipes();return true}}
);
})();
