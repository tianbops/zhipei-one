<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>智配One · 管理员</title><style>
:root{--bg:#05070A;--card:#1C2530;--line:#27323D;--muted:#B8C2CC;--soft:#7F8A95}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100dvh;padding:14px 16px 30px}.panel{width:min(100%,680px);margin:auto}.head{display:flex;align-items:center;gap:10px;padding:6px 0 12px}.head img{width:34px;height:34px}.head h1{margin:0;font-size:20px}.who,.meta{color:var(--muted);font-size:12px}.who{margin-top:3px}.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);touch-action:pan-x}.tabs::-webkit-scrollbar{display:none}.tab{height:42px;position:relative;flex:none;border:0;background:none;color:var(--muted);font-size:14px}.tab.active{color:#fff;font-weight:600}.tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#fff}.viewport{overflow:hidden;margin-top:16px}.pages{display:flex;width:600%;transition:transform .19s ease}.page{width:16.6667%;padding:0 1px}.title{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;font-size:20px}.add{width:40px;height:40px;border:0;background:none;color:#fff;font-size:27px}.search{position:relative;margin-bottom:10px}.search span{position:absolute;left:13px;top:9px;color:var(--muted);font-size:20px}.search input,.field input,.field select{width:100%;height:46px;border:1px solid #34414d;border-radius:11px;background:#11171D;color:#fff;padding:0 13px;font-size:15px;outline:0}.search input{padding-left:40px}.list{display:grid;gap:10px}.row{position:relative;overflow:hidden;border:1px solid #26313b;border-radius:12px;background:#11171D}.content{position:relative;z-index:2;min-height:58px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#11171D;transition:transform .17s ease}.row.open .content{transform:translateX(-144px)}.actions{position:absolute;right:0;top:0;bottom:0;display:flex}.act{width:72px;border:0;color:#fff;font-size:13px}.normal{background:#26313C}.danger{background:#5a2424}.main{min-width:0}.main strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow,.chev{color:var(--soft);font-size:21px}.route{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--card)}.route.open .route-content{transform:translateX(-72px)}.route-content{position:relative;z-index:2;background:var(--card);transition:transform .17s ease}.route-delete{position:absolute;right:0;top:0;width:72px;height:58px;border:0;background:#5a2424;color:#fff}.route-top{display:flex;justify-content:space-between;gap:10px;padding:12px;min-height:58px}.route-name,.route-count{font-size:16px;line-height:20px;font-weight:600}.route-count{font-weight:400}.person{display:flex;justify-content:space-between;gap:10px;padding:5px 12px;color:var(--muted);font-size:13px}.person:last-child{padding-bottom:12px}.route-line{height:1px;background:rgba(255,255,255,.06);margin:0 12px}.small-action{border:0;background:none;color:#fff;font-size:12px}.card{padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px}.setting{display:flex;justify-content:space-between;align-items:center;min-height:54px;border-bottom:1px solid rgba(255,255,255,.07)}.setting:last-child{border-bottom:0}.invite{padding:12px;border:1px solid #26313b;border-radius:12px;background:#11171D}.invite-head{display:flex;justify-content:space-between;align-items:center}.code{font:600 16px ui-monospace,SFMono-Regular,Consolas,monospace}.copy{width:36px;height:36px;border:0;background:none;padding:0}.copy-i{position:relative;display:block;width:19px;height:19px}.copy-i:before,.copy-i:after{content:"";position:absolute;width:12px;height:12px;border:1.8px solid #fff;border-radius:3px}.copy-i:before{left:5px;top:1px}.copy-i:after{left:1px;top:5px;background:#11171D}.dialog-bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:20px}.dialog-bg[hidden]{display:none}.dialog{width:min(100%,430px);padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--card)}.dialog h2{margin:0;font-size:18px}.dialog p{margin:10px 0;color:var(--muted);font-size:14px;line-height:21px;white-space:pre-line}.field{margin-top:11px}.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:13px}.dialog-actions{display:flex;gap:10px;margin-top:18px}.dialog-actions button{flex:1;height:46px;border-radius:11px;font-size:14px}.cancel{border:1px solid #34414d;background:#11171D;color:#fff}.ok{border:0;background:#26313C;color:#fff}.ok.danger{background:#3c2525}.empty{text-align:center;color:var(--soft);padding:22px}.toast{position:fixed;left:50%;bottom:25px;z-index:200;transform:translate(-50%,10px);opacity:0;padding:9px 13px;border-radius:10px;background:#26313C;font-size:13px;transition:.14s}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><main class="shell"><div class="panel"><header class="head"><img src="/assets/logo.png" alt="智配One"><div><h1>管理员</h1><div id="who" class="who">正在验证身份…</div></div></header><nav class="tabs"><button class="tab active" data-i="0">用户管理</button><button class="tab" data-i="1">线路管理</button><button class="tab" data-i="2">线路审核</button><button class="tab" data-i="3">邀请码</button><button class="tab" data-i="4">全局学习</button><button class="tab" data-i="5">系统设置</button></nav><div id="viewport" class="viewport"><div id="pages" class="pages"><section class="page"><div class="title">用户管理</div><div class="search"><span>⌕</span><input id="search" placeholder="搜索用户名"></div><div id="users" class="list"></div></section><section class="page"><div class="title"><span>线路管理</span><button id="addRoute" class="add">＋</button></div><div id="routes" class="list"></div></section><section class="page"><div class="title">线路审核</div><div id="requests" class="list"></ window.__adminBootStarted=Date.now();
const $=id=>document.getElementById(id),S={page:0,users:[],routes:[],requests:[],invites:[],globalConflicts:[],me:null},esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function api(u,o={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const r=await fetch(u,{credentials:"same-origin",cache:"no-store",...o,signal:controller.signal}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||("请求失败（"+r.status+"）"));return d}catch(e){if(e?.name==="AbortError")throw Error("服务器响应超时");throw e}finally{clearTimeout(timer)}}let tm;function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(tm);tm=setTimeout(()=>$("toast").classList.remove("show"),1500)}function close(){dlg.hidden=true;db.innerHTML=""}function open(t,p,b="",ok="确定",danger=false,fn){dt.textContent=t;dp.textContent=p;db.innerHTML=b;do_.textContent=ok;do_.classList.toggle("danger",danger);dlg.hidden=false;dc.onclick=close;do_.onclick=async()=>{if(!fn)return close();do_.disabled=true;try{await fn()}catch(e){toast(e.message)}finally{do_.disabled=false}}}const dlg=$("dlg"),dt=$("dt"),dp=$("dp"),db=$("db"),dc=$("dc"),do_=$("do");S.globalConflicts=[];let globalLoading=false;function page(i){S.page=Math.max(0,Math.min(5,i));closeSwipes();$("pages").style.transform="translateX(-"+S.page*16.6667+"%)";document.querySelectorAll(".tab").forEach((b,n)=>b.classList.toggle("active",n===S.page))}function closeSwipes(){document.querySelectorAll(".row.open,.route.open").forEach(x=>x.classList.remove("open"))}function sw(el){let x=0,y=0;el.addEventListener("touchstart",e=>{if(!dlg.hidden)return;x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});el.addEventListener("touchend",e=>{if(!dlg.hidden)return;const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.25){e.stopPropagation();closeSwipes();if(dx<0)el.classList.add("open")}},{passive:true})}
function renderUsers(){const q=$("search").value.trim().toLowerCase(),a=S.users.filter(u=>(u.username||"").toLowerCase().includes(q));$("users").innerHTML=a.length?a.map((u,i)=>'<div class="row"><div class="actions">'+(u.boundRouteId?'<button class="act normal" data-u="unbind">解绑</button>':'<button class="act normal" data-u="bind">绑定</button>')+'<button class="act danger" data-u="delete">删除</button></div><div class="content"><div class="main"><strong>'+esc(u.username)+'</strong><div class="meta">'+esc(u.boundRouteId?(u.routeName||"线路未知")+" · "+(u.routeDuty==="driver"?"司机":"配送"):"暂无绑定线路")+'</div></div><span class="arrow">›</span></div></div>').join(""):'<div class="empty">暂无用户</div>';document.querySelectorAll("#users .row").forEach((e,i)=>{sw(e);e.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>userAct(a[i],b.dataset.u))})}
function userAct(u,a){if(a==="delete")return open("删除用户","确定永久删除「"+u.username+"」吗？","账号、绑定关系及待审核申请将被删除，此操作无法撤销。","确定",true,async()=>{await api("/api/admin/users",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"delete",userId:u.id})});close();toast("用户已删除");load()});if(a==="unbind")return open("解除线路绑定","确定解除"+u.username+"的\n"+u.routeName+" · "+(u.routeDuty==="driver"?"司机":"配送")+"绑定吗？","","确定",false,async()=>{await api("/api/admin/users",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"unbind",userId:u.id})});close();toast("绑定已解除");load()});const o=S.routes.filter(r=>r.status==="active").map(r=>'<option value="'+esc(r.id)+'">'+esc(r.name)+'</option>').join("");open("绑定线路","选择线路和岗位",'<div class="field"><label>线路</label><select id="br">'+o+'</select></div><div class="field"><label>岗位</label><select id="bd"><option value="driver">司机</option><option value="delivery">配送</option></select></div>',"确定",false,async()=>{await api("/api/admin/users",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"bind",userId:u.id,routeId:br.value,duty:bd.value})});close();toast("绑定成功");load()})}
function renderRoutes(){$("routes").innerHTML=S.routes.length?S.routes.map(r=>'<div class="route"><button class="route-delete" data-r="delete" data-id="'+esc(r.id)+'">删除</button><div class="route-content"><div class="route-top"><span class="route-name">'+esc(r.name)+'</span><span class="route-count">门店·'+(r.storeCount||0)+'家</span></div><div class="route-line"></div><div class="person"><span>驾驶员：'+esc(S.users.find(u=>u.id===r.driverUserId)?.username||"暂无")+'</span><button class="small-action" data-r="driver" data-id="'+esc(r.id)+'">解除</button></div><div class="person"><span>配送员：'+esc(S.users.find(u=>u.id===r.deliveryUserId)?.username||"暂无")+'</span><button class="small-action" data-r="delivery" data-id="'+esc(r.id)+'">解除</button></div></div></div>').join(""):'<div class="empty">暂无线路</div>';document.querySelectorAll("#routes .route").forEach(e=>{sw(e);e.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>routeAct(b.dataset.id,b.dataset.r))})}function routeAct(id,a){const r=S.routes.find(x=>x.id===id);if(!r)return;if(a==="delete")return open("删除线路","确定删除「"+r.name+"」吗？","整条线路及其业务数据将被删除，绑定用户账号不会被删除。此操作无法撤销。","确定",true,async()=>{await api("/api/routes",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"delete",routeId:id})});close();toast("线路已删除");load()});const uid=a==="driver"?r.driverUserId:r.deliveryUserId;if(!uid)return toast("当前岗位暂无绑定");open("解除线路绑定","确定解除该人员的\n"+r.name+" · "+(a==="driver"?"司机":"配送")+"绑定吗？","","确定",false,async()=>{await api("/api/admin/users",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"unbind",userId:uid})});close();toast("绑定已解除");load()})}
function renderRequests(){$("requests").innerHTML=S.requests.length?S.requests.map(x=>'<div class="row"><div class="content"><div class="main"><strong>'+esc(x.username)+'</strong><div class="meta">'+esc(x.routeName)+' · '+(x.duty==="driver"?"司机":"配送")+'</div></div><div><button class="small-action" data-q="reject" data-id="'+esc(x.id)+'">驳回</button><button class="small-action" data-q="approve" data-id="'+esc(x.id)+'">批准</button></div></div></div>').join(""):'<div class="empty">暂无待审核申请</div>';document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const x=S.requests.find(v=>v.id===b.dataset.id),a=b.dataset.q;open(a==="approve"?"批准线路申请":"驳回线路申请","确定"+(a==="approve"?"批准":"驳回")+x.username+"的\n"+x.routeName+" · "+(x.duty==="driver"?"司机":"配送")+"申请吗？","","确定",false,async()=>{await api("/api/admin/route-requests",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({requestId:x.id,action:a})});close();toast("申请已处理");load()})})}
function renderGlobalConflicts(){const a=S.globalConflicts||[];$("globalConflicts").innerHTML=a.length?a.map((x,i)=>'<div class="card"><div class="title" style="margin:0 0 8px;font-size:16px"><span>'+esc(x.standardName||"名称冲突")+'</span><span class="meta">冲突 '+(x.conflicts||0)+' 次</span></div><div class="meta">门店ID：'+esc(x.storeId)+'<br>原名称：'+esc(x.originalName||"")+'</div><div class="dialog-actions" style="margin-top:12px"><button class="cancel" data-gc="view" data-i="'+i+'">查看</button><button class="ok" data-gc="resolve" data-i="'+i+'">处理</button></div></div>').join(""):'<div class="empty">暂无全局学习冲突</div>';document.querySelectorAll("[data-gc]").forEach(b=>b.onclick=()=>globalConflictAct(Number(b.dataset.i),b.dataset.gc))}function globalConflictAct(i,a){const x=(S.globalConflicts||[])[i];if(!x)return;if(a==="view")return open("冲突门店","门店ID："+x.storeId+"\n当前标准名："+(x.standardName||"")+"\n冲突次数："+(x.conflicts||0),"管理员确认后可恢复为候选状态。","知道了",false,close);open("处理全局冲突","请输入确认后的标准名称",'<div class="field"><label>标准名称</label><input id="gsn" maxlength="120" value="'+esc(x.standardName||x.originalName||"")+'"></div>',"确认处理",false,async()=>{const name=gsn.value.trim();if(!name)return toast("请输入标准名称");if(name===String(x.standardName||"").trim())return toast("请确认是否需要修改为新的标准名称");await api("/api/admin/global-learning",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({storeId:x.storeId,standardName:name})});close();toast("冲突已处理，进入候选状态");await loadGlobalConflicts()})}async function loadGlobalConflicts(){if(globalLoading)return;globalLoading=true;try{const d=await api("/api/admin/global-learning?limit=200");S.globalConflicts=Array.isArray(d.records)?d.records:[];renderGlobalConflicts()}catch(e){S.globalConflicts=[];$("globalConflicts").innerHTML='<div class="empty">全局学习暂时无法读取<div style="margin-top:8px"><button class="small-action" id="retryGlobal">重新读取</button></div></div>';const r=$("retryGlobal");if(r)r.onclick=loadGlobalConflicts}finally{globalLoading=false}}function renderInvites(){$("invites").innerHTML=S.invites.length?S.invites.map(c=>'<div class="invite"><div class="invite-head"><span class="code">'+esc(c.code)+'</span><button class="copy" data-c="'+esc(c.code)+'"><span class="copy-i"></span></button></div><div class="meta">已用 '+(c.usedCount||0)+'次 · '+(c.maxUses>0?"剩余 "+Math.max(0,c.maxUses-(c.usedCount||0))+"次":"剩余不限")+" · "+(c.expiresAt?new Date(c.expiresAt).toLocaleDateString():"永久")+'</div></div>').join(""):'<div class="empty">暂无可用邀请码</div>';document.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.c);toast("已复制")}catch{toast("复制失败")}})}
function addRoute(){open("新增线路","建立一条新的线路",'<div class="field"><label>线路名称</label><input id="rn" maxlength="40" placeholder="请输入线路名称"></div>',"保存",false,async()=>{if(!rn.value.trim())return toast("请输入线路名称");await api("/api/routes",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:rn.value.trim()})});close();toast("线路创建成功");load()})}
function addInvite(){open("生成邀请码","设置使用次数和有效期",'<div class="field"><label>使用次数</label><select id="iu"><option value="1">1次</option><option value="5">5次</option><option value="10">10次</option><option value="0">不限</option></select></div><div class="field"><label>有效期</label><select id="id"><option value="30">30天</option><option value="7">7天</option><option value="90">90天</option><option value="0">永久</option></select></div><div class="field"><label>生成数量</label><input id="ic" type="number" min="1" max="100" value="1"></div>',"生成",false,async()=>{const n=Math.max(1,Math.min(100,Number(ic.value)||1)),d=Number(id.value),e=d?new Date(Date.now()+d*86400000).toISOString():null;for(let k=0;k<n;k++)await api("/api/invite-codes",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"create",maxUses:Number(iu.value),expiresAt:e})});close();toast("邀请码已生成");load()})}
function editUser(){open("修改用户名","输入新的管理员用户名",'<div class="field"><label>新用户名</label><input id="nu" value="'+esc(S.me.username)+'"></div>',"保存",false,async()=>{await api("/api/admin/manage",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"rename",username:nu.value.trim()})});close();toast("用户名已修改，请重新登录");setTimeout(()=>location.replace("/"),700)})}
function editPass(){open("修改密码","修改后需要重新登录",'<div class="field"><label>当前密码</label><input id="op" type="password"></div><div class="field"><label>新密码</label><input id="np" type="password"></div><div class="field"><label>确认新密码</label><input id="cp" type="password"></div>',"保存",false,async()=>{if(np.value.length<6||np.value!==cp.value)return toast("请检查新密码");await api("/api/admin/manage",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"password",currentPassword:op.value,password:np.value})});close();toast("密码已修改，请重新登录");setTimeout(()=>location.replace("/"),700)})}
function resetData(){open("重置数据","将清除所有业务数据和普通用户。","管理员账号和系统基础配置不会被清除。\n\n重置后，业务数据需要重新建立和学习。","下一步",true,async()=>{close();open("确认重置数据","确定要重置所有业务数据吗？","此操作无法撤销。","确定",true,async()=>{close();open("验证管理员","请输入管理员密码",'<div class="field"><label>管理员密码</label><input id="rp" type="password"></div>',"重置",true,async()=>{await api("/api/admin/manage",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"reset",password:rp.value})});close();toast("数据已重置");load()})})})}
async function load(){
  $("who").textContent="正在验证身份…";
  let m;
  try{
    m=await api("/api/me?adminCheck="+Date.now());
  }catch(e){
    $("who").textContent="身份验证失败："+(e.message||"请重新登录");
    setTimeout(()=>location.replace("/"),1200);
    return;
  }
  if(m.user?.role!=="system_admin"&&m.user?.role!=="admin"){
    $("who").textContent="当前账号无管理员权限";
    setTimeout(()=>location.replace("/"),1200);
    return;
  }
  S.me=m.user;
  $("who").textContent="管理员："+m.user.username;
  $("userMeta").textContent=m.user.username;
  try{
    const [r,u,q,i]=await Promise.all([
      api("/api/routes?adminLoad="+Date.now()),
      api("/api/admin/users?adminLoad="+Date.now()),
      api("/api/admin/route-requests?adminLoad="+Date.now()),
      api("/api/invite-codes?adminLoad="+Date.now())
