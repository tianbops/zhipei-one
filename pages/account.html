<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>账号设置 · 智配One</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/mobile-ui.css">
<link rel="stylesheet" href="/css/business-pages.css"></head><body><main class="page2"><header class="page2-head"><a class="page2-back" href="/home.html">返回</a><h1>账号设置</h1><span></span></header><section class="page2-card"><h2>账号信息</h2><div class="account-row"><span>用户名</span><strong id="username">读取中…</strong></div><div class="account-row"><span>角色</span><strong id="role">读取中…</strong></div></section><section class="page2-card"><button id="logout" class="primary-btn account-logout" type="button">退出登录</button><p id="message" class="message"></p></section></main><script>(async()=>{const u=document.getElementById("username"),r=document.getElementById("role"),m=document.getElementById("message");try{const x=await fetch("/api/me",{credentials:"same-origin",cache:"no-store"}),d=await x.json();if(!x.ok)throw Error(d.error||"读取失败");const me=d.user||{};u.textContent=me.username||"—";r.textContent=me.role==="system_admin"||me.role==="admin"?"管理员":"业务用户"}catch(e){m.textContent=e.message||"账号信息读取失败"}})();document.getElementById("logout").onclick=async()=>{await fetch("/api/logout",{method:"POST",credentials:"same-origin",cache:"no-store"});location.replace("/")};</script></body></html>
