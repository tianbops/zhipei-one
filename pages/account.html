<script>
(function(){
  function goLogin(){
    try{document.documentElement.style.display="none"}catch(e){}
    var p=location.pathname+location.search;
    location.replace("/?redirect="+encodeURIComponent(p)+"&reason=auth");
  }
  try{
    if(sessionStorage.getItem("zpAuth")!=="1"){goLogin();return;}
  }catch(e){}
  try{
    window.addEventListener("pageshow",function(ev){
      if(ev.persisted){try{if(sessionStorage.getItem("zpAuth")!=="1")location.replace("/?reason=auth");}catch(e){}}
    });
  }catch(e){}
})();
</script>

<style>
.about-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 4px}
.about-head h2{margin:0}

.about-row:last-child{border-bottom:0}

<body><main class="page2 account-page zp-shell">
<header class="topbar"><a class="app-back" href="/home" aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><h1>账号设置</h1><span></span></header>

<div class="zp-scroll">
<section class="page2-card appearance-card" aria-labelledby="appearanceTitle">
  <h2 id="appearanceTitle">外观与显示</h2>
  <div class="appearance-setting">
    <div class="appearance-setting-copy"><strong>外观模式</strong></div>
    <div class="appearance-theme-options" role="group" aria-label="外观模式">
      <button type="button" class="appearance-theme-option" data-theme-choice="system" aria-pressed="false">跟随系统</button>
      <button type="button" class="appearance-theme-option" data-theme-choice="dark" aria-pressed="false">深色</button>
      <button type="button" class="appearance-theme-option" data-theme-choice="light" aria-pressed="false">浅色</button>
    </div>
  </div>
  <div class="appearance-setting appearance-font-setting">
    <div class="appearance-setting-copy"><strong>全局文字大小</strong></div>
    <div class="appearance-font-control">
      <span aria-hidden="true" class="appearance-font-small">A</span>
      <input id="appearanceFontScale" type="range" min="0.85" max="1.3" step="0.05" value="1" aria-label="全局文字大小">
      <span aria-hidden="true" class="appearance-font-large">A</span>
      <output id="appearanceFontValue" for="appearanceFontScale">标准</output>
    </div>
  </div>
</section>

<section class="page2-card account-sec-card">
  <h2>账号与安全</h2>
  <div class="about-list">
    <div class="about-row"><span class="about-row-label">用户名</span><span class="about-row-value" id="username">读取中…</span></div>
    <button class="about-row" id="usernameToggle" type="button" aria-expanded="false" aria-controls="usernameBody">
      <span class="about-row-label">修改用户名</span>
      <svg class="about-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
    <button class="about-row" id="passwordToggle" type="button" aria-expanded="false" aria-controls="passwordBody">
      <span class="about-row-label">修改密码</span>
      <svg class="about-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
    <button class="about-row" id="dangerToggle" type="button" aria-expanded="false" aria-controls="dangerBody">
      <span class="about-row-label account-danger-row-label">注销账号</span>
      <svg class="about-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </div>
  <div id="usernameBody" class="account-collapse-body" hidden>
    <label class="page2-label">新用户名<input id="newUsername" type="text" autocomplete="username" maxlength="32" placeholder="字母、数字、_-.，3-32位"></label>
    <p class="page2-soft">修改后需重新登录。</p>
    <button id="renameBtn" class="page2-primary" type="button">保存用户名</button>
    <p id="renameMessage" class="message" aria-live="polite"></p>
  </div>
  <div id="passwordBody" class="account-collapse-body" hidden>
    <label class="page2-label">当前密码<input id="currentPassword" type="password" autocomplete="current-password" placeholder="请输入当前密码"></label>
    <label class="page2-label">新密码<input id="newPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128" placeholder="至少6位"></label>
    <label class="page2-label">确认新密码<input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128" placeholder="再次输入新密码"></label>
    <p class="page2-soft">修改后需重新登录。</p>
    <button id="passwordBtn" class="page2-primary" type="button">保存新密码</button>
    <p id="passwordMessage" class="message" aria-live="polite"></p>
  </div>
  <div id="dangerBody" class="account-collapse-body" hidden>
    <div id="deletePrompt" class="account-danger-box">
      <strong>注销账号</strong>
      <p>注销将永久删除本账号、线路绑定与待处理申请；线路与业务数据不受影响。</p>
      <button id="deleteAccountBtn" class="page2-danger-btn" type="button">注销账号</button>
    </div>
    <div id="deleteConfirmPanel" class="account-delete-confirm" hidden>
      <strong>确认注销账号</strong>
      <p>此操作无法撤销，输入密码确认注销。</p>
      <label class="page2-label">当前密码<input id="deletePassword" type="password" autocomplete="current-password" placeholder="请输入当前密码"></label>
      <p id="deleteMessage" class="message" aria-live="polite"></p>
      <div class="account-dialog-actions">
        <button id="deleteCancel" class="page2-secondary" type="button">取消</button>
        <button id="deleteConfirm" class="page2-danger-btn" type="button">确认注销</button>
      </div>
    </div>
  </div>
</section>

<section id="aboutCard" class="page2-card about-card">
  <div class="about-head"><h2>关于</h2><span id="aboutVersion" class="about-version">网页版</span></div>
  <div class="about-list">
    <button id="checkUpdateBtn" class="about-row" type="button">
      <span class="about-row-label">检查更新</span>
      <span class="about-row-value" id="updateState">检查最新版本</span>
      <svg class="about-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
    <div id="installRow" class="about-row about-row-install" hidden>
      <span id="installLabelBtn" class="about-row-label about-row-install-label" role="button" tabindex="0">下载应用</span>
      <span class="about-row-actions">
        <a id="installDlLink" class="about-link" hidden>安卓安装包</a>
        <button id="installCopyBtn" class="about-link" type="button">复制网址</button>
      </span>
    </div>
  </div>
  <div id="installGuide" class="install-guide" hidden>
    <ol id="installGuideSteps"></ol>
  </div>
</section>

<section class="account-logout-section">
  <button id="logout" class="account-logout" type="button">退出登录</button>
  <p id="message" class="message"></p>
</section>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
function toggle(toggle,body){
 toggle?.addEventListener("click",()=>{
  const open=body.hidden;body.hidden=!open;toggle.setAttribute("aria-expanded",String(open));
  const icon=toggle.querySelector(".account-collapse-icon");if(icon)icon.textContent=open?"⌃":"⌄";
 });
}
toggle($("usernameToggle"),$("usernameBody"));
toggle($("passwordToggle"),$("passwordBody"));
toggle($("dangerToggle"),$("dangerBody"));

const themeOptions=[...document.querySelectorAll("[data-theme-choice]")];
function renderAppearance(){
 const selected=window.zpGetAppearanceTheme?window.zpGetAppearanceTheme():"system";
 themeOptions.forEach(button=>{
  const active=button.dataset.themeChoice===selected;
  button.setAttribute("aria-pressed",String(active));
  button.classList.toggle("is-selected",active);
 });
 const scale=window.zpGetFontScale?window.zpGetFontScale():1;
 const slider=$("appearanceFontScale"),output=$("appearanceFontValue");
 if(slider)slider.value=String(scale);
 if(output)output.textContent=scale<.99?"较小":scale>1.01?"较大":"标准";
}
themeOptions.forEach(button=>button.addEventListener("click",()=>{
 window.zpSetAppearanceTheme?.(button.dataset.themeChoice);
 renderAppearance();
}));
$("appearanceFontScale")?.addEventListener("input",event=>{
 window.zpSetFontScale?.(Number(event.target.value));
 renderAppearance();
});
document.addEventListener("zp:appearancechange",renderAppearance);
document.addEventListener("zp:fontscalechange",renderAppearance);


async function api(u,o={}){const r=await fetch(u,{credentials:"same-origin",cache:"no-store",...o});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||d.message||"请求失败");e.code=d.code||"HTTP_"+r.status;throw e}return d}
function show(id,e){$(id).textContent=(e.code?"["+e.code+"] ":"")+(e.message||"请求失败")}

async function load(){
 try{
  const x=await api("/api/me"),me=x.user||{};
  $("username").textContent=me.username||"—";
  $("newUsername").placeholder="当前："+(me.username||"—");
  if(me.role==="system_admin"||me.role==="admin")$("dangerToggle").hidden=true;
 }catch(e){if(e&&e.code==="HTTP_401"&&window.zpAuthFail){window.zpAuthFail("expired");return}show("message",e)}
}

$("renameBtn").onclick=async()=>{
 const username=$("newUsername").value.trim();
 if(!username){$("renameMessage").textContent="请输入新用户名";return}
 if(!/^[-A-Za-z0-9_.]{3,32}$/.test(username)){$("renameMessage").textContent="用户名需为3-32位字母、数字、下划线、短横线或点";return}
 $("renameBtn").disabled=true;$("renameMessage").textContent="保存中…";
 try{
  await api("/api/account-settings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"rename",username})});
  $("renameMessage").textContent="用户名已修改，即将返回登录页面…";
  setTimeout(()=>location.replace("/"),900);
 }catch(e){show("renameMessage",e);$("renameBtn").disabled=false}
};

$("passwordBtn").onclick=async()=>{
 const currentPassword=$("currentPassword").value,newPassword=$("newPassword").value,confirmPassword=$("confirmPassword").value;
 if(!currentPassword||!newPassword||!confirmPassword){$("passwordMessage").textContent="请完整填写密码";return}
 if(newPassword.length<6){$("passwordMessage").textContent="新密码至少6位";return}
 if(newPassword!==confirmPassword){$("passwordMessage").textContent="两次输入的新密码不一致";return}
 $("passwordBtn").disabled=true;$("passwordMessage").textContent="保存中…";
 try{
  await api("/api/account-settings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"password",currentPassword,password:newPassword,confirmPassword})});
  $("passwordMessage").textContent="密码已修改，即将返回登录页面…";
  $("currentPassword").value="";$("newPassword").value="";$("confirmPassword").value="";
  setTimeout(()=>location.replace("/"),900);
 }catch(e){show("passwordMessage",e);$("passwordBtn").disabled=false}
};

$("logout").onclick=async()=>{if(!(await zpConfirm("退出登录","确定要退出当前账号吗？","退出")))return;try{await fetch("/api/logout",{method:"POST",credentials:"same-origin"})}finally{try{sessionStorage.removeItem("zpAuth")}catch(e){}location.replace("/")}};

const deletePrompt=$("deletePrompt"),deleteConfirmPanel=$("deleteConfirmPanel");
function closeDelete(){deleteConfirmPanel.hidden=true;deletePrompt.hidden=false;$("deletePassword").value="";$("deleteMessage").textContent="";$("deleteConfirm").disabled=false}
$("deleteAccountBtn").onclick=()=>{deletePrompt.hidden=true;deleteConfirmPanel.hidden=false;setTimeout(()=>$("deletePassword").focus(),50)};
$("deleteCancel").onclick=closeDelete;
$("deleteConfirm").onclick=async()=>{
 const password=$("deletePassword").value;
 if(!password){$("deleteMessage").textContent="请输入当前密码";return}
 $("deleteConfirm").disabled=true;$("deleteMessage").textContent="正在注销…";
 try{
  await api("/api/account-settings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"delete",password})});
  $("deleteMessage").textContent="账号已注销，即将返回登录页面…";
  setTimeout(()=>location.replace("/"),700);
 }catch(e){show("deleteMessage",e);$("deleteConfirm").disabled=false}
};

/* 关于：版本号 + 检查更新 + 下载应用（PWA 安装），全浏览器适配。
   - 版本号读 /version.json（部署时更新）
   - 检查更新：触发 Service Worker 检查，有等待中的新版本就刷新
   - 下载应用：单行展示，左「下载应用」点击触发安装/引导，右「安卓安装包」同域直链（读 /downloads/manifest.json）+「复制网址」；
     已安装隐藏；微信/iOS 给步骤引导；Android/桌面 Chromium 用 beforeinstallprompt 一键安装 */
(function(){
 const card=$("aboutCard"),row=$("installRow"),copyBtn=$("installCopyBtn"),
  installDlLink=$("installDlLink"),guide=$("installGuide"),steps=$("installGuideSteps"),
  checkBtn=$("checkUpdateBtn"),state=$("updateState"),verEl=$("aboutVersion");
 if(!card)return;
 const installed=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;

 /* 版本号 */
 fetch("/version.json?ts="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(v=>{
  if(v&&v.version)verEl.textContent="版本 V"+v.version;
 }).catch(()=>{});

 /* 检查更新 */
 let wantReload=false;
 if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
   if(wantReload){wantReload=false;location.reload()}
  });
 }
 checkBtn.onclick=async()=>{
  state.textContent="检查中…";checkBtn.disabled=true;
  try{
   if("serviceWorker" in navigator){
    const reg=await navigator.serviceWorker.getRegistration();
    if(reg){
     await reg.update();
     if(reg.waiting){
      state.textContent="发现新版本，正在刷新…";wantReload=true;
      try{reg.waiting.postMessage("SKIP_WAITING")}catch(e){}
      setTimeout(()=>location.reload(),1200);
      return;
     }
    }
   }
   await fetch("/version.json?ts="+Date.now(),{cache:"no-store"});
   state.textContent="已是最新 ✓";
  }catch(e){state.textContent="网络异常，稍后再试"}
  setTimeout(()=>{state.textContent="检查最新版本";checkBtn.disabled=false},2600);
 };

 /* 下载应用：单行展示 —— 左「下载应用」点击触发安装/引导，右「GitHub 下载」「复制网址」 */
 function showSteps(list){
  steps.innerHTML="";
  list.forEach(t=>{const li=document.createElement("li");li.textContent=t;steps.appendChild(li)});
  guide.hidden=false;
 }
 async function copyUrl(){
  const url=location.href;
  try{await navigator.clipboard.writeText(url)}
  catch(e){
   const ta=document.createElement("textarea");ta.value=url;ta.style.position="fixed";ta.style.opacity="0";
   document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
  }
  if(window.zpToast)window.zpToast("网址已复制，请粘贴到浏览器打开","success");
 }
 copyBtn.onclick=copyUrl;

 const ua=navigator.userAgent||"";
 const isWeChat=/MicroMessenger/i.test(ua);
 const isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);

 /* 右侧下载直链：读 /downloads/manifest.json 动态生成（发新版只需替换 APK + 更新清单，页面零改动）。
    manifest: {version, file}；file 为 /downloads/ 下的稳定文件名。iOS 不显示（APK 仅 Android 适用）。 */
 function setApk(file,ver){
  installDlLink.href="/downloads/"+file;
  installDlLink.setAttribute("download","zhipei-one-v"+(ver||"latest")+".apk");
  installDlLink.textContent="安卓安装包"+(ver?" V"+ver:"");
  installDlLink.hidden=false;
 }
 if(isIOS){
  installDlLink.hidden=true;
 }else{
  fetch("/downloads/manifest.json?ts="+Date.now(),{cache:"no-store"})
   .then(r=>r.ok?r.json():null)
   .then(m=>{setApk((m&&m.file)||"zhipei-one-latest-release.apk",m&&m.version)})
   .catch(()=>{setApk("zhipei-one-latest-release.apk")});
 }

 if(!installed){
  row.hidden=false;
  let deferred=null;
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e});
  const label=$("installLabelBtn");
  const labelClick=()=>{
   guide.hidden=true;
   if(isWeChat){
    showSteps(["点右上角「···」","选「在浏览器中打开」","在浏览器中打开后再安装到桌面"]);
   }else if(isIOS){
    showSteps(["点底部「分享」按钮","选「添加到主屏幕」","点「添加」，之后从桌面打开"]);
   }else if(deferred){
    const ev=deferred;deferred=null;
    try{
     ev.prompt();
     Promise.resolve(ev.userChoice).then(r=>{
      if(r&&r.outcome==="accepted"){row.hidden=true;guide.hidden=true;if(window.zpToast)window.zpToast("已添加到桌面","success")}
     }).catch(()=>{});
    }catch(e){}
   }else{
    if(window.zpToast)window.zpToast("如未自动安装，请点右侧「安卓安装包」","info");
   }
  };
  label.addEventListener("click",labelClick);
  label.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();labelClick()}});
 }
 window.addEventListener("appinstalled",()=>{
  row.hidden=true;guide.hidden=true;
  if(window.zpToast)window.zpToast("已添加到桌面","success");
});
})();

load();
</script><script src="/js/ui-unified.js?v=dab603e1"></script>
<script src="/js/pwa.js?v=864ce384"></script>
