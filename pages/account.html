<script>
(function(){
  function goLogin(){
    try{document.documentElement.style.display="none"}catch(e){}
    var p=location.pathname+location.search;
    location.replace("/?redirect="+encodeURIComponent(p)+"&reason=auth");
  }
  try{
    if(sessionStorage.getItem("zpAuth")!=="1"){goLogin();return;}
  }catch(e){}
  try{
    window.addEventListener("pageshow",function(ev){
      if(ev.persisted){try{if(sessionStorage.getItem("zpAuth")!=="1")location.replace("/?reason=auth");}catch(e){}}
    });
  }catch(e){}
})();
</script>

<style>
/* ===== 账号设置页 2.0（2026-10-21 视觉重构）
   设计语言对齐成熟 App「我的」页：浅灰底 + 白色圆角卡片 + 图标行 + 分段主题选择器，
   深浅双主题全部走 --zp-* 令牌；全部功能 ID 不变，仅换壳。 ===== */

/* --- 头像 hero --- */
.acct-hero{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 0 6px}
.acct-avatar{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--zp-surface-2,#F0F2F4);border:1px solid var(--zp-line,#2A3540);
  color:var(--zp-text,#fff);font-size:40px;font-weight:700;line-height:1;user-select:none}
:root[data-zp-theme="light"] .acct-avatar{background:#F0F2F4;border-color:#D7DDE3;color:#17202A}
:root[data-zp-theme="dark"] .acct-avatar{background:#1C1C1C;border-color:#2E2E2E;color:#FFFFFF}
.acct-hero-sub{margin:0;color:var(--zp-muted,#8B98A5);font-size:13px}

/* --- 分组小标题（卡片外灰色 label） --- */
.acct-group-label{margin:18px 2px 8px;color:var(--zp-muted,#8B98A5);font-size:13px;line-height:18px}

/* --- 卡片与行 --- */
.acct-card{background:var(--zp-card,rgba(20,28,37,.8));border:1px solid var(--zp-line,#2A3540);border-radius:16px;padding:4px 16px;margin:0 0 10px}
:root[data-zp-theme="light"] .acct-card{background:#FFFFFF;border-color:#D7DDE3;box-shadow:0 8px 24px rgba(20,30,40,.06)}
:root[data-zp-theme="dark"] .acct-card{background:rgba(26,26,26,.82);border-color:#2E2E2E}
.acct-rows{display:flex;flex-direction:column}
.acct-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0;border:0;background:none;
  color:var(--zp-text,#fff);font-size:15px;text-align:left;cursor:pointer;border-bottom:1px solid var(--zp-line,#2A3540)}
:root[data-zp-theme="light"] .acct-row{border-bottom-color:rgba(20,30,40,.08)}
:root[data-zp-theme="dark"] .acct-row{border-bottom-color:#262626}
.acct-rows .acct-row:last-child{border-bottom:0}
.acct-row:active{opacity:.6}
.acct-row[role="group"]{cursor:default}
.acct-row-icon{flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--zp-muted,#8B98A5)}
.acct-row-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acct-glyph{font-size:15px;font-weight:700;letter-spacing:-1px}
.acct-row-label{flex:none}
.acct-row-value{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;color:var(--zp-muted,#8B98A5);font-size:14px}
.acct-arrow{flex:none;width:16px;height:16px;fill:none;stroke:var(--zp-muted,#8B98A5);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* --- 主题分段选择器（行内右侧，参考胶囊分段样式） --- */
.acct-theme-row{display:flex;align-items:center;gap:10px;min-height:56px}
.acct-theme-row .acct-row-label{flex:none}
.acct-seg{display:inline-flex;flex:1;justify-content:flex-end;gap:2px;padding:3px;border-radius:12px;
  background:var(--zp-surface-2,#F0F2F4)}
:root[data-zp-theme="light"] .acct-seg{background:#EFEFEF}
:root[data-zp-theme="dark"] .acct-seg{background:#1C1C1C}
.account-page .acct-seg .appearance-theme-option{min-height:36px;padding:0 13px;border:0;border-radius:9px;background:transparent;
  color:var(--zp-muted,#8B98A5);font-size:14px;font-weight:600;box-shadow:none}
.account-page .acct-seg .appearance-theme-option.is-selected{background:var(--zp-card,#FFFFFF);color:var(--zp-text,#141414);box-shadow:0 1px 4px rgba(0,0,0,.12)}
:root[data-zp-theme="light"] .account-page .acct-seg .appearance-theme-option.is-selected{background:#FFFFFF;color:#141414}
:root[data-zp-theme="dark"] .account-page .acct-seg .appearance-theme-option.is-selected{background:#3A3A3A;color:#FFFFFF}

/* --- 字体大小行 --- */

:root[data-zp-theme="light"] .account-page .account-logout-section .account-logout{background:#FFFFFF;border-color:#D7DDE3;color:#141414;box-shadow:0 8px 24px rgba(20,30,40,.06)}
:root[data-zp-theme="dark"] .account-page .account-logout-section .account-logout{background:rgba(26,26,26,.82);border-color:#2E2E2E;color:#FFFFFF}
.account-page .account-logout-section .message{margin:10px 2px 0;text-align:center}

/* --- 底部注销账号：无边框红色文字链接（与参考图一致） --- */
.acct-destroy-link{display:block;margin:16px auto 0;padding:12px 24px;border:0;background:none;

:root[data-zp-theme="light"] .acct-destroy-link{color:#C2453A}
:root[data-zp-theme="dark"] .acct-destroy-link{color:#FF8278}
.acct-destroy-link:active{opacity:.6}
.acct-destroy-link[hidden]{display:none}

/* --- 关于：品牌区（一排左右，左名称右版本，与卡片列表左右语言一致） --- */

.acct-about-name{margin:0;color:var(--zp-text,#fff);font-size:16px;font-weight:700}
.acct-about-ver{margin:0;color:var(--zp-muted,#8B98A5);font-size:12px}
/* --- 关于：获取/信息卡片 + 版权 --- */
.acct-about-copyright{margin:14px 0 4px;text-align:center;color:var(--zp-muted,#8B98A5);font-size:12px}

.install-guide ol{margin:0;padding-left:20px;color:var(--zp-muted,#8B98A5);font-size:13px;line-height:22px}

#installLabelBtn::after,.about-row-actions .about-link::after{content:"";position:absolute;inset:-14px -10px}
.about-row-actions{display:flex;align-items:center;gap:16px;flex:none;margin-left:auto}
.about-row-actions .about-link{padding:0;border:0;background:none;color:var(--zp-text,#fff);font-size:13px;text-decoration:underline;cursor:pointer}

@media(max-width:380px){
  .account-page{padding-left:12px;padding-right:12px}
  .acct-card{padding-left:12px;padding-right:12px}
  .account-page .acct-seg .appearance-theme-option{padding:0 10px}
}

<script>
const $=id=>document.getElementById(id);
function toggle(toggle,body){
 toggle?.addEventListener("click",()=>{
  const open=body.hidden;body.hidden=!open;toggle.setAttribute("aria-expanded",String(open));
 });
}
toggle($("usernameToggle"),$("usernameBody"));
toggle($("passwordToggle"),$("passwordBody"));
toggle($("dangerToggle"),$("dangerBody"));

const themeOptions=[...document.querySelectorAll("[data-theme-choice]")];
function renderAppearance(){
 const selected=window.zpGetAppearanceTheme?window.zpGetAppearanceTheme():"system";
 themeOptions.forEach(button=>{
  const active=button.dataset.themeChoice===selected;
  button.setAttribute("aria-pressed",String(active));
  button.classList.toggle("is-selected",active);
 });
 const scale=window.zpGetFontScale?window.zpGetFontScale():1;
 const slider=$("appearanceFontScale"),output=$("appearanceFontValue");
 if(slider)slider.value=String(scale);
 if(output)output.textContent=scale<.99?"较小":scale>1.01?"较大":"标准";
}
themeOptions.forEach(button=>button.addEventListener("click",()=>{
 window.zpSetAppearanceTheme?.(button.dataset.themeChoice);
 renderAppearance();
}));
$("appearanceFontScale")?.addEventListener("input",event=>{
 window.zpSetFontScale?.(Number(event.target.value));
 renderAppearance();
});
document.addEventListener("zp:appearancechange",renderAppearance);
document.addEventListener("zp:fontscalechange",renderAppearance);


async function api(u,o={}){const r=await fetch(u,{credentials:"same-origin",cache:"no-store",...o});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||d.message||"请求失败");e.code=d.code||"HTTP_"+r.status;throw e}return d}
function show(id,e){$(id).textContent=(e.code?"["+e.code+"] ":"")+(e.message||"请求失败")}

async function load(){
 try{
  const x=await api("/api/me"),me=x.user||{};
  $("username").textContent=me.username||"—";
  $("avatarChar").textContent=(me.username||"·").charAt(0).toUpperCase();
  $("newUsername").placeholder="当前："+(me.username||"—");
  if(me.role==="system_admin"||me.role==="admin")$("dangerToggle").hidden=true;
 }catch(e){if(e&&e.code==="HTTP_401"&&window.zpAuthFail){window.zpAuthFail("expired");return}show("message",e)}
}

$("renameBtn").onclick=async()=>{
 const username=$("newUsername").value.trim();
 if(!username){$("renameMessage").textContent="请输入新用户名";return}
 if(!/^[-A-Za-z0-9_.]{3,32}$/.test(username)){$("renameMessage").textContent="用户名需为3-32位字母、数字、下划线、短横线或点";return}
 $("renameBtn").disabled=true;$("renameMessage").textContent="保存中…";
 try{
  await api("/api/account-settings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"rename",username})});
  $("renameMessage").textContent="用户名已修改，即将返回登录页面…";
  setTimeout(()=>location.replace("/"),900);
 }catch(e){show("renameMessage",e);$("renameBtn").disabled=false}
};

$("passwordBtn").onclick=async()=>{
 const currentPassword=$("currentPassword").value,newPassword=$("newPassword").value,confirmPassword=$("confirmPassword").value;
 if(!currentPassword||!newPassword||!confirmPassword){$("passwordMessage").textContent="请完整填写密码";return}
 if(newPassword.length<6){$("passwordMessage").textContent="新密码至少6位";return}
 if(newPassword!==confirmPassword){$("passwordMessage").textContent="两次输入的新密码不一致";return}
 $("passwordBtn").disabled=true;$("passwordMessage").textContent="保存中…";
 try{
  await api("/api/account-settings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"password",currentPassword,password:newPassword,confirmPassword})});
  $("passwordMessage").textContent="密码已修改，即将返回登录页面…";
  $("currentPassword").value="";$("newPassword").value="";$("confirmPassword").value="";
  setTimeout(()=>location.replace("/"),900);
 }catch(e){show("passwordMessage",e);$("passwordBtn").disabled=false}
};

$("logout").onclick=async()=>{if(!(await zpConfirm("退出登录","确定要退出当前账号吗？","退出")))return;try{await fetch("/api/logout",{method:"POST",credentials:"same-origin"})}finally{try{sessionStorage.removeItem("zpAuth")}catch(e){}location.replace("/")}};

const deletePrompt=$("deletePrompt"),deleteConfirmPanel=$("deleteConfirmPanel");
function closeDelete(){deleteConfirmPanel.hidden=true;deletePrompt.hidden=false;$("deletePassword").value="";$("deleteMessage").textContent="";$("deleteConfirm").disabled=false}
$("deleteAccountBtn").onclick=()=>{deletePrompt.hidden=true;deleteConfirmPanel.hidden=false;setTimeout(()=>$("deletePassword").focus(),50)};
$("deleteCancel").onclick=closeDelete;
$("deleteConfirm").onclick=async()=>{
 const password=$("deletePassword").value;
 if(!password){$("deleteMessage").textContent="请输入当前密码";return}
 $("deleteConfirm").disabled=true;$("deleteMessage").textContent="正在注销…";
 try{
  await api("/api/account-settings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"delete",password})});
  $("deleteMessage").textContent="账号已注销，即将返回登录页面…";
  setTimeout(()=>location.replace("/"),700);
 }catch(e){show("deleteMessage",e);$("deleteConfirm").disabled=false}
};

/* 关于（成熟 App 范式 2.0）：品牌区版本 + 获取组（下载应用/网页端地址）+ 信息组（隐私/条款/帮助）。
   - 版本号读 /version.json；最新安装包版本读 /downloads/manifest.json（发版零改动）
   - 下载应用：点击触发 PWA 安装/引导；右侧「最新安装包 Vx.x.x」同域直链
   - 网页端地址：点击复制官网 https://tianyou-zhipei.pages.dev
   - 信息组暂为占位（真实页面待补） */
(function(){
 const verEl=$("aboutVersion"),
  installDlLink=$("installDlLink"),guide=$("installGuide"),steps=$("installGuideSteps"),
  webCopyBtn=$("webCopyBtn");
 if(!verEl)return;
 const installed=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;

 /* 品牌区版本号 */
 fetch("/version.json?ts="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(v=>{
  if(v&&v.version)verEl.textContent="版本 V"+v.version;
 }).catch(()=>{verEl.textContent="版本 网页版"});

 /* 网页端地址：复制固定官网地址 */
 const WEB_URL="https://tianyou-zhipei.pages.dev";
 function fallbackCopy(text){
  const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");if(window.zpToast)window.zpToast("网页端地址已复制","success")}catch(e){}
  ta.remove();
 }
 function copyWeb(){
  try{
   if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(WEB_URL).then(
     ()=>{if(window.zpToast)window.zpToast("网页端地址已复制","success")},
     ()=>fallbackCopy(WEB_URL)
    );
   }else fallbackCopy(WEB_URL);
  }catch(e){fallbackCopy(WEB_URL)}
 }
 webCopyBtn.onclick=copyWeb;

 /* 下载应用：触发安装/引导；右侧最新安装包版本读 manifest */
 function showSteps(list){
  steps.innerHTML="";
  list.forEach(t=>{const li=document.createElement("li");li.textContent=t;steps.appendChild(li)});
  guide.hidden=false;
 }
 const ua=navigator.userAgent||"";
 const isWeChat=/MicroMessenger/i.test(ua);
 const isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
 function setApk(file,ver){
  installDlLink.href="/downloads/"+file;
  installDlLink.setAttribute("download","zhipei-one-v"+(ver||"latest")+".apk");
  installDlLink.textContent="最新安装包"+(ver?" V"+ver:"");
  installDlLink.hidden=false;
 }
 const label=$("installLabelBtn");
 if(isIOS){
  installDlLink.hidden=true;
 }else{
  fetch("/downloads/manifest.json?ts="+Date.now(),{cache:"no-store"})
   .then(r=>r.ok?r.json():null)
   .then(m=>setApk((m&&m.file)||"zhipei-one-latest-release.apk",m&&m.version))
   .catch(()=>{setApk("zhipei-one-latest-release.apk")});
 }
 if(!installed){
  let deferred=null;
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e});
  const labelClick=()=>{
   guide.hidden=true;
   if(isWeChat){
    showSteps(["点右上角「···」","选「在浏览器中打开」","在浏览器中打开后再安装到桌面"]);
   }else if(isIOS){
    showSteps(["点底部「分享」按钮","选「添加到主屏幕」","点「添加」，之后从桌面打开"]);
   }else if(deferred){
    const ev=deferred;deferred=null;
    try{
     ev.prompt();
     Promise.resolve(ev.userChoice).then(r=>{
      if(r&&r.outcome==="accepted"){if(label)label.textContent="已添加到桌面";guide.hidden=true;if(window.zpToast)window.zpToast("已添加到桌面","success")}
     }).catch(()=>{});
    }catch(e){}
   }else{
    if(window.zpToast)window.zpToast("如未自动安装，请点右侧「最新安装包」","info");
   }
  };
  if(label){label.addEventListener("click",labelClick);label.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();labelClick()}});}
 }
 window.addEventListener("appinstalled",()=>{
  if(label)label.textContent="已安装";guide.hidden=true;if(window.zpToast)window.zpToast("已添加到桌面","success");
 });

 /* 信息组：占位，待补真实页面 */
 function placeholder(name){return ()=>{if(window.zpToast)window.zpToast(name+"页面即将上线","info")}}
 const p=$("privacyLink"),t=$("termsLink"),h=$("helpLink");
 if(p)p.onclick=placeholder("隐私政策");
 if(t)t.onclick=placeholder("服务条款");
 if(h)h.onclick=placeholder("帮助反馈");
})();

load();
</script><script src="/js/ui-unified.js?v=3e6b15d6"></script>
<script src="/js/pwa.js?v=864ce384"></script>
</body></html>
