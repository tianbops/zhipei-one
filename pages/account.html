<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>账号设置 · 智配One</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/mobile-ui.css"><link rel="stylesheet" href="/css/business-pages.css"></head>
<body><main class="page2 account-page">
<header class="page2-head"><a class="page2-back" href="/home.html">返回</a><h1>账号设置</h1><span></span></header>

<section class="page2-card">
  <h2>账号信息</h2>
  <div class="account-row"><span>用户名</span><strong id="username">读取中…</strong></div>
  <div class="account-row"><span>角色</span><strong id="role">读取中…</strong></div>
</section>

<section class="page2-card account-edit-card">
  <button class="account-collapse-head" id="usernameToggle" type="button" aria-expanded="false" aria-controls="usernameBody">
    <span>修改用户名</span><span class="account-collapse-icon" aria-hidden="true">⌄</span>
  </button>
  <div id="usernameBody" class="account-collapse-body" hidden>
    <label class="page2-label">新用户名<input id="newUsername" type="text" autocomplete="username" maxlength="32" placeholder="3-32位字母、数字、下划线、短横线或点"></label>
    <p class="page2-soft">修改后需要重新登录。</p>
    <button id="renameBtn" class="page2-primary" type="button">保存用户名</button>
    <p id="renameMessage" class="message" aria-live="polite"></p>
  </div>
</section>

<section class="page2-card account-edit-card">
  <button class="account-collapse-head" id="passwordToggle" type="button" aria-expanded="false" aria-controls="passwordBody">
    <span>修改密码</span><span class="account-collapse-icon" aria-hidden="true">⌄</span>
  </button>
  <div id="passwordBody" class="account-collapse-body" hidden>
    <label class="page2-label">当前密码<input id="currentPassword" type="password" autocomplete="current-password" placeholder="请输入当前密码"></label>
    <label class="page2-label">新密码<input id="newPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128" placeholder="至少6位"></label>
    <label class="page2-label">确认新密码<input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128" placeholder="再次输入新密码"></label>
    <p class="page2-soft">修改后当前登录状态会失效，需要重新登录。</p>
    <button id="passwordBtn" class="page2-primary" type="button">保存新密码</button>
    <p id="passwordMessage" class="message" aria-live="polite"></p>
  </div>
</section>

<section class="page2-card">
  <button id="logout" class="page2-primary account-logout" type="button">退出登录</button>
  <p id="message" class="message"></p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
function toggle(toggle,body){
 toggle?.addEventListener("click",()=>{
  const open=body.hidden;body.hidden=!open;toggle.setAttribute("aria-expanded",String(open));
  const icon=toggle.querySelector(".account-collapse-icon");if(icon)icon.textContent=open?"⌃":"⌄";
 });
}
toggle($("usernameToggle"),$("usernameBody"));toggle($("passwordToggle"),$("passwordBody"));
async function api(u,o={}){const r=await fetch(u,{credentials:"same-origin",cache:"no-store",...o});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||d.message||"请求失败");e.code=d.code||"HTTP_"+r.status;throw e}return d}
function show(id,e){$(id).textContent=(e.code?"["+e.code+"] ":"")+(e.message||"请求失败")}
async function load(){
 try{
  const x=await api("/api/me"),me=x.user||{};
  $("username").textContent=me.username||"—";
  $("role").textContent=me.role==="system_admin"||me.role==="admin"?"管理员":"业务用户";
  $("newUsername").value=me.username||"";
 }catch(e){show("message",e)}
}
$("renameBtn").onclick=async()=>{
 const username=$("newUsername").value.trim();
 if(!/^[A-Za-z0-9_\\-.]{3,32}$/.test(username)){$("renameMessage").textContent="用户名需为3-32位字母、数字、下划线、短横线或点";return}
 $("renameBtn").disabled=true;$("renameMessage").textContent="保存中…";
 try{
  await api("/api/account-settings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"rename",username})});
  $("renameMessage").textContent="用户名已修改，即将返回登录页面…";
  setTimeout(()=>location.replace("/"),900);
 }catch(e){show("renameMessage",e);$("renameBtn").disabled=false}
};
$("passwordBtn").onclick=async()=>{
 const currentPassword=$("currentPassword").value,newPassword=$("newPassword").value,confirmPassword=$("confirmPassword").value;
 if(!currentPassword||!newPassword||!confirmPassword){$("passwordMessage").textContent="请完整填写密码";return}
 if(newPassword.length<6){$("passwordMessage").textContent="新密码至少6位";return}
 if(newPassword!==confirmPassword){$("passwordMessage").textContent="两次输入的新密码不一致";return}
 $("passwordBtn").disabled=true;$("passwordMessage").textContent="保存中…";
 try{
  await api("/api/account-settings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"password",currentPassword,password:newPassword,confirmPassword})});
  $("passwordMessage").textContent="密码已修改，即将返回登录页面…";
  $("currentPassword").value="";$("newPassword").value="";$("confirmPassword").value="";
  setTimeout(()=>location.replace("/"),900);
 }catch(e){show("passwordMessage",e);$("passwordBtn").disabled=false}
};
$("logout").onclick=async()=>{await fetch("/api/logout",{method:"POST",credentials:"same-origin"});location.replace("/")};
load();
</script></body></html>
