<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<title>当前线路 · 智配One</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="智配One">
<link rel="stylesheet" href="/css/app.css?v=e634d2ad"><link rel="stylesheet" href="/css/ui-unified.css?v=902cf092">
<link rel="stylesheet" href="/css/mobile-ui.css?v=92642346">
<link rel="stylesheet" href="/css/business-pages.css?v=5fe2702e">
</head>
<body>
<main class="dispatch-page">
<header class="dispatch-head"><a class="dispatch-back" href="/home.html" aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><h1>当前线路</h1><span></span></header>
<section class="dispatch-section">
  <h2 class="dispatch-section-title">已有线路</h2>
  <div id="routeList" class="dispatch-list"><div class="dispatch-message">读取中…</div></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",cache:"no-store",...opt});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.error||"请求失败");return d}
function mark(id){document.querySelectorAll(".dispatch-option").forEach(b=>b.classList.toggle("selected",b.dataset.routeId===id))}
async function selectRoute(id,button){
  document.querySelectorAll(".dispatch-option").forEach(b=>b.disabled=true);
  try{await api("/api/dispatch",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({routeId:id})});location.replace("/home.html")}
  catch(e){document.querySelectorAll(".dispatch-option").forEach(b=>b.disabled=false);zpToast(e.message||"线路切换失败","error")}
}
document.querySelectorAll(".dispatch-option").forEach(b=>b.addEventListener("click",()=>selectRoute(b.dataset.routeId,b)));
async function load(){
 try{
  const [routes,dispatch]=await Promise.all([api("/api/routes"),api("/api/dispatch")]);
  const current=dispatch.dispatchRoute?.id||"";
  mark(current);
  const list=(routes.routes||[]).filter(r=>r.status==="active");
  $("routeList").innerHTML=list.length?list.map(r=>'<button class="dispatch-option" type="button" data-route-id="'+String(r.id).replaceAll('"',"&quot;")+'"><span>'+String(r.name||r.id).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")+'</span><span class="dispatch-route-meta"><small>已匹配·'+(Number(r.storeCount)||0)+'家门店</small></span></button>').join(""):'<div class="dispatch-empty">暂无已有线路</div>';
  document.querySelectorAll("#routeList .dispatch-option").forEach(b=>{b.classList.toggle("selected",b.dataset.routeId===current);b.addEventListener("click",()=>selectRoute(b.dataset.routeId,b))});
 }catch(e){$("routeList").innerHTML='<div class="dispatch-message">线路读取失败，请重试</div>'}
}
load();
</script>
<script src="/js/ui-unified.js?v=d5688363"></script>
<script src="/js/pwa.js?v=864ce384"></script>
</body>
</html>
