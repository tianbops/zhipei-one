<script>
(function(){
  function goLogin(){
    try{document.documentElement.style.display="none"}catch(e){}
    var p=location.pathname+location.search;
    location.replace("/?redirect="+encodeURIComponent(p)+"&reason=auth");
  }
  try{
    if(sessionStorage.getItem("zpAuth")!=="1"){goLogin();return;}
  }catch(e){}
  try{
    window.addEventListener("pageshow",function(ev){
      if(ev.persisted){try{if(sessionStorage.getItem("zpAuth")!=="1")location.replace("/?reason=auth");}catch(e){}}
    });
  }catch(e){}
})();
</script>

<script>
const $=id=>document.getElementById(id);
const API_TIMEOUT=10000;
async function api(url,opt={}){
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),API_TIMEOUT);
  try{
    const r=await fetch(url,{credentials:"same-origin",cache:"no-store",signal:ctl.signal,...opt});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.success)throw new Error(d.error||"请求失败");
    return d;
  }catch(e){
    if(e&&e.name==="AbortError")throw new Error("网络超时，请重试");
    throw e;
  }finally{clearTimeout(timer)}
}
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
let routeState={current:"",routes:[]};
let pickerRoute="";
let pendingRoute="";
let pickerTimer=0;

function routeName(r){const raw=r?.name||r?.id||"未命名线路";return (window.zpRouteName?window.zpRouteName(raw):raw)||raw/* 全局标准：文本位置统一「X号线」 */}

function openSheet(){
  pickerRoute=routeState.current;
  renderPicker();
  $("routeSheetBackdrop").classList.add("open");
  $("routeSheetBackdrop").setAttribute("aria-hidden","false");
  requestAnimationFrame(()=>scrollPickerTo(pickerRoute,false));
}
function closeSheet(){
  $("routeSheetBackdrop").classList.remove("open");
  $("routeSheetBackdrop").setAttribute("aria-hidden","true");
}

function openConfirm(id){
  pendingRoute=id;
  const r=routeState.routes.find(x=>x.id===id);
  $("confirmText").textContent="确定切换至"+routeName(r)+"吗？切换后，本次配送将使用该线路。";
  $("confirmBackdrop").classList.add("open");
  $("confirmBackdrop").setAttribute("aria-hidden","false");
}
function closeConfirm(){
  pendingRoute="";
  $("confirmBackdrop").classList.remove("open");
  $("confirmBackdrop").setAttribute("aria-hidden","true");
}
function renderCurrent(){
  const r=routeState.routes.find(x=>x.id===routeState.current);
  if(!r){$("currentRoute").innerHTML='<div class="dispatch-message">暂未选择配送线路</div>';return}
  $("currentRoute").innerHTML='<div class="dispatch-current-row"><div class="dispatch-current-name">'+esc(routeName(r))+'</div><div class="dispatch-current-status">已匹配<span class="dispatch-current-count">'+(Number(r.storeCount)||0)+'家门店</span></div><button id="switchRouteBtn" class="dispatch-switch" type="button">切换</button></div>';
  $("switchRouteBtn").addEventListener("click",openSheet);
}
function renderPicker(){
  const list=$("routePickerList");
  if(!routeState.routes.length){list.innerHTML='<div class="dispatch-picker-empty">暂无可配送线路</div>';$("routeSheetConfirm").disabled=true;return}
  list.innerHTML=routeState.routes.map(r=>'<button class="dispatch-picker-option" type="button" data-route-id="'+esc(r.id)+'"><span>'+esc(routeName(r))+'</span><small>'+(Number(r.storeCount)||0)+'家门店</small></button>').join("");
  list.querySelectorAll("[data-route-id]").forEach(b=>b.addEventListener("click",()=>{pickerRoute=b.dataset.routeId;scrollPickerTo(pickerRoute,true)}));
  updatePickerSelection();
}
function scrollPickerTo(id,smooth=true){
  const el=$("routePickerList").querySelector('[data-route-id="'+CSS.escape(id)+'"]');
  if(el)el.scrollIntoView({block:"center",behavior:smooth?"smooth":"auto"});
  pickerRoute=id;
  updatePickerSelection();
}
function updatePickerSelection(){
  const list=$("routePickerList");
  list.querySelectorAll(".dispatch-picker-option").forEach(b=>b.classList.toggle("is-selected",b.dataset.routeId===pickerRoute));
  $("routeSheetConfirm").disabled=!pickerRoute||pickerRoute===routeState.current;
}
function settlePicker(){
  const opts=[...$("routePickerList").querySelectorAll(".dispatch-picker-option")];
  if(!opts.length)return;
  const center=$("routePickerList").getBoundingClientRect().top+$("routePickerList").clientHeight/2;
  let best=opts[0],dist=Infinity;
  for(const el of opts){const d=Math.abs(el.getBoundingClientRect().top+el.offsetHeight/2-center);if(d<dist){dist=d;best=el}}
  pickerRoute=best.dataset.routeId;
  scrollPickerTo(pickerRoute,true);
}

async function selectRoute(id){
  $("confirmOk").disabled=true;
  try{
    await api("/api/dispatch",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({routeId:id})});
    location.replace("/home");
  }catch(e){
    $("confirmOk").disabled=false;
    window.zpToast?.(e.message||"线路切换失败","error");
  }
}
$("routeSheetCancel").addEventListener("click",closeSheet);
$("routeSheetConfirm").addEventListener("click",()=>{if(pickerRoute&&pickerRoute!==routeState.current){closeSheet();openConfirm(pickerRoute)}});
$("routePickerList").addEventListener("scroll",()=>{clearTimeout(pickerTimer);pickerTimer=setTimeout(settlePicker,90)},{passive:true});
$("routeSheetBackdrop").addEventListener("click",e=>{if(e.target===$("routeSheetBackdrop"))closeSheet()});
$("confirmCancel").addEventListener("click",closeConfirm);
$("confirmBackdrop").addEventListener("click",e=>{if(e.target===$("confirmBackdrop"))closeConfirm()});
$("confirmOk").addEventListener("click",async()=>{if(pendingRoute)await selectRoute(pendingRoute)});

// 手机端系统返回：先关闭最上层确认，再关闭线路选择层，避免直接离开线路页。
(window.zpBackHooks=window.zpBackHooks||[]).push(
  {rank:10,probe:()=>$("confirmBackdrop")?.classList.contains("open")?$("confirmBackdrop"):null,close:()=>{closeConfirm();return true}},
  {rank:20,probe:()=>$("routeSheetBackdrop")?.classList.contains("open")?$("routeSheetBackdrop"):null,close:()=>{closeSheet();return true}}
);

function renderLoadError(){
  $("currentRoute").innerHTML='<div class="dispatch-message">线路读取失败，请重试</div><button id="routeRetryBtn" class="dispatch-retry" type="button">重试</button>';
  $("routeRetryBtn").addEventListener("click",()=>{
    $("currentRoute").innerHTML='<div class="dispatch-message">读取中…</div>';
    load();
  });
}
async function load(){
  try{
    const [routes,dispatch]=await Promise.all([api("/api/routes"),api("/api/dispatch")]);
    routeState.current=dispatch.dispatchRoute?.id||"";
    routeState.routes=(routes.routes||[]).filter(r=>r.status==="active");
    renderCurrent();
  }catch(e){
    renderLoadError();
  }
}
load();
</script>
