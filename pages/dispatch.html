<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<title>线路 · 智配One</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="智配One">
<link rel="stylesheet" href="/css/app.css?v=dark1"><link rel="stylesheet" href="/css/ui-unified.css?v=dark1">
<link rel="stylesheet" href="/css/mobile-ui.css?v=dark1"><link rel="stylesheet" href="/css/business-pages.css?v=dark1">
<style>
.dispatch-page{min-height:100dvh;padding-bottom:88px;background:#05070A}
.dispatch-page .topbar{position:sticky;top:0;z-index:10}
.dispatch-intro{padding:18px 16px 10px}
.dispatch-intro h2{margin:0;font-size:20px;line-height:1.35}
.dispatch-intro p{margin:6px 0 0;color:#B8C2CC;font-size:13px}
.dispatch-section{margin:14px 16px 0}
.dispatch-section-title{margin:0 0 8px;font-size:13px;color:#7F8A95;font-weight:600}
.dispatch-current{background:#18212B;border:1px solid #2A3540;border-radius:16px;padding:16px}
.dispatch-current-label{font-size:12px;color:#7F8A95}
.dispatch-current-row{display:flex;align-items:center;gap:12px;margin-top:6px}
.dispatch-current-info{min-width:0;flex:1}
.dispatch-current-name{font-size:23px;font-weight:700;line-height:1.25;color:#fff}
.dispatch-current-status{margin-top:5px;font-size:12px;color:#B8C2CC}
.dispatch-current-count{font-size:14px;color:#fff;font-weight:600}
.dispatch-switch{min-width:72px;height:40px;padding:0 14px;border:1px solid #2A3540;border-radius:10px;background:#26313C;color:#fff;font-size:13px;font-weight:600}
.dispatch-switch:active{background:#11171D}
.dispatch-action-card{background:#18212B;border:1px solid #2A3540;border-radius:14px;overflow:hidden}
.dispatch-action{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 14px;border:0;border-bottom:1px solid #2A3540;background:transparent;color:#fff;text-align:left;cursor:pointer;text-decoration:none}
.dispatch-action:last-child{border-bottom:0}
.dispatch-action:active{background:#11171D}
.dispatch-action-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#11171D;color:#B8C2CC;flex:none}
.dispatch-action-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dispatch-action-main{min-width:0;flex:1}
.dispatch-action-main strong{display:block;font-size:15px;font-weight:600}
.dispatch-action-main small{display:block;margin-top:3px;color:#7F8A95;font-size:12px;line-height:1.35}
.dispatch-action-arrow{color:#7F8A95;font-size:20px;line-height:1}
.dispatch-more{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 2px;border:0;background:none;color:#B8C2CC;font-size:13px}
.dispatch-more:active{opacity:.7}
.dispatch-other-list{display:grid;gap:8px;margin-top:8px}
.dispatch-option{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:12px 14px;border:1px solid #2A3540;border-radius:12px;background:#18212B;color:#fff;text-align:left}
.dispatch-option:disabled{opacity:.55}
.dispatch-option-main{min-width:0;flex:1}
.dispatch-option-name{font-size:15px;font-weight:600}
.dispatch-option-meta{margin-top:3px;color:#7F8A95;font-size:12px}
.dispatch-option-arrow{color:#7F8A95;font-size:18px}
.dispatch-message,.dispatch-empty{padding:24px 12px;text-align:center;color:#7F8A95;font-size:13px}
.dispatch-sheet-backdrop{position:fixed;inset:0;z-index:50;display:none;place-items:end center;background:rgba(0,0,0,.62);padding:0}
.dispatch-sheet-backdrop.open{display:grid}
.dispatch-sheet{width:100%;max-width:480px;padding:12px 16px calc(18px + env(safe-area-inset-bottom));background:#18212B;border-top:1px solid #2A3540;border-radius:20px 20px 0 0;box-shadow:0 -12px 36px rgba(0,0,0,.32)}
.dispatch-sheet-handle{width:34px;height:4px;margin:1px auto 14px;border-radius:4px;background:#7F8A95}
.dispatch-sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dispatch-sheet h3{margin:0;font-size:18px}
.dispatch-sheet-confirm{height:36px;padding:0 14px;border:1px solid #2A3540;border-radius:9px;background:#26313C;color:#fff;font-size:13px;font-weight:600}
.dispatch-sheet-confirm:disabled{opacity:.45}
.dispatch-sheet-sub{margin:0 0 8px;color:#7F8A95;font-size:12px}
.dispatch-picker{position:relative;height:246px;overflow:hidden;border-top:1px solid #2A3540;border-bottom:1px solid #2A3540;background:#11171D}
.dispatch-picker::before,.dispatch-picker::after{content:"";position:absolute;left:0;right:0;height:78px;z-index:2;pointer-events:none}
.dispatch-picker::before{top:0;background:linear-gradient(#11171D,rgba(17,23,29,0))}
.dispatch-picker::after{bottom:0;background:linear-gradient(rgba(17,23,29,0),#11171D)}
.dispatch-picker-selection{position:absolute;left:10px;right:10px;top:calc(50% - 27px);height:54px;border-top:1px solid #2A3540;border-bottom:1px solid #2A3540;border-radius:10px;pointer-events:none;z-index:1}
.dispatch-picker-list{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;padding:96px 10px}
.dispatch-picker-list::-webkit-scrollbar{display:none}
.dispatch-picker-option{height:54px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#7F8A95;width:100%;font-size:16px;font-weight:500}
.dispatch-picker-option.is-selected{color:#fff;font-size:19px;font-weight:700}
.dispatch-picker-option small{margin-left:8px;color:#7F8A95;font-size:12px;font-weight:400}
.dispatch-picker-empty{display:grid;place-items:center;height:100%;color:#7F8A95;font-size:13px}
.dispatch-sheet-cancel{width:100%;height:46px;margin-top:10px;border:1px solid #2A3540;border-radius:10px;background:#26313C;color:#fff;font-size:14px}
.dispatch-confirm-backdrop{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.62)}
.dispatch-confirm-backdrop.open{display:grid}
.dispatch-dialog{width:min(100%,360px);padding:20px;background:#18212B;border:1px solid #2A3540;border-radius:16px}
.dispatch-dialog h3{margin:0;font-size:18px}
.dispatch-dialog p{margin:8px 0 18px;color:#B8C2CC;font-size:13px;line-height:1.55}
.dispatch-dialog-actions{display:flex;gap:10px}
.dispatch-dialog-actions button{flex:1;height:46px;border:1px solid #2A3540;border-radius:10px;font-size:14px}
.dispatch-dialog-cancel{background:#11171D;color:#B8C2CC}
.dispatch-dialog-ok{background:#26313C;color:#fff}

/* 线路页常驻导航：独立于历史 icon/font 规则，避免字体/伪元素污染中文标签 */
.dispatch-page + .zp-nope{}
.dispatch-page .bottom-nav,
.dispatch-page .bottom-nav *{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif!important;
  font-style:normal!important;
  font-variant:normal!important;
  text-transform:none!important;
  letter-spacing:0!important;
  writing-mode:horizontal-tb!important;
}
.dispatch-page .bottom-nav-item{
  overflow:hidden!important;
  white-space:nowrap!important;
  word-break:keep-all!important;
  word-wrap:normal!important;
  text-rendering:auto!important;
}
.dispatch-page .bottom-nav-item > span:last-child{
  display:block!important;
  width:100%!important;
  overflow:hidden!important;
  text-align:center!important;
  white-space:nowrap!important;
  word-break:keep-all!important;
}
.dispatch-page .bottom-nav-icon,
.dispatch-page .bottom-nav-icon svg{
  flex:none!important;
  display:block!important;
  font-size:0!important;
}
.dispatch-page .bottom-nav-icon svg *{
  font-size:0!important;
}
</style>
</head>
<body>
<main class="dispatch-page">
<header class="topbar"><a class="app-back" href="/home.html" aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><h1>线路</h1><span></span></header>

<section class="dispatch-intro">
  <h2>线路工作区</h2>
  <p>管理当前配送线路与线路资料。</p>
</section>

<section class="dispatch-section">
  <h2 class="dispatch-section-title">当前配送线路</h2>
  <div id="currentRoute" class="dispatch-current">
    <div class="dispatch-message">读取中…</div>
  </div>
</section>

<section class="dispatch-section">
  <h2 class="dispatch-section-title">线路功能</h2>
  <div class="dispatch-action-card">
    <a class="dispatch-action" href="/pages/route_apply.html?from=dispatch">
      <span class="dispatch-action-icon"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg></span>
      <span class="dispatch-action-main"><strong>线路申请</strong><small>申请维护线路、查看审核状态、解除绑定</small></span>
      <span class="dispatch-action-arrow">›</span>
    </a>
    <a class="dispatch-action" href="/pages/data.html?from=dispatch">
      <span class="dispatch-action-icon"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg></span>
      <span class="dispatch-action-main"><strong>数据中心</strong><small>查看当前线路门店资料，具备权限时可维护</small></span>
      <span class="dispatch-action-arrow">›</span>
    </a>
  </div>
</section>

<section class="dispatch-section">
  <button id="otherToggle" class="dispatch-more" type="button" aria-expanded="false">
    <span>其他可配送线路</span><span id="otherArrow">›</span>
  </button>
  <div id="otherRoutes" class="dispatch-other-list" hidden></div>
</section>

<nav class="bottom-nav" aria-label="主要功能">
  <a class="bottom-nav-item" href="/home.html?openUpload=1">
    <span class="bottom-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></span><span>上传</span>
  </a>
  <a class="bottom-nav-item" href="/pages/history.html?from=dispatch">
    <span class="bottom-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 5v4h4"/><path d="M12 7.5v5l3.2 1.9"/></svg></span><span>历史</span>
  </a>
  <a class="bottom-nav-item is-active" href="/pages/dispatch.html?from=home" aria-current="page">
    <span class="bottom-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M8 10h8M8 14h5"/></svg></span><span>线路</span>
  </a>
  <a class="bottom-nav-item" href="/pages/account.html?from=dispatch">
    <span class="bottom-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-3.2 3.1-5 7-5s6.2 1.8 7 5"/></svg></span><span>我的</span>
  </a>
</nav>
</main>

<div id="routeSheetBackdrop" class="dispatch-sheet-backdrop" aria-hidden="true">
  <section class="dispatch-sheet" role="dialog" aria-modal="true" aria-labelledby="routeSheetTitle">
    <div class="dispatch-sheet-handle"></div>
    <div class="dispatch-sheet-head"><h3 id="routeSheetTitle">选择配送线路</h3><button id="routeSheetConfirm" class="dispatch-sheet-confirm" type="button" disabled>确认</button></div>
    <p class="dispatch-sheet-sub">上下滑动选择线路，选中后点击确认。</p>
    <div class="dispatch-picker">
      <div class="dispatch-picker-selection" aria-hidden="true"></div>
      <div id="routePickerList" class="dispatch-picker-list"></div>
    </div>
    <button id="routeSheetCancel" class="dispatch-sheet-cancel" type="button">取消</button>
  </section>
</div>

<div id="confirmBackdrop" class="dispatch-confirm-backdrop" aria-hidden="true">
  <section class="dispatch-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle">切换配送线路</h3>
    <p id="confirmText"></p>
    <div class="dispatch-dialog-actions">
      <button id="confirmCancel" class="dispatch-dialog-cancel" type="button">取消</button>
      <button id="confirmOk" class="dispatch-dialog-ok" type="button">确定</button>
    </div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",cache:"no-store",...opt});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.error||"请求失败");return d}
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
let routeState={current:"",routes:[]};
let pickerRoute="";
let pendingRoute="";
let pickerTimer=0;

function routeName(r){return r?.name||r?.id||"未命名线路"}
function routeMeta(r,current=false){return (current?"当前线路 · ":"")+"已匹配 · "+(Number(r?.storeCount)||0)+"家门店"}

function openSheet(){
  pickerRoute=routeState.current;
  renderPicker();
  $("routeSheetBackdrop").classList.add("open");
  $("routeSheetBackdrop").setAttribute("aria-hidden","false");
  requestAnimationFrame(()=>scrollPickerTo(pickerRoute,false));
}
function closeSheet(){
  $("routeSheetBackdrop").classList.remove("open");
  $("routeSheetBackdrop").setAttribute("aria-hidden","true");
}

function openConfirm(id){
  pendingRoute=id;
  const r=routeState.routes.find(x=>x.id===id);
  $("confirmText").textContent="确定切换至"+routeName(r)+"吗？切换后，本次配送将使用该线路。";
  $("confirmBackdrop").classList.add("open");
  $("confirmBackdrop").setAttribute("aria-hidden","false");
}
function closeConfirm(){
  pendingRoute="";
  $("confirmBackdrop").classList.remove("open");
  $("confirmBackdrop").setAttribute("aria-hidden","true");
}
function renderCurrent(){
  const r=routeState.routes.find(x=>x.id===routeState.current);
  if(!r){$("currentRoute").innerHTML='<div class="dispatch-message">暂未选择配送线路</div>';return}
  $("currentRoute").innerHTML='<div class="dispatch-current-label">当前配送线路</div><div class="dispatch-current-row"><div class="dispatch-current-info"><div class="dispatch-current-name">'+esc(routeName(r))+'</div><div class="dispatch-current-status">已匹配</div><div class="dispatch-current-count">'+(Number(r.storeCount)||0)+'家门店</div></div><button id="switchRouteBtn" class="dispatch-switch" type="button">切换</button></div>';
  $("switchRouteBtn").addEventListener("click",openSheet);
}
function renderOther(){
  const others=routeState.routes.filter(r=>r.id!==routeState.current);
  $("otherToggle").hidden=!others.length;
  if(!others.length)return;
  $("otherRoutes").innerHTML=others.slice(0,3).map(r=>'<button class="dispatch-option" type="button" data-route-id="'+esc(r.id)+'"><span class="dispatch-option-main"><span class="dispatch-option-name">'+esc(routeName(r))+'</span><span class="dispatch-option-meta">'+esc(routeMeta(r))+'</span></span><span class="dispatch-option-arrow">›</span></button>').join("");
  $("otherRoutes").querySelectorAll("[data-route-id]").forEach(b=>b.addEventListener("click",()=>openConfirm(b.dataset.routeId)));
}
function renderPicker(){
  const list=$("routePickerList");
  if(!routeState.routes.length){list.innerHTML='<div class="dispatch-picker-empty">暂无可配送线路</div>';$("routeSheetConfirm").disabled=true;return}
  list.innerHTML=routeState.routes.map(r=>'<button class="dispatch-picker-option" type="button" data-route-id="'+esc(r.id)+'"><span>'+esc(routeName(r))+'</span><small>'+(Number(r.storeCount)||0)+'家门店</small></button>').join("");
  list.querySelectorAll("[data-route-id]").forEach(b=>b.addEventListener("click",()=>{pickerRoute=b.dataset.routeId;scrollPickerTo(pickerRoute,true)}));
  updatePickerSelection();
}
function scrollPickerTo(id,smooth=true){
  const el=$("routePickerList").querySelector('[data-route-id="'+CSS.escape(id)+'"]');
  if(el)el.scrollIntoView({block:"center",behavior:smooth?"smooth":"auto"});
  pickerRoute=id;
  updatePickerSelection();
}
function updatePickerSelection(){
  const list=$("routePickerList");
  list.querySelectorAll(".dispatch-picker-option").forEach(b=>b.classList.toggle("is-selected",b.dataset.routeId===pickerRoute));
  $("routeSheetConfirm").disabled=!pickerRoute||pickerRoute===routeState.current;
}
function settlePicker(){
  const opts=[...$("routePickerList").querySelectorAll(".dispatch-picker-option")];
  if(!opts.length)return;
  const center=$("routePickerList").getBoundingClientRect().top+$("routePickerList").clientHeight/2;
  let best=opts[0],dist=Infinity;
  for(const el of opts){const d=Math.abs(el.getBoundingClientRect().top+el.offsetHeight/2-center);if(d<dist){dist=d;best=el}}
  pickerRoute=best.dataset.routeId;
  scrollPickerTo(pickerRoute,true);
}

async function selectRoute(id){
  $("confirmOk").disabled=true;
  try{
    await api("/api/dispatch",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({routeId:id})});
    location.replace("/home.html");
  }catch(e){
    $("confirmOk").disabled=false;
    window.zpToast?.(e.message||"线路切换失败","error");
  }
}
$("routeSheetCancel").addEventListener("click",closeSheet);
$("routeSheetConfirm").addEventListener("click",()=>{if(pickerRoute&&pickerRoute!==routeState.current){closeSheet();openConfirm(pickerRoute)}});
$("routePickerList").addEventListener("scroll",()=>{clearTimeout(pickerTimer);pickerTimer=setTimeout(settlePicker,90)},{passive:true});
$("routeSheetBackdrop").addEventListener("click",e=>{if(e.target===$("routeSheetBackdrop"))closeSheet()});
$("confirmCancel").addEventListener("click",closeConfirm);
$("confirmBackdrop").addEventListener("click",e=>{if(e.target===$("confirmBackdrop"))closeConfirm()});
$("confirmOk").addEventListener("click",async()=>{if(pendingRoute)await selectRoute(pendingRoute)});
$("otherToggle").addEventListener("click",()=>{
  const hidden=$("otherRoutes").hidden;
  $("otherRoutes").hidden=!hidden;
  $("otherToggle").setAttribute("aria-expanded",String(hidden));
  $("otherArrow").textContent=hidden?"⌄":"›";
});

async function load(){
  try{
    const [routes,dispatch]=await Promise.all([api("/api/routes"),api("/api/dispatch")]);
    routeState.current=dispatch.dispatchRoute?.id||"";
    routeState.routes=(routes.routes||[]).filter(r=>r.status==="active");
    renderCurrent();renderOther();
  }catch(e){
    $("currentRoute").innerHTML='<div class="dispatch-message">线路读取失败，请重试</div>';
    $("otherToggle").hidden=true;
  }
}
load();
</script>
<script src="/js/ui-unified.js?v=9f9064ba"></script>
<script src="/js/pwa.js?v=864ce384"></script>
</body>
</html>
