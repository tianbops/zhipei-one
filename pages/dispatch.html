<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<title>当前线路 · 智配One</title>
<link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/ui-unified.css">
<link rel="stylesheet" href="/css/mobile-ui.css">
<link rel="stylesheet" href="/css/business-pages.css">
<style>
.dispatch-page{width:min(100%,430px);min-height:100dvh;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom));background:#05070A}
.dispatch-head{height:52px;display:grid;grid-template-columns:52px 1fr 52px;align-items:center}
.dispatch-back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:0;border-radius:12px;box-sizing:border-box}.dispatch-back svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.dispatch-back:active{background:#18212B}
.dispatch-head h1{margin:0;text-align:center;color:#fff;font-size:18px;font-weight:700}
.dispatch-section{margin-top:18px}
.dispatch-section-title{margin:0 0 9px 3px;color:#7F8A95;font-size:13px;font-weight:600}
.dispatch-list{display:flex;flex-direction:column;gap:9px}
.dispatch-option{width:100%;min-height:58px;padding:12px 15px;border:1px solid #2A3540;border-radius:14px;background:#18212B;color:#fff;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;font-weight:600}
.dispatch-option small{color:#7F8A95;font-size:12px;font-weight:500;white-space:nowrap}.dispatch-route-meta{margin-left:auto;display:flex;align-items:center;gap:8px;white-space:nowrap}.dispatch-route-meta small{color:#7F8A95;font-size:12px;font-weight:500}
.dispatch-option.selected{border-color:#B8C2CC;background:#202A34}
.dispatch-option:active{transform:scale(.985);background:#26313C}
.dispatch-empty,.dispatch-message{padding:16px;color:#B8C2CC;text-align:center;font-size:14px}
</style>
<style>
/* Android typography readability adjustment: size/line-height only */
.dispatch-back{font-size:16px;line-height:22px}
.dispatch-head h1{font-size:20px;line-height:26px}
.dispatch-section-title{font-size:15px;line-height:20px}
.dispatch-option{font-size:17px;line-height:23px}
.dispatch-option small,.dispatch-route-meta small{font-size:14px;line-height:20px}
.dispatch-empty,.dispatch-message{font-size:15px;line-height:22px}
</style>
</head>
<body>
<main class="dispatch-page">
<header class="dispatch-head"><a class="dispatch-back" href="/home.html" aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><h1>当前线路</h1><span></span></header>
<section class="dispatch-section">
  <h2 class="dispatch-section-title">临时线路</h2>
  <div class="dispatch-list">
    <button class="dispatch-option" type="button" data-route-id="__temporary__"><span>临时</span><small>无数据 · 全局学习</small></button>
  </div>
</section>
<section class="dispatch-section">
  <h2 class="dispatch-section-title">已有线路</h2>
  <div id="routeList" class="dispatch-list"><div class="dispatch-message">读取中…</div></div>
</section>
</main>
<script>
const TEMP="__temporary__";
const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",cache:"no-store",...opt});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.error||"请求失败");return d}
function mark(id){document.querySelectorAll(".dispatch-option").forEach(b=>b.classList.toggle("selected",b.dataset.routeId===id))}
async function selectRoute(id,button){
  document.querySelectorAll(".dispatch-option").forEach(b=>b.disabled=true);
  try{await api("/api/dispatch",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({routeId:id})});location.replace("/home.html")}
  catch(e){document.querySelectorAll(".dispatch-option").forEach(b=>b.disabled=false);zpToast(e.message||"线路切换失败","error")}
}
document.querySelectorAll(".dispatch-option").forEach(b=>b.addEventListener("click",()=>selectRoute(b.dataset.routeId,b)));
async function load(){
 try{
  const [routes,dispatch]=await Promise.all([api("/api/routes"),api("/api/dispatch")]);
  const current=dispatch.dispatchRoute?.id||"";
  mark(current);
  const list=(routes.routes||[]).filter(r=>r.status==="active");
  $("routeList").innerHTML=list.length?list.map(r=>'<button class="dispatch-option" type="button" data-route-id="'+String(r.id).replaceAll('"',"&quot;")+'"><span>'+String(r.name||r.id).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")+'</span><span class="dispatch-route-meta"><small>已匹配·'+(Number(r.storeCount)||0)+'家门店</small></span></button>').join(""):'<div class="dispatch-empty">暂无已有线路</div>';
  document.querySelectorAll("#routeList .dispatch-option").forEach(b=>{b.classList.toggle("selected",b.dataset.routeId===current);b.addEventListener("click",()=>selectRoute(b.dataset.routeId,b))});
 }catch(e){$("routeList").innerHTML='<div class="dispatch-message">线路读取失败，请重试</div>'}
}
load();
</script>
<script src="/js/ui-unified.js"></script>\n</body>
</html>
