<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>智配One · 线路申请</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="shell"><header class="topbar"><strong>线路申请</strong><a href="/home.html">返回</a></header><section class="card"><h2>申请维护线路</h2><p>选择你负责维护的线路和岗位，提交后由管理员审核。</p><label>线路<select id="route"><option value="">加载中…</option></select></label><label>岗位<select id="duty"><option value="driver">司机</option><option value="delivery">配送</option></select></label><button id="submit" type="button">提交申请</button><p id="message" class="message"></p></section><section class="card"><h2>当前申请</h2><div id="requests">加载中…</div></section></main><script>const $=id=>document.getElementById(id);async function api(u,o={}){const r=await fetch(u,{credentials:"same-origin",...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"请求失败");return d}async function load(){try{const [rs,qs]=await Promise.all([api("/api/routes"),api("/api/route-requests")]);$("route").innerHTML="<option value=\"\">请选择线路</option>"+(rs.routes||[]).filter(r=>r.status==="active").map(r=>"<option value=\""+r.id+"\">"+r.name+"</option>").join("");const routeMap=Object.fromEntries((rs.routes||[]).map(r=>[r.id,r.name])); const statusText={pending:"待审核",approved:"已批准",rejected:"已驳回"}; $("requests").innerHTML=qs.requests?.length?qs.requests.slice().reverse().map(x=>"<div class=\"request-row\"><strong>"+(routeMap[x.routeId]||x.routeId)+"</strong> · "+(x.duty==="driver"?"司机":"配送")+" · "+(statusText[x.status]||x.status)+(x.reviewedAt?" · "+new Date(x.reviewedAt).toLocaleString():"")+"</div>").join(""):"暂无线路申请记录"}catch(e){$("message").textContent=e.message}}$("submit").onclick=async()=>{try{if(!$("route").value){$("message").textContent="请选择线路";return}$("message").textContent="提交中…";await api("/api/route-requests",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({routeId:$("route").value,duty:$("duty").value})});$("message").textContent="申请已提交，等待管理员审核";await load()}catch(e){$("message").textContent=e.message}};load();</script></body></html>
