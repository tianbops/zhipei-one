<!doctype html>
<html lang="zh-CN">
<head>
<script src="/js/error-guard.js?v=f695272a"></script>
<script src="/js/fetch-retry.js?v=73861cd4"></script>
<script>
(function(){
  function goLogin(){
    try{document.documentElement.style.display="none"}catch(e){}
    var p=location.pathname+location.search;
    location.replace("/?redirect="+encodeURIComponent(p)+"&reason=auth");
  }
  try{
    if(sessionStorage.getItem("zpAuth")!=="1"){goLogin();return;}
  }catch(e){}
  try{
    window.addEventListener("pageshow",function(ev){
      if(ev.persisted){try{if(sessionStorage.getItem("zpAuth")!=="1")location.replace("/?reason=auth");}catch(e){}}
    });
  }catch(e){}
})();
</script>


<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>线路申请 · 智配One</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F6F7F9">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=8f07ea01">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="智配One">
<script>try{var t=localStorage.getItem("zp_appearance_theme")||"system";var r=(t==="light"||t==="dark")?t:(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.setAttribute("data-zp-theme",r);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",r==="light"?"#F6F7F9":"#121826");}catch(e){}</script>
<link rel="stylesheet" href="/css/app.css?v=f2f20c99"><link rel="stylesheet" href="/css/ui-base.css?v=74d8975d"><link rel="stylesheet" href="/css/ui-overlay.css?v=4ce1c2cf"><link rel="stylesheet" href="/css/ui-theme.css?v=2bcd8baa"><link rel="stylesheet" href="/css/ui-shell.css?v=d7e34ce4">
<link rel="stylesheet" href="/css/mobile-ui.css?v=3fff5e47">
<link rel="stylesheet" href="/css/business-pages.css?v=19a28a05">
<link rel="stylesheet" href="/css/zp-picker.css?v=b4e8856e">
</head>
<body>
<main class="page2 route-apply-page zp-shell">
<header class="topbar"><a class="app-back" href="/home" aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><h1>线路申请</h1><span></span></header>
<div class="zp-scroll">
<section class="page2-card">
  <h2>当前线路绑定</h2>
  <p id="binding" class="message">读取中…</p>
  <button id="unbind" class="secondary-btn" type="button" hidden>解除线路绑定</button>
</section>
<section class="page2-card maintain-card" id="maintainCard">
  <button class="collapse-head" id="maintainToggle" type="button" aria-expanded="false" aria-controls="maintainBody">
    <span>申请维护线路</span><span class="collapse-icon" aria-hidden="true">⌄</span>
  </button>
  <div id="maintainBody" class="collapse-body" hidden>
  <p class="message">选择你负责维护的线路和岗位，提交后由管理员审核。</p>
  <label class="page2-label">线路<select id="route"><option value="">加载中…</option></select></label>
  <label class="page2-label">岗位<select id="duty"><option value="driver">司机</option><option value="delivery">配送</option></select></label>
  <button id="submit" class="primary-btn" type="button">提交申请</button>
  <p id="message" class="message" aria-live="polite"></p>
  </div>
</section>
<section class="page2-card">
  <h2>我的申请记录</h2>
  <div id="requests"><div class="empty">读取中…</div></div>
</section>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const maintainToggle=$("maintainToggle"),maintainBody=$("maintainBody");
maintainToggle?.addEventListener("click",()=>{const open=maintainBody.hidden;maintainBody.hidden=!open;maintainToggle.setAttribute("aria-expanded",String(open));maintainToggle.querySelector(".collapse-icon").textContent=open?"⌃":"⌄"});
async function api(u,o={}){const r=await zpFetch(u,{credentials:"same-origin",cache:"no-store",...o}),d=await r.json().catch(()=>({}));if(!r.ok){const x=new Error(d.error||d.message||"请求失败");x.code=d.code||"HTTP_"+r.status;throw x}return d}
function msg(e){return (e.code?"["+e.code+"] ":"")+(e.message||"请求失败")}
async function load(){
 try{
  const [rs,me]=await Promise.all([api("/api/routes"),api("/api/me")]);
  const routeMap=Object.fromEntries((rs.routes||[]).map(r=>[r.id,r.name]));
  const rName=v=>(window.zpRouteName?window.zpRouteName(v):v)||v;/* 全局标准：文本位置统一「X号线」 */
  const esc2=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
  const bound=me.user?.boundRouteId,duty=me.user?.routeDuty;
  $("binding").textContent=bound&&duty?"已绑定："+rName(routeMap[bound]||bound)+" · "+(duty==="driver"?"司机":"配送"):"当前未绑定线路";
  $("unbind").hidden=!(bound&&duty);
  $("route").innerHTML='<option value="">请选择线路</option>'+(rs.routes||[]).filter(r=>r.status==="active").map(r=>'<option value="'+String(r.id).replaceAll('"',"&quot;")+'">'+esc2(rName(String(r.name||r.id)))+"</option>").join("");
  const disabled=!!(bound&&duty);
  $("route").disabled=disabled;$("duty").disabled=disabled;$("submit").disabled=disabled;
  $("message").textContent=disabled?"当前已绑定线路，无需重复申请":"";
  try{
   const qs=await api("/api/route-requests");
   const statusText={pending:"待审核",approved:"已批准",rejected:"已驳回"};
   $("requests").innerHTML=qs.requests?.length?qs.requests.slice().reverse().map(x=>'<div class="request-row"><strong>'+esc2(rName(routeMap[x.routeId]||x.routeId))+'</strong> · '+(x.duty==="driver"?"司机":"配送")+' · '+(statusText[x.status]||x.status)+(x.reviewedAt?" · "+new Date(x.reviewedAt).toLocaleString():"")+"</div>").join(""):'<div class="empty">暂无线路申请记录</div>';
  }catch(e){$("requests").textContent="申请记录加载失败："+msg(e)}
 }catch(e){if(e&&e.code==="HTTP_401"&&window.zpAuthFail){window.zpAuthFail("expired");return}$("route").innerHTML='<option value="">线路加载失败</option>';$("requests").textContent="线路加载失败："+msg(e);$("message").textContent=msg(e)}
}
$("unbind").onclick=async()=>{
 if(!(await zpConfirm("解除线路绑定","确定解除当前线路绑定吗？解除后需要重新申请并经管理员审核。","解除")))return;
 $("unbind").disabled=true;
 try{await api("/api/route-binding",{method:"POST"});$("message").textContent="线路绑定已解除";await load()}
 catch(e){$("message").textContent=msg(e)}finally{$("unbind").disabled=false}
};
$("submit").onclick=async()=>{
 if(!$("route").value){$("message").textContent="请选择线路";return}
 $("submit").disabled=true;$("message").textContent="提交中…";
 try{await api("/api/route-requests",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({routeId:$("route").value,duty:$("duty").value})});$("message").textContent="申请已提交，等待管理员审核";await load()}
 catch(e){$("message").textContent=msg(e);$("submit").disabled=!!($("route").disabled)}
};
load();
</script>

<script src="/js/pwa.js?v=68dbac73"></script>
</body>
</html>
