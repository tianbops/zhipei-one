<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>智配One · 线路申请</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="shell"><header class="topbar"><strong>线路申请</strong><a href="/home.html">返回</a></header><section class="card"><h2>当前线路绑定</h2><p id="binding">读取中…</p><button id="unbind" type="button" hidden>解除线路绑定</button></section><section class="card"><h2>申请维护线路</h2><p>选择你负责维护的线路和岗位，提交后由管理员审核。</p><label>线路<select id="route"><option value="">加载中…</option></select></label><label>岗位<select id="duty"><option value="driver">司机</option><option value="delivery">配送</option></select></label><button id="submit" type="button">提交申请</button><p id="message" class="message"></p></section><section class="card"><h2>当前申请</h2><div id="requests">加载中…</div></section></main><script>const $=id=>document.getElementById(id);async function api(u,o={}){const r=await fetch(u,{credentials:"same-origin",...o});const d=await r.json().catch(()=>({}));if(!r.ok){const x=new Error(d.error||d.message||"请求失败");x.code=d.code||"HTTP_"+r.status;x.detail=d.detail||"";throw x}return d}
function showError(e){return (e.code?"["+e.code+"] ":"")+e.message+(e.detail?" · "+e.detail:"")}
async function load(){try{const rs=await api("/api/routes");const me=await api("/api/me");const routeMap=Object.fromEntries((rs.routes||[]).map(r=>[r.id,r.name]));const bound=me.user?.boundRouteId;const duty=me.user?.routeDuty;$("binding").textContent=bound&&duty?"已绑定："+(routeMap[bound]||bound)+" · "+(duty==="driver"?"司机":"配送"):"当前未绑定线路";$("unbind").hidden=!(bound&&duty);
const boundText=bound&&duty?"当前已绑定线路，不能重复申请":"";
$("route").disabled=!!(bound&&duty);
$("duty").disabled=!!(bound&&duty);
$("submit").disabled=!!(bound&&duty);
if(bound&&duty)$("message").textContent=boundText;
$("route").innerHTML="<option value=\"\">请选择线路</option>"+(rs.routes||[]).filter(r=>r.status==="active").map(r=>"<option value=\""+r.id+"\">"+r.name+"</option>").join("");try{const qs=await api("/api/route-requests");const statusText={pending:"待审核",approved:"已批准",rejected:"已驳回"};$("requests").innerHTML=qs.requests?.length?qs.requests.slice().reverse().map(x=>"<div class=\"request-row\"><strong>"+(routeMap[x.routeId]||x.routeId)+"</strong> · "+(x.duty==="driver"?"司机":"配送")+" · "+(statusText[x.status]||x.status)+(x.reviewedAt?" · "+new Date(x.reviewedAt).toLocaleString():"")+"</div>").join(""):"暂无线路申请记录"}catch(e){$("requests").textContent="申请记录加载失败："+showError(e)}}catch(e){$("route").innerHTML="<option value=\"\">线路加载失败</option>";$("requests").textContent="线路加载失败："+showError(e);$("message").textContent=showError(e)}}
$("unbind").onclick=async()=>{if(!confirm("确定解除当前线路绑定吗？解除后需要重新申请并经管理员审核。"))return;$("unbind").disabled=true;try{await api("/api/route-binding",{method:"POST"});$("message").textContent="线路绑定已解除";await load()}catch(e){$("message").textContent=showError(e)}finally{$("unbind").disabled=false}};
$("submit").onclick=async()=>{try{if(!$("route").value){$("message").textContent="请选择线路";return}$("message").textContent="提交中…";await api("/api/route-requests",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({routeId:$("route").value,duty:$("duty").value})});$("message").textContent="申请已提交，等待管理员审核";await load()}catch(e){$("message").textContent=showError(e)}};
load();</script></body></html>
