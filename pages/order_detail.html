<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运单详情 · 智配One</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="shell"><header class="topbar"><strong>运单详情</strong><a class="text-button" href="/home.html">返回</a></header><section class="card"><h2 id="title">运单详情</h2><p id="summary" class="message">正在读取运单…</p><div id="stores"></div><div id="actions" style="display:none;margin-top:16px"><button id="confirm" type="button">确认待定门店</button></div></section></main><script>
(async()=>{const summary=document.getElementById("summary"),stores=document.getElementById("stores"),actions=document.getElementById("actions"),confirmBtn=document.getElementById("confirm"),params=new URLSearchParams(location.search),id=params.get("id"),source=params.get("source");let order=null;
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){const w=order,s=w.summary||{},pending=(w.stores||[]).filter(x=>x.pending);summary.textContent=[w.date||"日期待确认",(s.total??0)+"家 · "+(w.totalWeight??0)+"t",(s.original??0)===s.total?"":"原始"+s.original+"家",s.correction?"更正"+s.correction+"家":"",s.merged?"合并"+s.merged+"家":"",s.newStores?"新增"+s.newStores+"家":"",pending.length?"待定"+pending.length+"家":""].filter(Boolean).join("  · ");
stores.innerHTML=(w.stores||[]).map((x,i)=>'<div class="store-row"><span>'+String(i+1).padStart(2,"0")+" "+esc(x.name||x.rawName||"未识别门店")+'</span><small>'+ (x.pending?"待定":esc(x.storeId||""))+"</small></div>").join("");
actions.style.display=pending.length?"block":"none";confirmBtn.textContent=pending.length?"确认"+pending.length+"家待定门店":"确认";if(id&&source==="process")history.replaceState(null,"","/pages/order_detail.html?id="+encodeURIComponent(w.id))}
confirmBtn.onclick=async()=>{if(!order)return;let baseData=null;try{const br=await fetch("/api/base?routeId="+encodeURIComponent(order.routeId),{credentials:"same-origin"});const bd=await br.json();if(!br.ok||!bd.success)throw new Error("数据资料读取失败");baseData=bd.base}catch(e){summary.textContent=e.message||"数据资料读取失败";return}
const pending=(order.stores||[]).map((x,i)=>({x,i})).filter(v=>v.x.pending);if(!pending.length)return;
const panel=document.createElement("div");panel.id="pending-panel";panel.style.cssText="margin-top:14px;padding:12px;border:1px solid #303943;border-radius:10px;background:#11171d";
const selections=new Map();
const clean=v=>String(v??"").replace(/[\s\u3000]/g,"").replace(/[（）()【】\[\]{}<>《》“”"'‘’]/g,"").replace(/[·•、,，。；;:：!！?？\-_—]/g,"").replace(/Ⅱl|Il|II|ⅱ/gi,"II").toLowerCase();
const code=v=>{const m=String(v??"").match(/(?:^|[^A-Z0-9])(JM|A|Q)[-_ ]?(\d{3,12})(?=$|[^A-Z0-9])/i);return m?(m[1]+m[2]).toUpperCase():""};
const sim=(a,b)=>{a=clean(a);b=clean(b);if(!a||!b)return 0;if(a===b)return 1;const m=a.length,n=b.length,dp=Array(n+1);for(let j=0;j<=n;j++)dp[j]=j;for(let i=1;i<=m;i++){let prev=dp[0];dp[0]=i;for(let j=1;j<=n;j++){const old=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=old}}return 1-dp[n]/Math.max(m,n)};
function candidatesFor(x){const raw=x.rawName||x.name||"";const incoming=code(raw);return(baseData?.stores||[]).map((s,n)=>{const name=s.name||s.originalName||s.storeId||"";const sc=sim(raw.replace(/\\b(?:JM|A|Q)[-_ ]?\\d{3,12}\\b/ig,""),name.replace(/\\b(?:JM|A|Q)[-_ ]?\\d{3,12}\\b/ig,""));const sameCode=incoming&&code(name)===incoming;return{s,n,score:sc+(sameCode?.35:0)}}).sort((a,b)=>b.score-a.score).slice(0,5)}
for(const {x,i} of pending){const box=document.createElement("div");box.style.marginBottom="14px";const title=document.createElement("div");title.textContent="待确认："+(x.rawName||x.name||"未识别门店");title.style.cssText="font-weight:600;margin-bottom:8px";box.appendChild(title);const list=document.createElement("div");list.style.cssText="display:grid;gap:7px";for(const cand of candidatesFor(x)){const b=document.createElement("button");b.type="button";b.textContent=cand.s.name||cand.s.originalName||cand.s.storeId;b.style.cssText="text-align:left;padding:10px 12px;background:#18212b;border:1px solid #35404c;border-radius:8px;color:#fff";b.onclick=()=>{selections.set(i,cand.s);[...list.children].forEach(el=>el.style.borderColor="#35404c");b.style.borderColor="#7f8b98"};list.appendChild(b)}box.appendChild(list);panel.appendChild(box)}
const submit=document.createElement("button");submit.type="button";submit.textContent="确认选择";submit.style.cssText="width:100%;margin-top:4px";submit.onclick=async()=>{if(selections.size!==pending.length){summary.textContent="请为每个待定门店选择对应的数据资料门店";return}submit.disabled=true;confirmBtn.disabled=true;confirmBtn.textContent="正在确认…";const confirmations=pending.map(({x,i})=>{const target=selections.get(i);return{index:i,storeId:target.storeId,standardName:target.name}});try{const r=await fetch("/api/waybills/confirm",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({waybillId:order.id,confirmations,confirmRequestId:crypto.randomUUID()})});const bodyText=await r.text();let d=null;try{d=JSON.parse(bodyText)}catch{throw new Error("服务器未返回JSON（HTTP "+r.status+"），请稍后重试")}if(!r.ok||!d.success)throw new Error((d?.code?"["+d.code+"] ":"")+(d?.error||d?.message||"确认失败"));order=d.waybill;panel.remove();render()}catch(e){submit.disabled=false;confirmBtn.disabled=false;confirmBtn.textContent="确认"+pending.length+"家待定门店";summary.textContent=e.message||"确认失败"}};panel.appendChild(submit);confirmBtn.parentElement.appendChild(panel);confirmBtn.style.display="none";
try{const url=id&&source==="process"?"/api/waybills/latest?id="+encodeURIComponent(id):"/api/waybills/latest";const r=await fetch(url,{credentials:"same-origin"});const d=await r.json();if(!r.ok||!d.success||!d.waybill){summary.textContent="暂无当日运单";return}order=d.waybill;render()}catch(e){summary.textContent="运单读取失败"}})();
</script></body></html>
