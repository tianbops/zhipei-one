<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运单详情 · 智配One</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="shell"><header class="topbar"><strong>运单详情</strong><a class="text-button" href="/home.html">返回</a></header><section class="card"><h2 id="title">运单详情</h2><p id="summary" class="message">正在读取运单…</p><div id="stores"></div><div id="actions" style="display:none;margin-top:16px"><button id="confirm" type="button">确认待定门店</button></div></section></main><script>
(async()=>{const summary=document.getElementById("summary"),stores=document.getElementById("stores"),actions=document.getElementById("actions"),confirmBtn=document.getElementById("confirm"),params=new URLSearchParams(location.search),id=params.get("id"),source=params.get("source");let order=null;
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){const w=order,s=w.summary||{},pending=(w.stores||[]).filter(x=>x.pending);summary.textContent=[w.date||"日期待确认",(s.total??0)+"家 · "+(w.totalWeight??0)+"t",(s.original??0)===s.total?"":"原始"+s.original+"家",s.correction?"更正"+s.correction+"家":"",s.merged?"合并"+s.merged+"家":"",s.newStores?"新增"+s.newStores+"家":"",pending.length?"待定"+pending.length+"家":""].filter(Boolean).join("  · ");
stores.innerHTML=(w.stores||[]).map((x,i)=>'<div class="store-row"><span>'+String(i+1).padStart(2,"0")+" "+esc(x.name||x.rawName||"未识别门店")+'</span><small>'+ (x.pending?"待定":esc(x.storeId||""))+"</small></div>").join("");
actions.style.display=pending.length?"block":"none";confirmBtn.textContent=pending.length?"确认"+pending.length+"家待定门店":"确认";if(id&&source==="process")history.replaceState(null,"","/pages/order_detail.html?id="+encodeURIComponent(w.id))}
confirmBtn.onclick=async()=>{if(!order)return;const pending=(order.stores||[]).map((x,i)=>x.pending?{index:i,standardName:x.rawName}:null).filter(Boolean);if(!pending.length)return;confirmBtn.disabled=true;confirmBtn.textContent="正在确认…";try{const r=await fetch("/api/waybills/confirm",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({waybillId:order.id,confirmations:pending,confirmRequestId:crypto.randomUUID()})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||"确认失败");order=d.waybill;render()}catch(e){confirmBtn.disabled=false;confirmBtn.textContent="确认待定门店";summary.textContent=e.message||"确认失败"}};
try{const url=id&&source==="process"?"/api/waybills/latest?id="+encodeURIComponent(id):"/api/waybills/latest";const r=await fetch(url,{credentials:"same-origin"});const d=await r.json();if(!r.ok||!d.success||!d.waybill){summary.textContent="暂无当日运单";return}order=d.waybill;render()}catch(e){summary.textContent="运单读取失败"}})();
</script></body></html>
