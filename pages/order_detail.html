<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>运单详情 · 智配One</title>
<link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/ui-unified.css">
<link rel="stylesheet" href="/css/mobile-ui.css">
<link rel="stylesheet" href="/css/order_detail.css">
</head>
<body>
<main class="order-shell">
  <header class="order-topbar">
    <button id="backBtn" class="order-icon-btn" type="button" aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <div class="order-title">运单详情</div>
    <button id="menuBtn" class="order-icon-btn" type="button" aria-label="打开运单菜单" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <div id="menuPanel" class="order-menu" hidden>
      <div id="menuRoute" class="order-menu-route">当前线路</div>
      <button id="editRouteBtn" type="button">数据中心</button>
      <button id="shareBtn" type="button">分享</button>
      <button id="logoutBtn" class="logout" type="button">退出登录</button>
    </div>
  </header>

  <section class="order-summary-card">
    <div id="orderDate" class="order-date">正在读取运单…</div>
    <div class="order-summary-main">
      <span id="storeCount">0</span><span id="summaryUnit">家</span><b>·</b><span id="totalWeight">0.00</span><span>t</span>
    </div>
    <div id="metrics" class="order-metrics"></div>
  </section>

  <section class="order-route-card">
    <div class="order-route-head">
      <div>
        <div class="order-meta-row"><span class="order-meta-label">线路</span><span id="routeName" class="order-route-name">—</span></div>
        <div class="order-meta-row"><span class="order-meta-label">车辆</span><span id="vehicle" class="order-vehicle">—</span></div>
      </div>
    </div>
    <div id="routeList" class="order-store-list"></div>
  </section>
</main>

<div id="confirmDialog" class="order-dialog" hidden>
  <div class="order-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="order-dialog-head">
      <strong id="confirmTitle">确认待定门店</strong>
      <button id="closeConfirm" class="order-icon-btn" type="button" aria-label="关闭">×</button>
    </div>
    <div id="pendingList" class="pending-list"></div>
    <div class="order-dialog-actions">
      <button id="cancelConfirm" class="secondary-btn" type="button">取消</button>
      <button id="submitConfirm" class="primary-btn confirm-submit" type="button" disabled>请完成全部选择</button>
    </div>
  </div>
</div>
<script src="/js/order_detail.js"></script>
<script src="/js/ui-unified.js"></script>\n</body>
</html>
