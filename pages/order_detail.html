<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>当日运单 · 智配One</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="shell"><header class="topbar"><strong>当日运单</strong><a class="text-button" href="/home.html">返回</a></header><section class="card"><h2 id="title">当日运单</h2><p id="summary" class="message">正在读取运单…</p><div id="stores"></div></section></main><script>
(async()=>{const summary=document.getElementById("summary"),stores=document.getElementById("stores"),params=new URLSearchParams(location.search),id=params.get("id"),source=params.get("source");try{const url=id&&source==="process"?"/api/waybills/latest?id="+encodeURIComponent(id):"/api/waybills/latest";const r=await fetch(url,{credentials:"same-origin"});const d=await r.json();if(!r.ok||!d.success||!d.waybill){summary.textContent="暂无当日运单";return}const w=d.waybill,s=w.summary||{};summary.textContent=[w.date||"日期待确认",(s.total??0)+"家 · "+(w.totalWeight??0)+"t",(s.original??0)===s.total?"":"原始"+s.original+"家",s.correction?"更正"+s.correction+"家":"",s.merged?"合并"+s.merged+"家":"",s.newStores?"新增"+s.newStores+"家":"",s.pending?"待定"+s.pending+"家":""].filter(Boolean).join("  ·  ");stores.innerHTML=(w.stores||[]).map((x,i)=>'<div class="store-row"><span>'+String(i+1).padStart(2,"0")+" "+(x.name||x.rawName||"未识别门店")+'</span><small>'+(x.pending?"待定":x.storeId||"")+"</small></div>").join("");if(id&&source==="process")history.replaceState(null,"","/pages/order_detail.html")}catch(e){summary.textContent="当日运单读取失败"}})();
</script></body></html>
