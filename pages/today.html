<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>当日路线 · 智配One</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="shell"><header class="topbar"><strong>当日路线</strong><a class="text-button" href="/pages/history.html">返回</a></header><section class="card route-view-card"><div id="routeMeta" class="route-meta">正在读取路线…</div><div id="routeSummary" class="route-summary"></div><h2 class="route-section-title">配送路线</h2><div id="routeStores" class="store-list"></div></section></main><script>
(async()=>{const meta=document.getElementById("routeMeta"),summary=document.getElementById("routeSummary"),stores=document.getElementById("routeStores"),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),attr=v=>esc(v).replace(/'/g,"&#39;"),nav=v=>{try{const u=new URL(String(v??"").trim(),location.origin);return /^(https?:)$/.test(u.protocol)?u.href:""}catch{return""}},p=new URLSearchParams(location.search),date=p.get("date");try{const r=await fetch("/api/history"+(date?"?date="+encodeURIComponent(date):""),{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok||!d.success||!d.waybill){meta.textContent="暂无当日路线";return}const w=d.waybill,s=w.summary||{},items=Array.isArray(w.stores)?w.stores:[];meta.innerHTML="<strong>"+esc(w.routeName||w.routeId||"当前线路")+"</strong><span>"+esc(w.date||date||"")+"</span>";summary.textContent=(Number(s.total)||items.length)+"家 · "+(Math.round((Number(w.totalWeight)||0)*100)/100).toFixed(2)+"t";stores.innerHTML=items.map((x,i)=>{const name=esc(x.name||x.rawName||"未识别门店"),u=nav(x.navigation),label=String(i+1).padStart(2,"0")+"  "+name;return '<div class="store-row"><span>'+(u?'<a class="store-nav" href="'+attr(u)+'" target="_blank" rel="noopener">'+label+"</a>":label)+"</span><small>"+(x.pending?"待确认":"")+"</small></div>"}).join("")}catch(e){meta.textContent="路线读取失败"}})();
</script></body></html>
