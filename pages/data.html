<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>智配One · 数据资料</title><link rel="stylesheet" href="/css/app.css"></head>
<body><main class="shell">
<header class="topbar"><strong>数据资料</strong><a href="/home.html">返回</a></header>
<section class="card"><h2 id="title">数据资料</h2><p id="hint">加载中…</p><div id="summary" class="message"></div></section>
<section class="card" id="tools" style="display:none"><div style="display:flex;gap:10px;justify-content:flex-end"><button id="importBtn" type="button">导入数据资料</button></div><p style="margin:10px 0 0;color:#8A97A5;font-size:13px;line-height:1.6">可粘贴按配送顺序排列的门店名单，也可选择文本文件导入。导入保存后会整体替换当前线路数据资料。</p></section>
<section class="card"><div id="stores">加载中…</div><div id="maintainTools" style="display:none;margin-top:12px;grid-template-columns:1fr 1fr;gap:10px"><button id="addStore" type="button">新增门店</button><button id="saveStores" type="button">保存修改</button></div></section>
<div id="importBox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;padding:16px;box-sizing:border-box"><div style="max-width:620px;margin:5vh auto 0;background:#18212B;border:1px solid #2A3540;border-radius:16px;padding:18px;max-height:90vh;overflow:auto"><h3 style="margin:0 0 12px">导入数据资料</h3><p style="color:#8A97A5;font-size:13px;line-height:1.6">每行一家门店。支持“01、门店名称”、导航：https://…、备注：…；保存后按当前顺序生成门店编号。</p><input id="importFile" type="file" accept=".txt,.csv,.json,text/plain,text/csv,application/json" style="width:100%;margin:8px 0 12px"><textarea id="importText" style="width:100%;min-height:280px;box-sizing:border-box;border:1px solid #2A3540;border-radius:12px;background:#10161D;color:#E8EDF2;padding:12px;font-size:15px;line-height:1.6" placeholder="01、江北胡汪洋经销商
导航：https://...
备注：由经销商代送

02、渝北中景隆贸易有限公司"></textarea><div id="importPreview" style="margin:10px 0;color:#8A97A5;font-size:13px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px"><button id="importCancel" type="button">取消</button><button id="importSave" type="button">保存导入</button></div></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
async function api(u,o={}){const r=await fetch(u,{credentials:"same-origin",...o});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||d.message||"请求失败");e.code=d.code||"HTTP_"+r.status;e.detail=d.detail||"";throw e}return d}
function err(e){return(e.code?"["+e.code+"] ":"")+e.message+(e.detail?" · "+e.detail:"")}
let routeId="",canMaintain=false,stores=[],importing=false,baseVersion=1,saving=false;
function cleanName(v){return String(v||"").trim().replace(/^[、.．)）\\-\s]+|[、.．\\-\s]+$/g,"").trim()}
function parseImport(text){const raw=String(text||"").trim();if(raw.startsWith("[")||raw.startsWith("{")){try{const j=JSON.parse(raw),a=Array.isArray(j)?j:(Array.isArray(j.stores)?j.stores:[]);if(a.length)return a.map((x,i)=>({storeId:String(x.storeId||"").trim(),originalName:String(x.originalName||x.name||x.displayName||"").trim(),name:String(x.name||x.displayName||x.originalName||"").trim(),aliases:Array.isArray(x.aliases)?x.aliases:[],navigation:x.navigation||"",routeOrder:i+1,note:String(x.note||"").trim()})).filter(x=>x.name)}catch{}}const lines=String(text||"").replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean),out=[];let cur=null;const push=()=>{if(cur?.name){cur.name=cleanName(cur.name);if(cur.name)out.push(cur)}cur=null};for(let line of lines){const nav=line.match(/(?:导航\s*[:：]?\s*)?(https?:\/\/[^\s）)]+)/i);if(nav){if(!cur){const before=line.slice(0,nav.index).trim();if(before)cur={name:before,nav:"",note:""}}if(cur)cur.nav=nav[1].trim();line=(line.slice(0,nav.index)+line.slice(nav.index+nav[0].length)).trim();if(!line)continue}if(/^备注\s*[:：]/i.test(line)){if(cur)cur.note=line.replace(/^备注\s*[:：]\s*/i,"").trim();continue}const m=line.match(/^\d+\s*[、.．)）-]?\s*(.+)$/);if(m){push();cur={name:m[1].trim(),nav:"",note:""};continue}if(!cur)cur={name:line,nav:"",note:""};else cur.name+=" "+line}push();const seen=new Set();return out.filter(x=>{const k=x.name.replace(/[\s　]+/g,"").toLowerCase();if(!k||seen.has(k))return false;seen.add(k);return true}).map((x,i)=>({storeId:"",originalName:x.name,name:x.name,aliases:[],navigation:/^https?:\/\//i.test(x.nav)?x.nav:"",routeOrder:i+1,note:x.note||""}))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){const box=$("stores");if(!stores.length){box.textContent="暂无门店数据";return}box.innerHTML=stores.slice().sort((a,b)=>(a.routeOrder||0)-(b.routeOrder||0)).map((s,i)=>"<div class=\"request-row\"><strong>"+(i+1)+". "+esc(s.name||s.originalName||"未命名门店")+"</strong>"+(canMaintain?" <span style=\"float:right\"><button type=\"button\" data-edit=\""+i+"\">编辑</button> <button type=\"button\" data-del=\""+i+"\">删除</button> <button type=\"button\" data-up=\""+i+"\">↑</button> <button type=\"button\" data-down=\""+i+"\">↓</button></span>":"")+(s.aliases?.length?"<div>别名："+esc(s.aliases.join("、"))+"</div>":"")+(s.navigation?"<div>导航："+esc(s.navigation)+"</div>":"")+(s.note?"<div>备注："+esc(s.note)+"</div>":"")+"</div>").join("")}
function updatePreview(){const p=parseImport($("importText").value);$("importPreview").textContent=p.length?"已识别 "+p.length+" 家门店，保存后将整体替换当前数据资料。":"尚未识别到有效门店"}
$("importBtn").onclick=()=>{if(!canMaintain)return;$("importText").value="";$("importFile").value="";$("importPreview").textContent="";$("importBox").style.display="block"};
$("importCancel").onclick=()=>{$("importBox").style.display="none"};
$("importText").oninput=updatePreview;
$("importFile").onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{$("importText").value=await file.text();updatePreview()}catch{$("importPreview").textContent="文件读取失败"}};
$("importSave").onclick=async()=>{if(importing)return;const parsed=parseImport($("importText").value);if(!parsed.length){$("importPreview").textContent="没有可导入的门店";return}if(!confirm("确定整体替换当前线路数据资料吗？"))return;importing=true;$("importSave").disabled=true;try{const existing=new Map(stores.map(s=>[(s.name||s.originalName||"").replace(/[\\s　]+/g,"").toLowerCase(),s]));const merged=parsed.map((s,i)=>{const old=existing.get((s.name||"").replace(/[\\s　]+/g,"").toLowerCase());return {...s,storeId:old?.storeId||s.storeId||"" ,aliases:old?.aliases?.length?s.aliases.length?s.aliases:old.aliases:s.aliases,navigation:s.navigation||old?.navigation||"",note:s.note||old?.note||"",routeOrder:i+1}});const d=await api("/api/base",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({routeId,expectedVersion:baseVersion,stores:merged})});stores=Array.isArray(d.base?.stores)?d.base.stores:parsed;await load();$("importBox").style.display="none";$("summary").textContent=stores.length+"家门店 · 已更新"}catch(e){$("importPreview").textContent=err(e)}finally{importing=false;$("importSave").disabled=false}};
$("addStore").onclick=()=>{const name=window.prompt("门店名称");if(!name||!name.trim())return;stores.push({storeId:"",originalName:name.trim(),name:name.trim(),aliases:[],navigation:"",routeOrder:stores.length+1,note:""});stores.forEach((s,i)=>s.routeOrder=i+1);render()};
$("stores").onclick=e=>{const b=e.target.closest("button");if(!b)return;const i=Number(b.dataset.edit??b.dataset.del??b.dataset.up??b.dataset.down);if(!Number.isInteger(i)||i<0||i>=stores.length)return;if(b.dataset.edit!==undefined){const s=stores[i],name=window.prompt("门店名称",s.name||s.originalName||"");if(name===null||!name.trim())return;s.name=name.trim();const nav=window.prompt("导航地址",s.navigation||"");if(nav!==null)s.navigation=nav.trim();const note=window.prompt("备注",s.note||"");if(note!==null)s.note=note.trim()}else if(b.dataset.del!==undefined){if(!window.confirm("确定删除该门店吗？"))return;stores.splice(i,1)}else if(b.dataset.up!==undefined&&i>0){[stores[i-1],stores[i]]=[stores[i],stores[i-1]]}else if(b.dataset.down!==undefined&&i<stores.length-1){[stores[i],stores[i+1]]=[stores[i+1],stores[i]]}stores.forEach((s,n)=>s.routeOrder=n+1);render()};
$("saveStores").onclick=async()=>{if(saving)return;saving=true;$("saveStores").disabled=true;try{const d=await api("/api/base",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({routeId,expectedVersion:baseVersion,stores})});stores=d.base?.stores||stores;baseVersion=Number(d.base?.version)||baseVersion;render();$("summary").textContent=stores.length+"家门店 · 已保存"}catch(e){if(e.code==="BASE_VERSION_CONFLICT")await load();$("summary").textContent=err(e)}finally{saving=false;$("saveStores").disabled=false}};
async function load(){
 try{
  const d=await api("/api/dispatch"); routeId=d.dispatchRoute?.id||"";
  if(!routeId){$("hint").textContent="请先在首页选择调度线路";$("stores").textContent="暂无可查看的数据资料";return}
  if(routeId==="__temporary__"){$("title").textContent="临时线路 · 数据资料";$("hint").textContent="临时线路不建立正式数据资料";$("summary").textContent="临时线路";$("stores").textContent="临时线路使用全局学习识别门店，规划按运单原始顺序排列。";return}
  const x=await api("/api/base?routeId="+encodeURIComponent(routeId));
  canMaintain=!!x.canMaintain; $("tools").style.display=canMaintain?"block":"none"; $("maintainTools").style.display=canMaintain?"grid":"none"; stores=Array.isArray(x.base?.stores)?x.base.stores:[];baseVersion=Number(x.base?.version)||1;
  $("title").textContent=(x.route?.name||"当前线路")+" · 数据资料";
  $("hint").textContent=canMaintain?"你正在维护该线路的数据资料":"当前为查看模式，你不是该线路维护人员，不能修改数据资料";
  $("summary").textContent=stores.length+"家门店"+(x.base?.version?" · 版本 "+x.base.version:"");
  render();
 }catch(e){$("hint").textContent=err(e);$("stores").textContent="数据资料加载失败"}
}
load();
</script></body></html>
