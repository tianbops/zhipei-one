<script>
const $=id=>document.getElementById(id);
var dataBaseline="";// 门店资料基线：用于判断是否存在「暂存但未提交」的修改
// 来源驱动返回：从运单详情内进入数据资料时，返回箭头指向原运单。
// 规则与 js/ui/back.js 的层级表同源（detail⇄data 是编辑往返，origin 记住详情页原来的来源），
// 这里只写 href，让中键 / 无脚本场景也有正确目标；实际点击仍走 zpBackButton。
(function(){
  const p=new URLSearchParams(location.search);
  if(p.get("from")==="order"){
    const oid=p.get("id"),origin=p.get("origin")||"process",od=p.get("odate")||"";
    if(oid){const a=document.querySelector(".app-back");if(a)a.href="/pages/order_detail?id="+encodeURIComponent(oid)+"&source=process&from="+encodeURIComponent(origin)+(od?"&date="+encodeURIComponent(od):"")}
  }
})();
async function api(u,o={}){const r=await zpFetch(u,{credentials:"same-origin",...o});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||d.message||"请求失败");e.code=d.code||"HTTP_"+r.status;e.detail=d.detail||"";throw e}return d}
function err(e){return(e.code?"["+e.code+"] ":"")+e.message+(e.detail?" · "+e.detail:"")}
let routeId="",canMaintain=false,stores=[],baseVersion=1,saving=false,baseVersionConflict=false,editingIndex=-1,confirming=false,dragIndex=-1,editAliases=[],editGeo=null;

function cleanName(v){return String(v||"").trim().replace(/^[、.．)）\\-\s]+|[、.．\\-\s]+$/g,"").trim()}
function parseImport(text){
 const raw=String(text||"").trim();
 if(raw.startsWith("[")||raw.startsWith("{")){
  try{
   const j=JSON.parse(raw),a=Array.isArray(j)?j:(Array.isArray(j.stores)?j.stores:(Array.isArray(j.data)?j.data:[]));
   if(a.length)return a.map((x,i)=>({storeId:String(x.storeId||"").trim(),originalName:String(x.originalName||x.name||x.displayName||"").trim(),name:String(x.name||x.displayName||x.originalName||"").trim(),aliases:Array.isArray(x.aliases)?x.aliases:[],businessStoreCode:String(x.businessStoreCode||"").trim(),navigation:String(x.navigation||"").trim(),routeOrder:Number(x.routeOrder)||i+1,note:String(x.note||"").trim()})).filter(x=>x.name);
  }catch{}
 }
 const lines=String(text||"").replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean),out=[];let cur=null;
 const push=()=>{if(cur?.name){cur.name=cleanName(cur.name);if(cur.name)out.push(cur)}cur=null};
 for(let line of lines){
  const nav=line.match(/(?:导航\s*[:：]?\s*)?(https?:\/\/[^\s）)]+)/i);
  if(nav){if(!cur){const before=line.slice(0,nav.index).trim();if(before)cur={name:before,nav:"",note:""}}if(cur)cur.nav=nav[1].trim();line=(line.slice(0,nav.index)+line.slice(nav.index+nav[0].length)).trim();if(!line)continue}
  if(/^备注\s*[:：]/i.test(line)){if(cur)cur.note=line.replace(/^备注\s*[:：]\s*/i,"").trim();continue}
  const m=line.match(/^\d+\s*[、.．)）-]?\s*(.+)$/);
  if(m){push();cur={name:m[1].trim(),nav:"",note:""};continue}
  if(!cur)cur={name:line,nav:"",note:""};else cur.name+=" "+line
 }
 push();
 const seen=new Set();
 return out.filter(x=>{const k=x.name.replace(/[\s　]+/g,"").toLowerCase();if(!k||seen.has(k))return false;seen.add(k);return true}).map((x,i)=>({storeId:"",originalName:x.name,name:x.name,aliases:[],businessStoreCode:"",navigation:/^https?:\/\//i.test(x.nav)?x.nav:"",routeOrder:i+1,note:x.note||""}))
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
/* 全局标准：文本位置统一「X号线」（与 ui-unified.js 的 zpRouteName 同规则，ui-unified 未加载时兜底） */
function rn(v){const s=String(v??"").trim();if(!s)return"";if(window.zpRouteName)return window.zpRouteName(s)||s;if(/号线$/.test(s))return s;if(/^(\d+)号$/.test(s))return s.replace("号","")+"号线";if(/^\d+路$/.test(s))return s.replace("路","")+"号线";if(/^\d+$/.test(s))return s+"号线";return s}
function navUrl(v){const u=String(v||"").trim();return /^https?:\/\//i.test(u)?u:""}
function showDataFeedback(type,message,actionLabel="",action=null){
 const el=$("dataFeedback");if(!el)return;
 el.className="data-feedback "+type;el.replaceChildren();
 const text=document.createElement("span");text.textContent=message;el.appendChild(text);
 if(actionLabel&&typeof action==="function"){
  const btn=document.createElement("button");btn.type="button";btn.className="data-feedback-action";btn.textContent=actionLabel;btn.onclick=action;el.appendChild(btn)
 }
 el.hidden=false;clearTimeout(showDataFeedback.timer);
 showDataFeedback.timer=setTimeout(()=>{el.hidden=true},actionLabel?15000:2600)
}
function downloadDraft(){
 const payload={routeId,baseVersion,exportedAt:new Date().toISOString(),stores:stores.map((s,i)=>({...s,routeOrder:i+1}))};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="zhipei-one-data-draft-"+(routeId||"route")+"-"+new Date().toISOString().slice(0,10)+".json";
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)
}
function render(){
 const box=$("stores");$("storeCount").textContent=stores.length+"家";
 if(!stores.length){box.innerHTML='<div class="zp-empty">暂无门店资料</div>';return}
 const ordered=stores.map((s,index)=>({s,index})).sort((a,b)=>(a.s.routeOrder||0)-(b.s.routeOrder||0));
 box.innerHTML=ordered.map((entry,i)=>{
  const s=entry.s,index=entry.index;
  const name=esc(s.name||s.originalName||"未命名门店");
  const meta=[];
  if(s.aliases?.length)meta.push('<span><b class="data-store-meta-label">别名</b>'+esc(s.aliases.join("、").replace(/\\n/g," "))+'</span>');
  if(s.note)meta.push('<span><b class="data-store-meta-label">备注</b>'+esc(s.note)+'</span>');
  const nav=navUrl(s.navigation);
  /* 未定位角标：只标缺失的，已有坐标的不占视觉。保存后自动补齐，剩下的就是没链接的。 */
  const located=!!geoOfStore(s);
  return '<article class="data-store-row" data-index="'+index+'" draggable="'+(canMaintain?"true":"false")+'">'+
   '<span class="data-store-index">'+String(i+1).padStart(2,"0")+'</span>'+
   '<div class="data-store-main">'+
   '<div class="data-store-name-line">'+
   (nav?'<a class="data-store-name data-store-nav" href="'+esc(nav)+'" target="_blank" rel="noopener noreferrer">'+name+(located?"":'<em class="data-store-geo">未定位</em>')+'</a>':'<strong class="data-store-name">'+name+(located?"":'<em class="data-store-geo">未定位</em>')+'</strong>')+
   '</div>'+
   (meta.length?'<div class="data-store-meta">'+meta.join("")+'</div>':"")+
   '</div>'+
   (canMaintain?'<div class="data-swipe-actions"><button type="button" data-swipe-edit="'+index+'">编辑</button><button type="button" class="data-swipe-delete" data-swipe-delete="'+index+'">删除</button></div>':"")+
   '</article>'
 }).join("");
}
/* ===== 位置（坐标）=====
   门店的坐标不由人填：把高德「分享」出来的链接粘进「导航地址」，
   粘贴后 0.5 秒（以及保存时）由服务端代取 302 落点，从中取出 GCJ-02 坐标。
   管理员不需要知道有「解析」这个动作，也不需要懂经纬度。
   坐标存在 store 上（lat/lng/address），提交仍走原来的 /api/base。 */
/* null / "" 不能被 Number() 变成 0 —— 否则「没有坐标」会被当成 (0,0) 的已定位门店，
   列表不再显示角标、保存时也跳过解析，最后导航到几内亚湾。范围校验与后端 numOrNull 一致。 */
function numOf(v){if(v==null||v==="")return null;const n=Number(v);return Number.isFinite(n)?n:null}
function geoOfStore(s){
 const lat=numOf(s?.lat),lng=numOf(s?.lng);
 if(lat==null||lng==null)return null;
 if(lat<18||lat>54||lng<73||lng>136)return null;
 return {lat,lng,address:String(s?.address||"")};
}
function geoText(g){return g?g.lat.toFixed(6)+", "+g.lng.toFixed(6):""}
const GEO_REASON={EMPTY:"先粘贴链接或坐标",INVALID_URL:"链接不完整，请检查是否复制全",UNSUPPORTED_HOST:"只认高德链接；百度/腾讯请在高德里搜到这家店后再分享",TIMEOUT:"网络超时，请重试",FETCH_FAILED:"链接打不开，可能已失效",NO_COORD:"这个链接里没有坐标，请用高德的「分享」重新复制"};
function setGeoHint(msg,kind){
 const el=$("editGeoHint");if(!el)return;
 if(msg){el.textContent=msg;el.className="data-field-hint"+(kind?" "+kind:"");return}
 if(editGeo){el.textContent="已定位"+(editGeo.address?" · "+editGeo.address:"")+"，保存后司机点门店名可直接导航";el.className="data-field-hint ok";return}
 el.textContent="在高德地图找到这家店 → 分享 → 复制链接 → 粘贴到这里，保存即自动定位";el.className="data-field-hint";
}
/* 只有「链接」或「两个小数」才值得发请求；"A栋B1" 这类备注不发外网 */
function looksResolvable(v){return /^https?:\/\//i.test(v)||/^\d{2,3}\.\d{3,}\s*[,，、\s]\s*\d{1,3}\.\d{3,}$/.test(v)}
async function parseGeoTarget(text){
 const r=await api("/api/store/geo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({routeId,items:[{text}]})});
 return r.items&&r.items[0];
}
/* 一段输入 → 坐标。成功写 editGeo 并刷新提示；失败只提示，不阻断保存
   （保存了链接，导航仍可用，只是会停在搜索结果页）。
   同一段文本正在解析时复用同一个请求：粘贴后马上点保存会同时触发防抖与兜底，
   不去重就会对同一个短链打两次外网（每次都是一次真实 302）。 */
let geoResolvedFor="",geoInflight=null;
async function resolveGeo(text){
 const v=String(text||"").trim();
 if(!v){editGeo=null;setGeoHint();return null}
 if(!looksResolvable(v)){editGeo=null;setGeoHint();return null}
 if(geoInflight&&geoInflight.text===v)return geoInflight.promise;
 setGeoHint("正在识别位置…");
 const promise=(async()=>{
  try{
   const it=await parseGeoTarget(v);
   if(it&&it.ok){editGeo={lat:it.lat,lng:it.lng,address:it.address||""};geoResolvedFor=v;setGeoHint();return editGeo}
   editGeo=null;setGeoHint(GEO_REASON[it?.reason]||"没识别出位置，导航仍可用，但会停在搜索结果页","bad");return null
  }catch(e){editGeo=null;setGeoHint("识别失败："+err(e)+"，可保存后再试","bad");return null}
 })();
 geoInflight={text:v,promise};
 try{return await promise}finally{geoInflight=null}
}
function openEditor(index=-1){
 editingIndex=index;
 const s=index>=0?stores[index]:{name:"",originalName:"",navigation:"",note:"",aliases:[]};
 $("editTitle").textContent=index>=0?"编辑门店":"新增门店";
 $("editOrder").value=index>=0?(s.routeOrder||index+1):stores.length+1;
 updateOrderHint();
 $("editName").value=s.name||s.originalName||"";
 $("editNavigation").value=s.navigation||"";
 editGeo=geoOfStore(s);
 /* 已有坐标的门店：把「已解析的输入原文」记成当前链接，
    这样打开面板不会因为值没变而误作废坐标 */
 geoResolvedFor=editGeo?String(s.navigation||"").trim():"";
 setGeoHint();
 $("editNote").value=s.note||"";autoGrow($("editNote"));
 editAliases=Array.isArray(s.aliases)?s.aliases.map(x=>String(x).trim()).filter(Boolean):[];renderEditAliases();
 $("editError").textContent="";
 showPanel("editBox");
 setTimeout(()=>$("editName").focus(),0)
}

/* 自动定位：把「有高德链接但还没坐标」的门店一次性补齐。
   编辑保存、批量粘贴、恢复数据、点「提交更新」都汇到这里 ——
   管理员只需要粘贴链接，解析是保存过程的一部分，不是额外操作。
   只改内存里的暂存数据，落库仍是 submitStores 的 PUT，不绕过「先预览再提交」。 */
async function autoLocate(list,onProgress){
 const targets=(list||[]).filter(s=>!geoOfStore(s)&&/^https?:\/\//i.test(String(s?.navigation||"").trim()));
 if(!targets.length)return{ok:0,fail:[]};
 let ok=0;const fail=[];
 /* 服务端单次上限 10 条（Cloudflare subrequest 配额），这里必须同尺寸分片 */
 for(let k=0;k<targets.length;k+=10){
  const chunk=targets.slice(k,k+10);
  try{
   const r=await api("/api/store/geo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({routeId,items:chunk.map(x=>({text:x.navigation}))})});
   (r.items||[]).forEach((it,j)=>{const s=chunk[j];if(!s)return;
    if(it&&it.ok){s.lat=it.lat;s.lng=it.lng;s.address=it.address||"";ok++}
    else fail.push(s.name||"未命名门店");
   });
  }catch(e){chunk.forEach(s=>fail.push(s.name||"未命名门店"))}
  if(onProgress)onProgress(Math.min(k+10,targets.length),targets.length);
  if(k+10<targets.length)await new Promise(r=>setTimeout(r,120));
 }
 return{ok,fail};
}

 }catch(e){

/* 列表手势（2026-11-05 修正）
   左滑：露出「编辑 / 删除」动作条；右滑：只把动作条收起来。
   此前右滑会把该行加进隐藏集合并整行 display:none，看起来等同「删掉门店」，
   既没有二次确认也没有撤销；更糟的是提交时 stores 仍是完整的，保存后门店又回来 ——
   视觉删除与真实数据不一致。现在删除只有一条路：点动作条里的「删除」+ zpConfirm 确认。 */
function closeSwipeRows(){document.querySelectorAll(".data-store-row.data-swipe-open").forEach(x=>x.classList.remove("data-swipe-open"))}
function bindTouch(){
 const list=$("stores");let touchRow=null;
 const reset=row=>{if(!row)return;clearTimeout(row._timer);row.classList.remove("data-drag-active");row._touch=null;touchRow=null};
 list.addEventListener("touchstart",e=>{
  const row=e.target.closest(".data-store-row");if(!row||!canMaintain)return;
  if(e.target.closest(".data-swipe-actions button,.data-store-nav"))return;/* 按钮/链接上起手不做手势 */
  touchRow=row;
  row._touch={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now(),long:false,locked:null};
  row._timer=setTimeout(()=>{if(row._touch){row._touch.long=true;row.classList.add("data-drag-active")}},550)
 },{passive:true});
 list.addEventListener("touchmove",e=>{
  const row=touchRow,t=row?row._touch:null;if(!row||!t)return;
  const dx=e.touches[0].clientX-t.x,dy=e.touches[0].clientY-t.y;
  /* 方向锁定（与首页月度卡一致）：先到 6px 即定性 X/Y。滚列表一旦判为纵向，
     抬手时横向位移再大也不能当成左右滑，避免斜着一划就把门店划没。 */
  if(t.locked===null&&(Math.abs(dx)>6||Math.abs(dy)>6))t.locked=Math.abs(dx)>Math.abs(dy)?"x":"y";
  if(Math.abs(dx)>12||Math.abs(dy)>12)clearTimeout(row._timer);/* 动了就不再判长按 */
  if(t.long){if(e.cancelable)e.preventDefault();row.classList.add("data-drag-active");return}
  if(t.locked==="x"&&e.cancelable)e.preventDefault();/* 横向意图：别让页面滚动抢走手势 */
 },{passive:false});
 list.addEventListener("touchend",e=>{
  const row=touchRow,t=row?row._touch:null;if(!row||!t)return;
  const dx=e.changedTouches[0].clientX-t.x,dy=e.changedTouches[0].clientY-t.y,long=t.long,locked=t.locked;
  if(long){const target=document.elementFromPoint(e.changedTouches[0].clientX,e.changedTouches[0].clientY)?.closest(".data-store-row");reset(row);if(target&&target!==row){applyOrder(Number(row.dataset.index),Number(target.dataset.index))}return}
  reset(row);
  if(locked!=="x")return;/* 纵向滚动 / 只是轻点：不触发任何滑动动作 */
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){
   closeSwipeRows();
   if(dx<0)row.classList.add("data-swipe-open")/* 右滑到此为止：只收起，不碰数据 */
  }
 },{passive:true});
 list.addEventListener("touchcancel",()=>{reset(touchRow)},{passive:true});
 list.addEventListener("dragstart",e=>{const row=e.target.closest(".data-store-row");if(!row||!canMaintain)return;dragIndex=Number(row.dataset.index);row.classList.add("data-drag-active")});
 list.addEventListener("dragover",e=>{if(dragIndex>=0)e.preventDefault()});
 list.addEventListener("drop",e=>{const row=e.target.closest(".data-store-row");if(!row||dragIndex<0)return;e.preventDefault();applyOrder(dragIndex,Number(row.dataset.index));dragIndex=-1});
 list.addEventListener("dragend",()=>{dragIndex=-1;document.querySelectorAll(".data-drag-active").forEach(x=>x.classList.remove("data-drag-active"))});
}

   另加页面级未保存拦截，保护「暂存但尚未提交」的门店修改。 */
