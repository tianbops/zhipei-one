<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>智配One · 数据资料</title><link rel="stylesheet" href="/css/app.css"></head>
<body><main class="shell">
<header class="topbar"><strong>数据资料</strong><a href="/home.html">返回</a></header>
<section class="card"><h2 id="title">数据资料</h2><p id="hint">加载中…</p><div id="summary" class="message"></div></section>
<section class="card"><div id="stores">加载中…</div></section>
</main>
<script>
const $=id=>document.getElementById(id);
async function api(u,o={}){const r=await fetch(u,{credentials:"same-origin",...o});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||d.message||"请求失败");e.code=d.code||"HTTP_"+r.status;e.detail=d.detail||"";throw e}return d}
function err(e){return(e.code?"["+e.code+"] ":"")+e.message+(e.detail?" · "+e.detail:"")}
let routeId="",canMaintain=false,stores=[];
async function load(){
 try{
  const d=await api("/api/dispatch"); routeId=d.dispatchRoute?.id||"";
  if(!routeId){$("hint").textContent="请先在首页选择调度线路";$("stores").textContent="暂无可查看的数据资料";return}
  if(routeId==="__temporary__"){$("title").textContent="临时线路 · 数据资料";$("hint").textContent="临时线路不建立正式数据资料";$("summary").textContent="临时线路";$("stores").textContent="临时线路使用全局学习识别门店，规划按运单原始顺序排列。";return}
  const x=await api("/api/base?routeId="+encodeURIComponent(routeId));
  canMaintain=!!x.canMaintain; stores=Array.isArray(x.base?.stores)?x.base.stores:[];
  $("title").textContent=(x.route?.name||"当前线路")+" · 数据资料";
  $("hint").textContent=canMaintain?"你正在维护该线路的数据资料":"当前为查看模式，你不是该线路维护人员，不能修改数据资料";
  $("summary").textContent=stores.length+"家门店"+(x.base?.version?" · 版本 "+x.base.version:"");
  $("stores").innerHTML=stores.length?stores.slice().sort((a,b)=>(a.routeOrder||0)-(b.routeOrder||0)).map((s,i)=>"<div class=\"request-row\"><strong>"+(s.routeOrder||i+1)+". "+(s.name||s.originalName||"未命名门店")+"</strong>"+(s.aliases?.length?"<div>别名："+s.aliases.join("、")+"</div>":"")+(s.navigation?"<div>导航："+String(s.navigation)+"</div>":"")+(s.note?"<div>备注："+s.note+"</div>":"")+"</div>").join(""):"暂无门店数据";
 }catch(e){$("hint").textContent=err(e);$("stores").textContent="数据资料加载失败"}
}
load();
</script></body></html>
