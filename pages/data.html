<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>智配One · 数据中心</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/mobile-ui.css"><link rel="stylesheet" href="/css/business-pages.css"><link rel="stylesheet" href="/css/data.css"></head>
<body><main class="page2 data-page">
<header class="page2-head"><a class="page2-back" href="/home.html">返回</a><h1>数据中心</h1><span></span></header>
<section class="page2-card data-route-card"><div class="data-route-title"><h2 id="title">数据中心</h2><span class="data-route-badge">线路资料</span></div><p id="hint" class="data-route-hint">加载中…</p><div id="summary" class="data-summary"><strong>—</strong><span>正在读取</span></div></section>
<section class="card data-tools-card" id="tools" style="display:none"><div class="data-toolbar"><div><div class="data-toolbar-title">批量维护</div><div class="data-toolbar-sub">按配送顺序整体更新门店资料</div></div><button id="importBtn" class="secondary-btn" type="button">导入资料</button></div></section>
<section class="page2-card data-list-card"><div class="data-list-head"><span class="data-list-title">门店资料</span><span id="storeCount" class="data-list-count">—</span></div><div id="stores" class="data-store-list">加载中…</div><div id="maintainTools" class="data-maintain" style="display:none"><button id="addStore" class="secondary-btn" type="button">新增门店</button><button id="saveStores" class="primary-btn data-save" type="button">保存修改</button></div></section>
<div id="editBox" class="data-import data-editor" style="display:none"><div class="data-import-panel data-editor-panel"><div class="data-import-head"><h3 id="editTitle">编辑门店</h3><button id="editClose" class="data-import-close" type="button" aria-label="关闭">×</button></div><label class="data-field"><span>门店名称</span><input id="editName" class="data-input" type="text" maxlength="120"></label><label class="data-field"><span>导航地址</span><input id="editNavigation" class="data-input" type="url" placeholder="https://..."></label><label class="data-field"><span>备注</span><textarea id="editNote" class="data-textarea data-note" placeholder="可选"></textarea></label><div id="editError" class="data-help data-preview"></div><div class="data-import-actions"><button id="editCancel" type="button">取消</button><button id="editSave" type="button">保存</button></div></div></div>
<div id="confirmBox" class="data-import data-confirm" style="display:none"><div class="data-confirm-panel"><div class="data-confirm-icon">!</div><h3 id="confirmTitle">确认操作</h3><p id="confirmMessage"></p><div class="data-import-actions"><button id="confirmCancel" type="button">取消</button><button id="confirmOk" type="button">确定</button></div></div></div>
<div id="importBox" class="data-import" style="display:none"><div class="data-import-panel"><div class="data-import-head"><h3>导入数据资料</h3><button id="importClose" class="data-import-close" type="button" aria-label="关闭">×</button></div><p class="data-help">每行一家门店。支持编号、导航和备注；保存后按当前顺序生成门店编号。</p><input id="importFile" class="data-file" type="file" accept=".txt,.csv,.json,text/plain,text/csv,application/json"><textarea id="importText" class="data-textarea" placeholder="01、江北胡汪洋经销商
导航：https://...
备注：由经销商代送

02、渝北中景隆贸易有限公司"></textarea><div id="importPreview" class="data-help data-preview"></div><div class="data-import-actions"><button id="importCancel" type="button">取消</button><button id="importSave" type="button">保存导入</button></div></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
async function api(u,o={}){const r=await fetch(u,{credentials:"same-origin",...o});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||d.message||"请求失败");e.code=d.code||"HTTP_"+r.status;e.detail=d.detail||"";throw e}return d}
function err(e){return(e.code?"["+e.code+"] ":"")+e.message+(e.detail?" · "+e.detail:"")}
let routeId="",canMaintain=false,stores=[],importing=false,baseVersion=1,saving=false,editingIndex=-1,confirming=false;
function cleanName(v){return String(v||"").trim().replace(/^[、.．)）\\-\s]+|[、.．\\-\s]+$/g,"").trim()}
function parseImport(text){const raw=String(text||"").trim();if(raw.startsWith("[")||raw.startsWith("{")){try{const j=JSON.parse(raw),a=Array.isArray(j)?j:(Array.isArray(j.stores)?j.stores:[]);if(a.length)return a.map((x,i)=>({storeId:String(x.storeId||"").trim(),originalName:String(x.originalName||x.name||x.displayName||"").trim(),name:String(x.name||x.displayName||x.originalName||"").trim(),aliases:Array.isArray(x.aliases)?x.aliases:[],navigation:x.navigation||"",routeOrder:i+1,note:String(x.note||"").trim()})).filter(x=>x.name)}catch{}}const lines=String(text||"").replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean),out=[];let cur=null;const push=()=>{if(cur?.name){cur.name=cleanName(cur.name);if(cur.name)out.push(cur)}cur=null};for(let line of lines){const nav=line.match(/(?:导航\s*[:：]?\s*)?(https?:\/\/[^\s）)]+)/i);if(nav){if(!cur){const before=line.slice(0,nav.index).trim();if(before)cur={name:before,nav:"",note:""}}if(cur)cur.nav=nav[1].trim();line=(line.slice(0,nav.index)+line.slice(nav.index+nav[0].length)).trim();if(!line)continue}if(/^备注\s*[:：]/i.test(line)){if(cur)cur.note=line.replace(/^备注\s*[:：]\s*/i,"").trim();continue}const m=line.match(/^\d+\s*[、.．)）-]?\s*(.+)$/);if(m){push();cur={name:m[1].trim(),nav:"",note:""};continue}if(!cur)cur={name:line,nav:"",note:""};else cur.name+=" "+line}push();const seen=new Set();return out.filter(x=>{const k=x.name.replace(/[\s　]+/g,"").toLowerCase();if(!k||seen.has(k))return false;seen.add(k);return true}).map((x,i)=>({storeId:"",originalName:x.name,name:x.name,aliases:[],navigation:/^https?:\/\//i.test(x.nav)?x.nav:"",routeOrder:i+1,note:x.note||""}))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){const box=$("stores");$("storeCount").textContent=stores.length+"家";if(!stores.length){box.innerHTML='<div class="data-empty">暂无门店资料</div>';return}const ordered=stores.map((s,index)=>({s,index})).sort((a,b)=>(a.s.routeOrder||0)-(b.s.routeOrder||0));box.innerHTML=ordered.map((entry,i)=>{const s=entry.s,index=entry.index;const meta=(s.aliases?.length?"<span><b class=\"data-store-meta-label\">别名</b>"+esc(s.aliases.join("、"))+"</span>":"")+(s.navigation?"<span><b class=\"data-store-meta-label\">导航</b>"+esc(s.navigation)+"</span>":"")+(s.note?"<span><b class=\"data-store-meta-label\">备注</b>"+esc(s.note)+"</span>":"");const actions=canMaintain?"<div class=\"data-store-actions\"><button type=\"button\" class=\"data-store-more\" data-menu=\""+index+"\">•••</button><div class=\"data-store-menu\" data-menu-panel=\""+index+"\"><button type=\"button\" data-edit=\""+index+"\">编辑资料</button><button type=\"button\" data-up=\""+index+"\">上移</button><button type=\"button\" data-down=\""+index+"\">下移</button><button type=\"button\" class=\"data-danger\" data-del=\""+index+"\">删除</button></div></div>":"";return "<div class=\"data-store-row\"><span class=\"data-store-index\">"+String(i+1).padStart(2,"0")+"</span><div class=\"data-store-main\"><div class=\"data-store-name-line\"><strong class=\"data-store-name\">"+esc(s.name||s.originalName||"未命名门店")+"</strong>"+actions+"</div>"+(meta?"<div class=\"data-store-meta\">"+meta+"</div>":"")+"</div></div>"}).join("")}
function updatePreview(){const p=parseImport($("importText").value);$("importPreview").textContent=p.length?"已识别 "+p.length+" 家门店，保存后将整体替换当前数据资料。":"尚未识别到有效门店"}
$("importBtn").onclick=()=>{if(!canMaintain)return;$("importText").value="";$("importFile").value="";$("importPreview").textContent="";$("importBox").style.display="block"};
$("importCancel").onclick=()=>{$("importBox").style.display="none"};
$("importClose").onclick=()=>{$("importBox").style.display="none"};
$("importText").oninput=updatePreview;
$("importFile").onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{$("importText").value=await file.text();updatePreview()}catch{$("importPreview").textContent="文件读取失败"}};
$("importSave").onclick=async()=>{if(importing)return;const parsed=parseImport($("importText").value);if(!parsed.length){$("importPreview").textContent="没有可导入的门店";return}if(!await askConfirm("替换门店资料","导入内容将整体替换当前线路门店资料，是否继续？"))return;importing=true;$("importSave").disabled=true;try{const existing=new Map(stores.map(s=>[(s.name||s.originalName||"").replace(/[\\s　]+/g,"").toLowerCase(),s]));const merged=parsed.map((s,i)=>{const old=existing.get((s.name||"").replace(/[\\s　]+/g,"").toLowerCase());return {...s,storeId:old?.storeId||s.storeId||"" ,aliases:old?.aliases?.length?s.aliases.length?s.aliases:old.aliases:s.aliases,navigation:s.navigation||old?.navigation||"",note:s.note||old?.note||"",routeOrder:i+1}});const d=await api("/api/base",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({routeId,expectedVersion:baseVersion,stores:merged})});stores=Array.isArray(d.base?.stores)?d.base.stores:parsed;await load();$("importBox").style.display="none";$("summary").innerHTML="<strong>"+stores.length+"</strong><span>家门店 · 已更新</span>"}catch(e){$("importPreview").textContent=err(e)}finally{importing=false;$("importSave").disabled=false}};
function openEditor(index=-1){editingIndex=index;const s=index>=0?stores[index]:{name:"",originalName:"",navigation:"",note:""};$("editTitle").textContent=index>=0?"编辑门店":"新增门店";$("editName").value=s.name||s.originalName||"";$("editNavigation").value=s.navigation||"";$("editNote").value=s.note||"";$("editError").textContent="";$("editBox").style.display="flex";setTimeout(()=>$("editName").focus(),0)}
function closeEditor(){$("editBox").style.display="none";editingIndex=-1}
function askConfirm(title,message){return new Promise(resolve=>{if(confirming){resolve(false);return}confirming=true;$("confirmTitle").textContent=title;$("confirmMessage").textContent=message;$("confirmBox").style.display="flex";const finish=value=>{confirming=false;$("confirmBox").style.display="none";resolve(value)};$("confirmCancel").onclick=()=>finish(false);$("confirmOk").onclick=()=>finish(true)})}
$("editClose").onclick=closeEditor;$("editCancel").onclick=closeEditor;
$("editSave").onclick=()=>{const name=$("editName").value.trim();if(!name){$("editError").textContent="请输入门店名称";$("editName").focus();return}const item=editingIndex>=0?stores[editingIndex]:{storeId:"",originalName:"",aliases:[],routeOrder:stores.length+1};item.name=name;if(!item.originalName)item.originalName=name;item.navigation=$("editNavigation").value.trim();item.note=$("editNote").value.trim();if(editingIndex<0)stores.push(item);stores.forEach((s,i)=>s.routeOrder=i+1);closeEditor();render()};
$("addStore").onclick=()=>openEditor(-1);
document.addEventListener("click",e=>{if(!e.target.closest(".data-store-more")&&!e.target.closest(".data-store-menu"))document.querySelectorAll(".data-store-menu.open").forEach(x=>x.classList.remove("open"));const b=e.target.closest("#stores button");if(!b)return;if(b.dataset.menu!==undefined){const panel=document.querySelector('[data-menu-panel="'+b.dataset.menu+'"]');document.querySelectorAll(".data-store-menu.open").forEach(x=>{if(x!==panel)x.classList.remove("open")});panel?.classList.toggle("open");return}const i=Number(b.dataset.edit??b.dataset.del??b.dataset.up??b.dataset.down);if(!Number.isInteger(i)||i<0||i>=stores.length)return;if(b.dataset.edit!==undefined){document.querySelectorAll(".data-store-menu.open").forEach(x=>x.classList.remove("open"));openEditor(i);return}else if(b.dataset.del!==undefined){document.querySelectorAll(".data-store-menu.open").forEach(x=>x.classList.remove("open"));askConfirm("删除门店","确定删除“"+(stores[i].name||stores[i].originalName||"该门店")+"”吗？").then(ok=>{if(!ok)return;stores.splice(i,1);stores.forEach((s,n)=>s.routeOrder=n+1);render()})}else if(b.dataset.up!==undefined&&i>0){[stores[i-1],stores[i]]=[stores[i],stores[i-1]];stores.forEach((s,n)=>s.routeOrder=n+1);render()}else if(b.dataset.down!==undefined&&i<stores.length-1){[stores[i],stores[i+1]]=[stores[i+1],stores[i]];stores.forEach((s,n)=>s.routeOrder=n+1);render()}});
$("saveStores").onclick=async()=>{if(saving)return;saving=true;$("saveStores").disabled=true;try{const d=await api("/api/base",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({routeId,expectedVersion:baseVersion,stores})});stores=d.base?.stores||stores;baseVersion=Number(d.base?.version)||baseVersion;render();$("summary").innerHTML="<strong>"+stores.length+"</strong><span>家门店 · 已保存</span>"}catch(e){if(e.code==="BASE_VERSION_CONFLICT")await load();$("summary").textContent=err(e)}finally{saving=false;$("saveStores").disabled=false}};
async function load(){
 try{
  const d=await api("/api/dispatch"); routeId=d.dispatchRoute?.id||"";
  if(!routeId){$("hint").textContent="请先在首页选择调度线路";$("stores").textContent="暂无可查看的数据资料";return}
  if(routeId==="__temporary__"){$("title").textContent="临时线路 · 数据资料";$("hint").textContent="临时线路不建立正式数据资料";$("summary").innerHTML="<strong>临时</strong><span>线路</span>";$("stores").textContent="临时线路使用全局学习识别门店，规划按运单原始顺序排列。";return}
  const x=await api("/api/base?routeId="+encodeURIComponent(routeId));
  canMaintain=!!x.canMaintain; $("tools").style.display=canMaintain?"block":"none"; $("maintainTools").style.display=canMaintain?"grid":"none"; stores=Array.isArray(x.base?.stores)?x.base.stores:[];baseVersion=Number(x.base?.version)||1;
  $("title").textContent=(x.route?.name||"当前线路")+" · 数据中心";
  $("hint").textContent=canMaintain?"你正在维护该线路的数据资料":"当前为查看模式，你不是该线路维护人员，不能修改数据资料";
  $("summary").innerHTML="<strong>"+stores.length+"</strong><span>家门店</span>"+(x.base?.version?"<span class=\"data-summary-dot\"></span><span>版本 "+x.base.version+"</span>":"");
  render();
 }catch(e){$("hint").textContent=err(e);$("stores").textContent="数据资料加载失败"}
}
load();
</script></body></html>
