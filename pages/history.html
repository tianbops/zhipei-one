<meta name="apple-mobile-web-app-title" content="智配One"><link rel="stylesheet" href="/css/app.css?v=3e3b6370"><link rel="stylesheet" href="/css/ui-unified.css?v=5faf6a46"><link rel="stylesheet" href="/css/mobile-ui.css?v=285d41d0"><link rel="stylesheet" href="/css/history.css?v=7e4ffb05"></head><body><main class="shell history-shell"><header class="topbar"><a class="app-back" href="/home.html" aria-label="返回首页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><strong>历史查询</strong><span class="history-topbar-placeholder" aria-hidden="true"></span></header><section class="card history-card"><header class="history-page-head"><strong>历史记录</strong></header><form id="historySearchForm" class="history-search" role="search"><input id="historySearchInput" type="search" maxlength="80" autocomplete="off" placeholder="搜索姓名、电话、地址、运单号或门店" aria-label="搜索历史运单"><select id="historySearchMonths" aria-label="搜索时间范围"><option value="3">近3个月</option><option value="6">近6个月</option><option value="13">近13个月</option></select><button type="submit" class="zp-btn zp-btn--primary">搜索</button></form><hr class="history-divider"><div class="history-actions"><p class="history-actions-label">常用操作</p><div class="history-actions-grid"><button id="historyLookupBtn" type="button" class="zp-btn zp-btn--secondary">查客户</button><button id="historyExportBtn" type="button" class="zp-btn zp-btn--secondary">导出</button><button id="historyTrashBtn" type="button" class="zp-btn zp-btn--secondary">回收站</button></div></div><hr class="history-divider"><div class="history-secondary-row"><button id="historyPickerBtn" type="button" class="zp-btn zp-btn--ghost">选择日期</button></div><div id="historySearchState" class="history-search-state" aria-live="polite"></div><div id="historySearchResults" class="history-search-results" hidden></div><div id="historyState" class="history-state">正在读取历史记录…</div><div id="historyList" class="history-list"></div></section><div id="historyOverlay" class="history-dialog" hidden><div class="history-dialog-panel" id="historyOverlayPanel" role="dialog" aria-modal="true"></div></div></main><div id="historyPicker" class="history-picker" hidden><div class="history-picker-panel"><div class="history-picker-head"><button id="historyPickerPrev" type="button" aria-label="上个月">‹</button><strong id="historyPickerTitle"></strong><button id="historyPickerNext" type="button" aria-label="下个月">›</button></div><div class="history-calendar-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="historyPickerGrid" class="history-calendar-grid"></div><p>仅可选择已有历史记录的日期 · 左右滑动切换月份</p><button id="historyPickerClose" class="history-picker-close" type="button">关闭</button></div></div><div id="historyDialog" class="history-dialog" hidden><div class="history-dialog-panel" role="dialog" aria-modal="true"><strong id="historyDialogTitle">删除历史记录</strong><p id="historyDialogText">确定删除这条历史记录吗？删除后不可恢复。</p><div class="history-dialog-actions"><button id="historyCancel" type="button">取消</button><button id="historyConfirm" type="button">确定</button></div></div></div><script src="/js/history.js?v=56ca9150"></script><script src="/js/ui-unified.js?v=51683d26"></script><script src="/js/pwa.js?v=864ce384"></script>
