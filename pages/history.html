<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>历史查询 · 智配One</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/mobile-ui.css"><link rel="stylesheet" href="/css/history.css"></head><body><main class="shell history-shell"><header class="topbar"><strong>历史查询</strong><a class="text-button" href="/home.html">返回</a></header><section class="card history-card"><div class="history-toolbar"><strong>历史日期</strong><button id="historyPickerBtn" type="button">选择日期</button></div><div id="historyState" class="history-state">正在读取历史记录…</div><div id="historyList" class="history-list"></div></section></main><div id="historyPicker" class="history-picker" hidden><div class="history-picker-panel"><div class="history-picker-head"><button id="historyPickerPrev" type="button" aria-label="上个月">‹</button><strong id="historyPickerTitle"></strong><button id="historyPickerNext" type="button" aria-label="下个月">›</button></div><div class="history-calendar-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="historyPickerGrid" class="history-calendar-grid"></div><p>仅可选择已有历史记录的日期</p><button id="historyPickerClose" class="history-picker-close" type="button">关闭</button></div></div><div id="historyDialog" class="history-dialog" hidden><div class="history-dialog-panel" role="dialog" aria-modal="true"><strong id="historyDialogTitle">删除历史记录</strong><p id="historyDialogText">确定删除这条历史记录吗？删除后不可恢复。</p><div class="history-dialog-actions"><button id="historyCancel" type="button">取消</button><button id="historyConfirm" type="button">确定</button></div></div></div><script src="/js/history.js?v=20261001-1"></script></body></html>
