<!doctype html>
<html lang="zh-CN">
<head><script>try{var t=localStorage.getItem("zp_appearance_theme")||"system";var r=(t==="light"||t==="dark")?t:(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.setAttribute("data-zp-theme",r);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",r==="light"?"#F6F7F9":"#121826");}catch(e){}</script><script src="/js/theme-sync.js?v=2c1a5bbc"></script>

<style>
.zp-offline{min-width:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--zp-bg);box-sizing:border-box}
.zp-offline-card{width:min(100%,360px);padding:28px 22px;border:1px solid var(--zp-tint);border-radius:18px;background:var(--zp-card-translucent-2);text-align:center}
.zp-offline-card img{width:64px;height:64px;margin-bottom:14px}
.zp-offline-card h1{margin:0;color:var(--zp-text);font-size:18px;line-height:24px;font-weight:700}
.zp-offline-card p{margin:10px 0 0;color:var(--zp-muted);font-size:14px;line-height:22px}

</head>
<body>
<main class="zp-offline">

<script>
document.getElementById("retry").onclick=function(){location.reload()};
</script>
