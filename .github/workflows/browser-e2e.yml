name: Browser UI regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit button visual parameters
        run: npm run verify:css-button-audit
      - name: Audit card and row visual parameters
        run: npm run verify:css-cardrow
      - name: Report potentially unused CSS selectors
        run: npm run verify:css-deadcode
      - name: Verify light/dark popup and native picker contracts
        run: npm run test:theme-popups
      # runner 默认不带 CJK 字体：汉字会退化成 8px 宽的 .notdef 方块，
      # 「长门店名必须溢出、可左滑」这类按真实文字宽度断言的用例会整片误报
      # （2026-11-06 main 首发即因此 29/38）。真机有系统中文字体，CI 必须补齐。
      - name: Install CJK fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Verify startup skeleton and snapshot rendering
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-startup-skeleton.cjs
      - name: Verify first-frame ready handshake
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-boot-ready.cjs
      - name: Verify page navigation and back stack
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-nav-back-stack.cjs
      - name: Verify cross-page statistics and narrow layouts
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-stats-scope.cjs
      - name: Verify home brand block spacing
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-home-brand-gap.cjs
      - name: Verify today delivery list expands at every viewport
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-home-today-expand.cjs
      - name: Verify store map navigation targets
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-mapnav.cjs
      - name: Verify data center auto-locates pasted map links
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-data-auto-geo.cjs
      - name: Verify share-text links resolve and geo failures are visible
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-data-geo-input.cjs
      - name: Verify Amap/Baidu/QQ map links all resolve into GCJ-02 coords
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-data-geo-providers.cjs
      - name: Verify store short name only changes waybill display
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-store-short-name.cjs
      - name: Verify same-day multiple waybills switch inside one card
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-today-multi-order.cjs
      - name: Verify merged waybills can be restored from history trash
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-history-superseded.cjs
      - name: Verify swiping right never deletes a store
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-data-swipe.cjs
      - name: Verify data center back goes to route maintenance
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-data-back.cjs
      - name: Verify Android system gesture back returns to route maintenance
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-data-back-system.cjs
      - name: Verify history month reveals from the top
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-history-month-reveal.cjs
      - name: Verify dispatch page text hierarchy
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-dispatch-text-layout.cjs
      - name: Verify account page bottom breathing room
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-account-bottom-gap.cjs
      - name: Verify account copyright line
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-account-copyright.cjs
      - name: Verify account footer three-block spacing
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-account-footer-spacing.cjs
      - name: Verify second back gesture exits the site from home
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-home-exit-back.cjs
      - name: Verify floating nav leaves no residue when hidden
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e-nav-hide-residue.cjs
      - name: Verify standalone admin workspace isolation
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          python3 -m http.server 8099 --directory . >/tmp/zp-admin-standalone-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8099/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/e2e-admin-standalone-isolation.cjs
