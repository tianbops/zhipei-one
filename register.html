<!doctype html>
<html lang="zh-CN">
<head>
<script src="/js/error-guard.js?v=da1b8353"></script><script>try{var t=localStorage.getItem("zp_appearance_theme")||"system";var r=(t==="light"||t==="dark")?t:(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.setAttribute("data-zp-theme",r);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",r==="light"?"#FFFFFF":"#161616");}catch(e){}</script><script src="/js/theme-sync.js?v=e56e8350"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>智配One · 注册</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)"><meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=25f1ad28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="智配One">
<link rel="stylesheet" href="/css/app.css?v=3e4da6dd"><link rel="stylesheet" href="/css/ui-base.css?v=dff6126b"><link rel="stylesheet" href="/css/ui-overlay.css?v=5d74e5e7"><link rel="stylesheet" href="/css/ui-theme.css?v=eb09ffcc"><link rel="stylesheet" href="/css/ui-shell.css?v=8537d8fb"><link rel="stylesheet" href="/css/entry-brand.css?v=cdf9fe5e">

</head>
<body>
<main class="login-shell">
<section class="login-card">
<div class="login-brand">
<div class="login-brand-row"><span class="login-brand-logo"><img class="login-brand-mark" src="/assets/icons/icon-192.png?v=4d3f7fd9" width="88" height="88" alt="智配One 标志"></span><span class="login-brand-name">智配One</span></div>
<p class="login-sub">注册后，加入你的配送线路。</p>
</div>

<form id="registerForm" class="login-form">
<label class="login-field">
<span>账号</span>
<input id="username" autocomplete="username" placeholder="请输入账号" required maxlength="32">
</label>

<label class="login-field">
<span>密码</span>
<input id="password" type="password" autocomplete="new-password" placeholder="请输入密码" minlength="8" required>
</label>

<label class="login-field">
<span>确认密码</span>
<input id="confirmPassword" type="password" autocomplete="new-password" placeholder="请再次输入密码" minlength="8" required>
</label>

<label class="login-field">
<span>邀请码</span>
<input id="inviteCode" autocomplete="off" placeholder="请输入管理员提供的邀请码" required maxlength="64">
</label>

<div id="registerMessage" class="login-message" role="alert"></div>
<button id="registerButton" class="login-submit" type="submit">注册</button>
</form>

<div class="login-links">
<a href="/">返回登录</a>
</div>
</section>
</main>
<script src="/js/ui/feedback.js?v=8a4741f4"></script><script src="/js/register.js?v=f1e25f2e"></script>
<script src="/js/pwa.js?v=68dbac73"></script>
<script defer src="/js/boot-ready.js?v=4e3f49ea"></script>
</body>
</html>
