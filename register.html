<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>智配One · 注册</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="auth-shell"><section class="auth-card"><img src="/assets/logo.png" class="logo" alt="智配One"><h1>注册</h1><p>Zhipei One</p><form id="registerForm"><label>账号<input id="username" autocomplete="username" required maxlength="32"></label><label>名称<input id="name" autocomplete="name" maxlength="40" placeholder="可选"></label><label>邀请码<input id="inviteCode" autocomplete="off" required maxlength="64" placeholder="请输入管理员提供的邀请码"></label><label>密码<input id="password" type="password" autocomplete="new-password" minlength="6" required></label><label>确认密码<input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required></label><div id="registerMessage" class="message"></div><button id="registerButton" type="submit">注册</button></form><p><a href="/">返回登录</a></p></section></main><script src="/js/register.js"></script></body></html>
