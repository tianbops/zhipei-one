<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>智配One · 注册</title>
<link rel="stylesheet" href="/css/app.css">
<style>
.password-field{position:relative}
.password-field input{padding-right:52px}
.password-toggle{position:absolute;right:10px;bottom:0;width:40px;height:50px;padding:0;border:0;background:transparent;color:#8f9aa6;display:flex;align-items:center;justify-content:center;cursor:pointer}
.password-toggle:hover{color:#d5dce2}
.password-toggle svg{width:20px;height:20px;pointer-events:none}
</style>
</head>
<body>
<main class="auth-shell">
<section class="auth-card">
<img src="/assets/logo.png" class="logo" alt="智配One">
<h1>注册</h1>
<p>智配One</p>
<form id="registerForm">
<label>账号<input id="username" autocomplete="username" required maxlength="32"></label>
<label>名称<input id="name" autocomplete="name" maxlength="40" placeholder="可选"></label>
<label>邀请码<input id="inviteCode" autocomplete="off" required maxlength="64" placeholder="请输入管理员提供的邀请码"></label>
<label class="password-field">密码
<input id="password" type="password" autocomplete="new-password" minlength="6" required>
<button type="button" class="password-toggle" data-password-toggle="password" aria-label="显示密码" aria-pressed="false">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 12s3.2-5 9.8-5 9.8 5 9.8 5-3.2 5-9.8 5-9.8-5-9.8-5Z"/><circle cx="12" cy="12" r="2.5"/></svg>
</button>
</label>
<label class="password-field">确认密码
<input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
<button type="button" class="password-toggle" data-password-toggle="confirmPassword" aria-label="显示密码" aria-pressed="false">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 12s3.2-5 9.8-5 9.8 5 9.8 5-3.2 5-9.8 5-9.8-5-9.8-5Z"/><circle cx="12" cy="12" r="2.5"/></svg>
</button>
</label>
<div id="registerMessage" class="message"></div>
<button id="registerButton" type="submit">注册</button>
</form>
<p><a href="/">返回登录</a></p>
</section>
</main>
<script src="/js/register.js"></script>
</body>
</html>
